/* Prozedurale Roughness-Variation (Canvas, kein Datei-Asset).
   Spritzguss-PP ist nie gleichmäßig glatt; Amplitude ca. ±0,06. */
function noiseTexture(seed, size = 512) {
  let s = seed * 9301 + 49297;
  const rnd = () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
  const grids = [8, 24, 96].map((n) => {
    const g = new Float32Array((n + 1) * (n + 1));
    for (let i = 0; i < g.length; i++) g[i] = rnd();
    return { n, g };
  });
  const smp = ({ n, g }, u, v) => {
    const x = u * n, y = v * n;
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = x - x0, fy = y - y0;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const i = (xx, yy) => g[Math.min(n, yy) * (n + 1) + Math.min(n, xx)];
    return (
      i(x0, y0) * (1 - sx) * (1 - sy) + i(x0 + 1, y0) * sx * (1 - sy) +
      i(x0, y0 + 1) * (1 - sx) * sy + i(x0 + 1, y0 + 1) * sx * sy
    );
  };
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      const n = smp(grids[0], u, v) * 0.55 + smp(grids[1], u, v) * 0.3 + smp(grids[2], u, v) * 0.15;
      const val = Math.round(255 * (0.86 + 0.14 * n));
      const o = (y * size + x) * 4;
      img.data[o] = img.data[o + 1] = img.data[o + 2] = val;
      img.data[o + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 2);
  t.anisotropy = 4;
  return t;
}

/* Kantenverschleiß: an Fasen und Riffelkanten Roughness absenken
   (Politur durch Handhabung) — Maske kommt als aWear-Attribut aus
   der Geometrie. Meshes ohne das Attribut lesen 0. */
function patchWear(mat, amount = 0.42) {
  mat.onBeforeCompile = (shader) => {
    shader.vertexShader =
      'attribute float aWear;\nvarying float vWear;\n' +
      shader.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n  vWear = aWear;'
      );
    shader.fragmentShader =
      'varying float vWear;\n' +
      shader.fragmentShader.replace(
        '#include <roughnessmap_fragment>',
        '#include <roughnessmap_fragment>\n  roughnessFactor *= (1.0 - ' +
          amount.toFixed(2) + ' * clamp(vWear, 0.0, 1.0));'
      );
  };
  mat.customProgramCacheKey = () => 'wear' + amount;
  return mat;
}

function build(key, recipe, tex) {
  const p = {
    name: key,
    color: new THREE.Color(recipe.color),
    roughness: recipe.roughness,
    metalness: recipe.metalness ?? 0,
    envMapIntensity: recipe.envMapIntensity ?? 1,
  };
  if (recipe.clearcoat !== undefined) {
    p.clearcoat = recipe.clearcoat;
    p.clearcoatRoughness = recipe.clearcoatRoughness ?? 0.4;
  }
  if (recipe.sheen !== undefined) {
    p.sheen = recipe.sheen;
    p.sheenColor = recipe.sheenColor
      ? new THREE.Color(recipe.sheenColor)
      : new THREE.Color(recipe.color).lerp(new THREE.Color('#ffffff'), recipe.sheenFrom ?? 0.25);
    if (recipe.sheenRoughness !== undefined) p.sheenRoughness = recipe.sheenRoughness;
  }
  if (tex) p.roughnessMap = tex;
  const m = new THREE.MeshPhysicalMaterial(p);
  return recipe.wear ? patchWear(m, recipe.wear) : m;
}

/* materials(['pprGreen','ptfe','epdm']) → { pprGreen, pprGreenB, ptfe,
   epdm, caps: {…}, _all, _tex }.

   caps sind die Schnittflächen: dieselbe Farbe abgedunkelt, matt,
   DoubleSide — die Schnittfläche muss massiv wirken, nicht wie eine
   Lücke im Bauteil. */
function materials(keys, seed = 17) {
  const need = keys.some((k) => MAT[k] && MAT[k].noise);
  const tA = need ? noiseTexture(seed) : null;
  const tB = need ? noiseTexture(seed * 247 + 12) /* 17 -> 4211, wie bisher */ : null;
  const M = { _all: [], _tex: [tA, tB].filter(Boolean), caps: {} };

  for (const key of keys) {
    const recipe = MAT[key];
    if (!recipe) throw new Error('K-Aqua: unbekannter Materialschlüssel "' + key + '"');
    M[key] = build(key, recipe, recipe.noise ? tA : null);
    M._all.push(M[key]);
    if (recipe.noise) {
      M[key + 'B'] = build(key + 'B', recipe, tB);
      M._all.push(M[key + 'B']);
    }
  }

  for (const key of Object.keys(M)) {
    if (key.startsWith('_') || key === 'caps') continue;
    const src = M[key];
    const c = new THREE.MeshStandardMaterial({
      name: 'section_' + key,
      color: src.color.clone().multiplyScalar(0.46),
      roughness: 0.95,
      metalness: 0,
      side: THREE.DoubleSide,
    });
    M.caps[key] = c;
    M._all.push(c);
  }
  return M;
}

function disposeMaterials(M) {
  if (!M) return;
  M._all.forEach((m) => m.dispose());
  M._tex.forEach((t) => t.dispose());
}


/* == core/assembly.js ================================================== */
/* K-Aqua 3D · Core — Baugruppe.

   Die Mechanik, die jedes Produkt beim Zusammenbau braucht, damit im
   Produktpaket nur Konturen übrig bleiben:

     · Teil anlegen: Gruppe + Mesh + Schnittfläche + Spiegelung
     · Explosion: Versatzvektor je Teil, ein Regler
     · Schnitt: Clipping-Ebene auf alle Basismaterialien, Stencil-Caps ein
     · Prüfwerkzeuge: Silhouetten-/Graustufenmodus, Box3, axialer Raycast
     · dispose(): alles freigeben

   Maße in Millimetern. Die Skalierung auf Meter macht der Viewer —
   deshalb rechnet hier nichts mit 0.001. */


const CAP_Z = 0.16; // mm — Schnittfläche minimal vor der Clipping-Ebene

function createAssembly(opt = {}) {
  const M = materials(opt.materials || ['pprGreen'], opt.seed ?? 17);
  let plane = opt.clipPlane || null;
  const root = new THREE.Group();
  root.name = opt.name || 'kaqua_part';

  const geos = [];
  const caps = [];
  const groups = {};
  const parts = [];
  const anchors = [];
  const dims = [];
  const hotspots = [];
  const lights = [];
  const baseKeys = new Set();

  /* part(id, spec)
       label    Anzeigename (Explosionsansicht)
       mat      Materialschlüssel aus der Registry
       geo/cap  aus dem Produkt-parts.js
       parent   Elterngruppe (z. B. ein Rotor), Default root
       mirror   um Y drehen statt spiegeln — Normalen bleiben korrekt
       explode  Vector3 oder Zahl (= X), Versatz bei t = 1
       anchor   Vector3 für das Beschriftungslabel
       noExplodeEntry  aus parts weglassen (rein geometrische Hilfsteile) */
  /* Ein einziges NaN in einem Teil macht die Bounding-Box der GANZEN
     Baugruppe ungültig, die Kamera bekommt keinen Rahmen und die Seite
     bleibt LEER — während jede Maßprüfung weiter 0,00 mm meldet, solange
     sie das betroffene Teil nicht anfasst.

     Genau so passiert am 24.08.2026 beim Kugelhahn mit Messingkugel:
     eine Parameterzeile stand vor der Zeile, aus der sie rechnete, die
     O-Ringe wurden NaN, alle acht Maße blieben grün und die Ansicht war
     weiß. Aufgefallen ist es nur am Blick auf die Seite (Fall 38).

     Der Prüfling meldet sich jetzt selbst. Kosten: ein Durchlauf über
     die Positionen bei jedem Teil, einmal je Aufbau. */
  function pruefeGeometrie(id, geo) {
    if (!geo) throw new Error('K-Aqua: Teil "' + id + '" hat keine Geometrie');
    const pos = geo.attributes && geo.attributes.position;
    if (!pos) throw new Error('K-Aqua: Teil "' + id + '" hat keine Positionen');
    const a = pos.array;
    for (let i = 0; i < a.length; i++) {
      if (!Number.isFinite(a[i])) {
        throw new Error('K-Aqua: Teil "' + id + '" hat einen ungültigen Punkt an ' +
          'Stelle ' + i + ' (' + a[i] + '). Ein einziges NaN leert die ganze ' +
          'Ansicht, ohne dass ein Maß es merkt.');
      }
    }
  }

  function part(id, spec) {
    const g = new THREE.Group();
    g.name = spec.name || id;
    const mat = M[spec.mat];
    if (!mat) throw new Error('K-Aqua: Material "' + spec.mat + '" nicht angefordert (' + id + ')');
    baseKeys.add(spec.mat);
    pruefeGeometrie(id, spec.geo);
    const mesh = new THREE.Mesh(spec.geo, mat);
    mesh.name = g.name;
    g.add(mesh);
    geos.push(spec.geo);
    if (spec.cap) {
      const cap = new THREE.Mesh(spec.cap, M.caps[spec.mat]);
      cap.name = g.name + '_Schnitt';
      cap.position.z = spec.mirror ? CAP_Z : -CAP_Z;
      cap.visible = false;
      cap.castShadow = false;
      cap.receiveShadow = false;
      g.add(cap);
      caps.push(cap);
      geos.push(spec.cap);
    }
    if (spec.mirror) g.rotation.y = Math.PI;
    (spec.parent || root).add(g);
    groups[id] = g;

    const ex = spec.explode === undefined ? new THREE.Vector3()
      : typeof spec.explode === 'number' ? new THREE.Vector3(spec.explode, 0, 0)
      : spec.explode;
    if (!spec.noExplodeEntry) {
      parts.push({ id, label: spec.label || g.name, obj: g, explode: ex });
    }
    if (spec.anchor) anchors.push({ id, label: spec.label || g.name, obj: g, v: spec.anchor });
    return g;
  }

  function subgroup(name, parent) {
    const g = new THREE.Group();
    g.name = name;
    (parent || root).add(g);
    return g;
  }

  /* ── Prüfwerkzeuge ── */
  function baseMaterials() {
    return [...baseKeys].map((k) => M[k]).filter(Boolean);
  }

  /* Box3 nur über die SICHTBAREN Meshes eines Teils. Die normale
     boxOf() erfasst auch die Schnittflächen-Stencils: die sind
     visible = false, aber Box3.setFromObject traversiert die ganze
     Gruppe, und ein Stencil deckt die volle Profilausdehnung ab.

     Für Maße am Bauteil ist boxOf() richtig — der Stencil liegt in der
     Profilebene und ändert die Ausdehnung dort nicht. Für Prüfungen der
     LÄNGSaufteilung (welches Teil endet wo) verfälscht er das Ergebnis.
     Dann diese Fassung nehmen. */
  function visibleBoxOf(ids) {
    root.updateMatrixWorld(true);
    const box = new THREE.Box3();
    (ids || Object.keys(groups)).forEach((id) => {
      const g = groups[id];
      if (!g) return;
      g.traverse((o) => {
        if (o.isMesh && o.visible && !/_Schnitt$/.test(o.name)) {
          box.expandByObject(o);
        }
      });
    });
    return box;
  }

  function boxOf(ids) {
    root.updateMatrixWorld(true);
    const box = new THREE.Box3();
    (ids || Object.keys(groups)).forEach((id) => {
      if (groups[id]) box.union(new THREE.Box3().setFromObject(groups[id]));
    });
    return box;
  }

  /* Axialer Raycast: von außen auf ein Teil schießen und die erste
     Trefferkoordinate liefern. Für Muffentiefen, Bohrungsgründe,
     Gewindeanfänge — jedes Muffenprodukt braucht das. */
  function probeAxial(id, from, dir) {
    root.updateMatrixWorld(true);
    const g = groups[id];
    if (!g) return NaN;
    const rc = new THREE.Raycaster();
    rc.set(from.clone(), dir.clone().normalize());
    const hit = rc.intersectObject(g, true)[0];
    return hit ? hit.point : null;
  }

  function triangleCount() {
    let tris = 0, meshes = 0;
    root.traverse((o) => {
      if (o.isMesh && o.visible) {
        meshes++;
        const g = o.geometry;
        tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      }
    });
    return { tris: Math.round(tris), meshes };
  }

  function setTestMode(mode) {
    baseMaterials().forEach((m) => {
      if (m.userData.orig === undefined) {
        m.userData.orig = {
          color: m.color.getHex(), rough: m.roughness,
          cc: m.clearcoat ?? 0, mt: m.metalness,
        };
      }
      const o = m.userData.orig;
      if (mode === 'silhouette') {
        m.color.setHex(0xffffff); m.roughness = 1; m.metalness = 0;
        if ('clearcoat' in m) m.clearcoat = 0;
      } else if (mode === 'gray') {
        const c = new THREE.Color(o.color);
        const l = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
        m.color.setRGB(l, l, l); m.roughness = o.rough; m.metalness = o.mt;
        if ('clearcoat' in m) m.clearcoat = o.cc;
      } else {
        m.color.setHex(o.color); m.roughness = o.rough; m.metalness = o.mt;
        if ('clearcoat' in m) m.clearcoat = o.cc;
      }
    });
  }

  const api = {
    root, M, part, subgroup, groups, parts, anchors, dims, hotspots, lights,
    geos, boxOf, visibleBoxOf, probeAxial, triangleCount, setTestMode,

    dim(spec)     { dims.push(spec); return api; },
    hotspot(spec) { hotspots.push(spec); return api; },
    light(v)      { lights.push(v); return api; },
    /* Geometrien, die nicht über part() laufen (Maßlinien, Hilfsnetze) */
    own(...g)     { geos.push(...g); return api; },

    explode: 0,
    section: false,

    setExplode(t) {
      api.explode = t;
      for (const p of parts) {
        p.obj.position.set(p.explode.x * t, p.explode.y * t, p.explode.z * t);
      }
      if (api.onExplode) api.onExplode(t);
    },

    setSection(on, clipPlane) {
      api.section = on;
      if (clipPlane !== undefined) plane = clipPlane;
      const planes = on && plane ? [plane] : [];
      baseMaterials().forEach((m) => {
        m.clippingPlanes = planes;
        m.clipShadows = true;
        m.side = on ? THREE.DoubleSide : THREE.FrontSide;
        m.needsUpdate = true; // NUM_CLIPPING_PLANES ändert sich → Shader neu bauen
      });
      caps.forEach((c) => (c.visible = on));
    },

    dispose() {
      geos.forEach((g) => g && g.dispose());
      disposeMaterials(M);
    },
  };
  return api;
}


/* == core/overlay.js =================================================== */
/* K-Aqua 3D · Core — Overlay.

   Zwei Dinge:
     1. buildDimLines() — echte Maßlinien als Liniengeometrie im Modell,
        mit Pfeilspitzen und Maßhilfslinien. Das Produkt deklariert nur
        { label, value, a, b, off }.
     2. createOverlay() — die DOM-Ebene darüber: Teilebezeichnungen,
        Maßzahlen, Hotspots. Mit Kollisionsvermeidung: ein Label sucht
        sich eine freie Höhe, statt sich über ein anderes zu legen.

   Alle Koordinaten in Millimetern, im Raum des Modell-Roots. */


function buildDimLines(dimSpecs, opt = {}) {
  const scale = opt.scale || 100;          // Bezugslänge für Pfeilgröße
  const color = opt.color ?? 0x0f172a;
  const group = new THREE.Group();
  group.name = 'Bemassung';
  group.visible = false;

  const lineMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.7 });
  const arrowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 });
  const geos = [];
  const entries = [];

  const line = (a, b) => {
    const g = new THREE.BufferGeometry().setFromPoints([a, b]);
    geos.push(g);
    group.add(new THREE.Line(g, lineMat));
  };
  const arrow = (at, dir) => {
    const h = Math.max(1.6, 0.016 * scale);
    const g = new THREE.ConeGeometry(h * 0.34, h, 10);
    geos.push(g);
    const m = new THREE.Mesh(g, arrowMat);
    m.castShadow = false;
    m.receiveShadow = false;
    m.position.copy(at);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), dir.clone().normalize());
    m.position.add(dir.clone().normalize().multiplyScalar(-h / 2));
    group.add(m);
  };

  for (const spec of dimSpecs) {
    const A = spec.a.clone(), B = spec.b.clone();
    line(A, B);
    const dir = B.clone().sub(A).normalize();
    arrow(A, dir.clone().negate());
    arrow(B, dir);
    if (spec.off) {
      line(A, A.clone().add(spec.off));
      line(B, B.clone().add(spec.off));
    }
    entries.push({
      label: spec.label,
      value: spec.value,
      unit: spec.unit ?? 'mm',
      v: A.clone().add(B).multiplyScalar(0.5),
    });
  }

  return { group, entries, geos, materials: [lineMat, arrowMat] };
}

/* ── DOM-Ebene ── */
function createOverlay({ box, ov, stage }) {
  const els = { parts: [], dims: [], hots: [] };
  const v3 = new THREE.Vector3();
  const camDir = new THREE.Vector3();

  function project(vec) {
    v3.copy(vec).project(stage.camera);
    return {
      x: (v3.x * 0.5 + 0.5) * box.clientWidth,
      y: (-v3.y * 0.5 + 0.5) * box.clientHeight,
      front: v3.z < 1,
    };
  }

  function build({ anchors, dimEntries, hotspots }) {
    ov.textContent = '';
    els.parts = (anchors || []).map((a) => {
      const el = document.createElement('div');
      el.className = 'lbl';
      el.textContent = a.label;
      ov.appendChild(el);
      return { el, a };
    });
    els.dims = (dimEntries || []).map((d) => {
      const el = document.createElement('div');
      el.className = 'dimlbl';
      el.textContent = d.label + ' = ' + String(d.value).replace('.', ',') +
        (d.unit ? ' ' + d.unit : '');
      ov.appendChild(el);
      return { el, d };
    });
    els.hots = (hotspots || []).map((h) => {
      const wrap = document.createElement('div');
      wrap.className = 'hot';
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', h.text);
      const tip = document.createElement('span');
      tip.className = 'tip';
      tip.textContent = h.text;
      wrap.append(b, tip);
      ov.appendChild(wrap);
      return { el: wrap, h };
    });
  }

  /* state: { modelRoot, explode, section, showDims, dimGroup, avoid[],
             isoAzimuth } */
  function update(state) {
    const showParts = state.explode >= 0.15;
    const taken = [];
    const br = box.getBoundingClientRect();
    for (const el of state.avoid || []) {
      if (!el || !el.offsetParent) continue;
      const pr = el.getBoundingClientRect();
      taken.push({ l: pr.left - br.left - 8, t: pr.top - br.top - 8,
        r: pr.right - br.left + 8, b: pr.bottom - br.top + 8 });
    }

    for (const { el, a } of els.parts) {
      if (!showParts) { el.classList.remove('on'); continue; }
      const p = project(a.obj.localToWorld(a.v.clone()));
      const w = el.offsetWidth, h = el.offsetHeight;
      const H = box.clientHeight;
      let y = Math.max(h / 2 + 6, Math.min(H - h / 2 - 6, p.y));
      let fits = false;
      const hits = (yy) => {
        const b = { l: p.x - w / 2 - 5, t: yy - h / 2 - 4, r: p.x + w / 2 + 5, b: yy + h / 2 + 4 };
        return taken.some((q) => b.l < q.r && b.r > q.l && b.t < q.b && b.b > q.t) ? null : b;
      };
      let rect = null;
      // freie Höhe suchen statt Label wegzulassen
      for (const dy of [0, -(h + 8), h + 8, -2 * (h + 8), 2 * (h + 8), -3 * (h + 8), 3 * (h + 8)]) {
        const yy = Math.max(h / 2 + 6, Math.min(H - h / 2 - 6, y + dy));
        rect = hits(yy);
        if (rect) { y = yy; fits = true; break; }
      }
      el.style.transform = 'translate(-50%,-50%) translate(' +
        p.x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
      const on = p.front && fits;
      el.classList.toggle('on', on);
      if (on) taken.push(rect);
    }

    // Maßlinien beziehen sich auf den montierten Zustand und die
    // Bemaßungsansicht — schräg von hinten stimmen sie nicht.
    const az = stage.azimuthDeg;
    let dAz = Math.abs(az - (state.isoAzimuth ?? -32)) % 360;
    if (dAz > 180) dAz = 360 - dAz;
    const showDims = state.showDims && dAz <= 40 && state.explode < 0.05;
    if (state.dimGroup) state.dimGroup.visible = showDims;
    for (const { el, d } of els.dims) {
      if (!showDims) { el.classList.remove('on'); continue; }
      const p = project(state.modelRoot.localToWorld(d.v.clone()));
      el.style.transform = 'translate(-50%,-50%) translate(' +
        p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px)';
      el.classList.add('on');
    }

    stage.camera.getWorldDirection(camDir);
    const showHot = state.explode < 0.05 && !state.section;
    for (const { el, h } of els.hots) {
      const facing = !h.n || h.n.dot(camDir) < -0.12;
      if (!showHot || !facing) { el.style.display = 'none'; continue; }
      const p = project(state.modelRoot.localToWorld((h.v || h.pos).clone()));
      el.style.display = p.front ? 'block' : 'none';
      el.style.transform = 'translate(-50%,-50%) translate(' +
        p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px)';
    }
  }

  return { build, update, project };
}


/* == core/ui.js ======================================================== */
/* K-Aqua 3D · Core — Bedienrahmen.

   HTML-Gerüst und CSS des Viewers. Produktneutral: Größenknöpfe,
   Metaleiste, Zustandstext und Fallback-Maßtabelle werden aus dem
   Produktvertrag erzeugt. Kein Produkt fügt eigene UI hinzu.

   features steuert, was erscheint:
     'size' 'explode' 'section' 'dims' 'presets'
   Der Auf/Zu-Knopf erscheint nur, wenn product.states gesetzt ist. */

const FRAME_CSS = String.raw`
*, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--color-bg-primary);
    color: var(--color-text-primary);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--color-text-link); text-decoration: none; }
  a:hover { color: var(--color-primary-800); }
  three-d-stage:not(:defined) { visibility: hidden; }

  .viewer {
    position: relative;
    display: grid;
    grid-template-rows: auto 1fr auto;
    /* minmax(0, 1fr) statt der Vorgabe: Grid-Elemente haben
       min-width: auto und sprengen die Spalte, sobald ein Kind breiter
       ist als der Rahmen — max-width am Container hilft dann nicht.
       Mit 37 Größenknöpfen (Reduzier-T-Stück) wuchs das Dokument auf
       1964 px, die Seite scrollte waagerecht und das Modell stand
       außermittig. Bei bis zu 14 Größen war davon nichts zu sehen. */
    grid-template-columns: minmax(0, 1fr);
    height: 100%;

  .meta dd { margin: 0; font: var(--font-weight-medium) 12px/1.2 var(--font-sans); font-variant-numeric: tabular-nums; }

  /* Bühne */
  .stagebox {

  .skeleton {

  .overlay { position: absolute; inset: 0; pointer-events: none; }
  .lbl {
    position: absolute;
    transform: translate(-50%, -50%);
    white-space: nowrap;
    font: var(--font-weight-medium) 11px/1 var(--font-sans);
    color: var(--color-text-secondary);

  .lbl.on { opacity: 1; }
  .dimlbl {

    font-variant-numeric: tabular-nums;
    color: var(--color-secondary-900);
    background: rgba(255, 255, 255, 0.92);
    border-radius: var(--radius-sm);
    padding: 2px 5px;
    opacity: 0; transition: opacity var(--duration-fast) var(--ease-default);
  }
  .dimlbl.on { opacity: 1; }
  .hot { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; }
  .hot button {
    all: unset;
    display: block; width: 14px; height: 14px; border-radius: var(--radius-full);
    background: var(--color-primary-700);
    box-shadow: 0 0 0 4px rgba(20, 122, 122, 0.18);

    font: 11px/1.45 var(--font-sans); color: var(--color-text-inverse);
    background: var(--color-secondary-900);
    border-radius: var(--radius-md); padding: 7px 10px;

  .hot:hover .tip, .hot button:focus-visible + .tip { opacity: 1; transform: translateX(-50%) translateY(0); }

  .state {
    position: absolute; left: var(--space-4); bottom: var(--space-4);

  .slider input { width: 110px; accent-color: var(--color-primary-700); }

  /* untere Leiste */
  .bar {

    box-shadow: var(--shadow-sm);
  }
  /* Die Größenleiste darf die SEITE nicht verbreitern. Ein Flex-Kind
     schrumpft ohne min-width:0 nicht unter seinen Inhalt; mit 37 Knöpfen

  .seg {
    display: flex; gap: 2px; padding: 2px;

  .seg::-webkit-scrollbar { height: 6px; }
  .seg::-webkit-scrollbar-thumb { background: var(--color-neutral-300); border-radius: 3px; }
  .seg > button { flex: 0 0 auto; }
  .seg button {
    all: unset;
    min-height: 34px; padding: 0 11px;

  .btn {

  .fallback { display: none; padding: var(--space-5); }

  .fallback th, .fallback td { border-bottom: 1px solid var(--color-border-default); padding: 5px 12px 5px 0; text-align: left; }
  .nogl .fallback { display: block; }
  .nogl three-d-stage, .nogl .edge, .nogl .slider, .nogl .state { display: none; }

  .sr {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }

  @media (max-width: 720px) {
    .viewer { padding: var(--space-3) var(--space-3) var(--space-4); gap: var(--space-2); }
    .edge { flex-direction: row; top: auto; bottom: var(--space-3); left: 50%; right: auto; transform: translateX(-50%); }
    .slider { top: auto; bottom: calc(var(--space-3) + 52px); left: 50%; right: auto; transform: translateX(-50%); }
    .state { bottom: calc(var(--space-3) + 52px); font-size: 11px; }
    .meta dl { display: none; }
  }
`;

const ICONS = {
  explode: '<path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/>',
  section: '<rect x="3.5" y="3.5" width="17" height="17" rx="3"/>' +
    '<path d="M12 3.5H6.5A3 3 0 0 0 3.5 6.5v11a3 3 0 0 0 3 3H12z" fill="currentColor" opacity=".28" stroke="none"/>' +
    '<path d="M12 3.5v17"/>',
  dims: '<path d="M3 14h18M5 14v-3.5M9.66 14v-2M14.33 14v-2M19 14v-3.5M3 18.5h18"/>',
  toggle: '<path d="M4 12h16M14 6l6 6-6 6"/>',
};
const svg = (d, w) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' +
  (w || 1.7) + '" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');
const de = (v) =>
  typeof v === 'number' || typeof v === 'string' ? String(v).replace('.', ',') : v;

/* Die Spalten der Fallback-Tabelle: alles, was dimensionKey benennt und
   in den Artikeln tatsächlich vorkommt, plus Gewicht. */
function tableColumns(product) {
  const keys = Object.keys(product.dimensionKey || {});
  const has = (k) => product.articles.some((a) => a[k] !== undefined && a[k] !== null);
  const cols = keys.filter(has);
  if (has('kg')) cols.push('kg');
  return cols;
}

function fallbackTable(product) {
  const cols = tableColumns(product);
  const head = cols.map((k) => '<th>' + esc(k === 'kg' ? 'kg' : k) + '</th>').join('');
  const rows = product.articles.map((a) =>
    '<tr><td>' + esc(a.code) + '</td>' +
    cols.map((k) => '<td>' + esc(de(a[k] ?? '—')) + '</td>').join('') + '</tr>').join('\n        ');
  return '<table>\n        <caption class="sr">Maßtabelle ' + esc(product.titleDe) + '</caption>\n' +
    '        <tr><th>Code</th>' + head + '</tr>\n        ' + rows + '\n      </table>';
}

function frameHTML(product, opt = {}) {
  const f = new Set(opt.features || ['size', 'explode', 'section', 'dims', 'presets']);
  const size = opt.size ?? product.defaultSize;
  const key = product.sizeKey || 'd';
  const first = product.articles.find((a) => String(a[key]) === String(size)) || product.articles[0];
  const meta = (product.metaFields || ['d']).map((k) =>
    '<div id="mw_' + esc(k) + '"' + (first[k] == null ? ' hidden' : '') +
    '><dt>' + esc(k === 'kg' ? 'Gewicht' : k) + '</dt><dd id="m_' + esc(k) + '">' +
    esc(k === 'kg' ? de(Number(first.kg).toFixed(2)) + ' kg' : de(first[k] ?? '—')) +
    '</dd></div>').join('');

  const edge = [];
  if (f.has('explode')) edge.push(['tExplode', 'Explosionsansicht', ICONS.explode]);
  if (f.has('section')) edge.push(['tSection', 'Schnittansicht', ICONS.section]);
  if (f.has('dims')) edge.push(['tDims', 'Bemaßung', ICONS.dims]);

  const st = product.states;
  const stateLine = st
    ? '<b>' + esc(st.open.short) + '</b> — ' + esc(st.open.note)
    : '<b>' + esc(product.titleDe) + '</b>';
  const hint = 'Ziehen zum Drehen · Scrollen zum Zoomen' +
    (st && st.pickHint ? ' · ' + esc(st.pickHint) : '');

  return `<main class="viewer" id="viewer">
  <header class="meta">
    <span class="overline">${esc(product.brandLine || 'K-Aqua')}</span>
    <span class="art" id="artNo">${esc(first.code)}</span>
    <dl id="metaList">${meta}</dl>
  </header>

  <div class="stagebox" id="stagebox" tabindex="0"
       aria-label="Interaktive 3D-Ansicht. Pfeiltasten drehen, Plus und Minus zoomen${st ? ', O schaltet auf und zu' : ''}, R setzt zurück.">
    <three-d-stage id="stage" name="${esc(product.module || 'kaqua')}-d${esc(size)}"
                   background="transparent" autorotate role="img"
                   aria-label="${esc(product.titleDe)} ${esc(first.code)}, dreidimensionale Produktansicht"></three-d-stage>
    <div class="overlay" id="ov"></div>
    <div class="skeleton" id="skel" aria-hidden="true"><span></span></div>
${edge.length ? `
    <div class="edge" role="group" aria-label="Darstellung">
${edge.map(([id, label, d]) => `      <button type="button" id="${id}" aria-pressed="false" title="${label}" aria-label="${label}">
        ${svg(d)}
      </button>`).join('\n')}
    </div>` : ''}
${f.has('explode') ? `
    <div class="slider" id="explodeWrap">
      <label for="explodeRange">Explosion</label>
      <input type="range" id="explodeRange" min="0" max="100" value="0" step="1" aria-label="Explosionsgrad">
    </div>` : ''}

    <div class="state">
      <span id="stateLbl">${stateLine}</span>
      <p class="hint">${hint}</p>
    </div>

    <div class="fallback" id="fallback">
      <p class="overline">3D-Ansicht nicht verfügbar (kein WebGL)</p>
      ${fallbackTable(product)}
    </div>
  </div>

  <footer class="bar">
${f.has('size') && product.sizes.length > 1 ? `    <div class="grp">
      <span class="overline">${esc(product.sizeTitle || 'Nennweite')}</span>
      <div class="seg" id="sizes" role="group" aria-label="Nennweite wählen">
${product.sizes.map((s) => `        <button type="button" data-d="${s}" aria-pressed="${String(s) === String(size)}">${esc(product.sizeLabel ? product.sizeLabel(s) : 'd' + s)}</button>`).join('\n')}
      </div>
    </div>` : ''}
${st ? `    <button type="button" class="btn" id="btnState" aria-pressed="true">
      ${svg(ICONS.toggle, 1.9)}
      <span id="btnStateLbl">${esc(st.closed.action)}</span>
    </button>` : ''}
    <div class="spacer"></div>
${f.has('presets') ? `    <div class="grp" id="presets" role="group" aria-label="Ansicht">
      <span class="overline">Ansicht</span>
      <button type="button" class="ghost" data-v="iso">3/4</button>
      <button type="button" class="ghost" data-v="front">Front</button>
      <button type="button" class="ghost" data-v="top">Draufsicht</button>
${f.has('section') ? '      <button type="button" class="ghost" data-v="section">Schnitt</button>' : ''}
    </div>` : ''}
  </footer>
</main>`;
}


/* == core/viewer.js ==================================================== */
/* K-Aqua 3D · Core — Viewer.

   Die Bedienlogik. Kennt nur den Produktvertrag: keine Größenliste,
   kein Bauteilname, kein Zustandstext ist hier verdrahtet.

   mount(product, opt) übernimmt den Rest:
     · WebGL-Prüfung, Fallback auf Standbild plus Maßtabelle
     · Größenwahl, Explosion, Schnitt mit Stencil-Caps, Bemaßung
     · Kamera-Presets, Tastatur, prefers-reduced-motion
     · Innenlicht, Overlay, Metaleiste, aria-label
     · window.kaqua — Prüfhaken für Phase 4 */


const ISO = { az: -32, el: 18, dist: 1 };

/* Findet die Artikelzeile zu einem Größenschlüssel. product.sizeKey
   nennt das Feld, das eine Zeile eindeutig macht — bei einstufigen
   Produkten 'd', bei reduzierten ein zusammengesetzter Schlüssel wie
   '40x25'. Ohne das kann ein Produkt mit zwei Nennweiten nicht
   adressiert werden. */
function articleOf(product, key) {
  const field = product.sizeKey || 'd';
  const a = product.articles.find((x) => String(x[field]) === String(key));
  if (!a) throw new Error('K-Aqua: unbekannte Größe ' + key + ' in ' + product.id);
  return a;
}

const dez = (v) =>
  typeof v === 'number' || typeof v === 'string' ? String(v).replace('.', ',') : v;

function mount(product, opt = {}) {
  const host = opt.host || document.body;
  const features = opt.features || ['size', 'explode', 'section', 'dims', 'presets'];

  if (opt.injectCss !== false) {
    const st = document.createElement('style');
    st.textContent = FRAME_CSS;
    document.head.appendChild(st);
  }
  if (opt.injectHtml !== false) {
    host.insertAdjacentHTML('afterbegin', frameHTML(product, { features, size: opt.size }));
  }

  const $ = (id) => document.getElementById(id);
  const viewer = $('viewer');
  const stage = $('stage');
  const ov = $('ov');
  const box = $('stagebox');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!document.createElement('canvas').getContext('webgl2')) {
    viewer.classList.add('nogl');
    const skel = $('skel');
    if (skel) skel.remove();
    return { product, ok: false };
  }

  const app = { product, stage, ok: true };
  boot();
  return app;

  async function boot() {
    if (!stage || !stage.ready) {
      throw new Error('K-Aqua: <three-d-stage> ist nicht registriert — stage.js fehlt oder ' +
        'wurde nicht geladen, bevor mount() lief.');
    }
    await stage.ready;
    const clip = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0); // verwirft z > 0

    let V = null;
    let size = opt.size ?? product.defaultSize;
    let variant = opt.variant ?? (product.variants && product.variants[0]) ?? null;
    const hasStates = !!product.states;
    let stateT = 1, stateTarget = 1, animFrom = 1, animT0 = 0;
    let explode = 0, section = false, dims = false;
    let dimLines = null;

    const overlay = createOverlay({ box, ov, stage });
    const ANIM = reduced ? 120 : 550;
    const ease = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);

    /* Innenlicht: macht Innenteile durch die Bohrung sichtbar. decay 0,
       damit nur Flächen erhellt werden, die dem Inneren zugewandt sind. */
    const innerLights = [];

    app.clip = clip;

    /* Das Produkt liefert Millimeter, die Szene rechnet in Metern.
       Die Umrechnung passiert genau hier — nicht im Produkt. */
    function rebuild() {
      const prev = V;
      const holder = new THREE.Group();
      holder.name = 'mm_to_m';
      holder.scale.setScalar(0.001);

      V = product.build(size, variant, clip);
      holder.add(V.root);

      if (V.dims && V.dims.length) {
        dimLines = buildDimLines(V.dims, { scale: V.P && V.P.L ? V.P.L : 100 });
        V.root.add(dimLines.group);
      } else {
        dimLines = null;
      }

      if (hasStates && V.setOpen) V.setOpen(stateT);
      V.setExplode(explode);
      V.setSection(section);

      stage.setAttribute('name', (product.module || 'kaqua') + '-d' + size);
      stage.setObject(holder);
      if (prev) prev.dispose();

      // Innenlicht neu setzen
      innerLights.forEach((l) => stage.scene.remove(l));
      innerLights.length = 0;
      for (const v of V.lights || []) {
        const l = new THREE.PointLight(0xfff3e2, 0.32, 0, 0);
        l.position.copy(v).multiplyScalar(0.001);
        stage.scene.add(l);
        innerLights.push(l);
      }

      overlay.build({
        anchors: V.anchors,
        dimEntries: dimLines ? dimLines.entries : [],
        hotspots: V.hotspots,
      });
      updateMeta();
    }

    function updateMeta() {
      const a = articleOf(product, size);
      const art = $('artNo');
      if (art) art.textContent = a.code;
      for (const k of product.metaFields || []) {
        const el = $('m_' + k);
        if (!el) continue;
        const wrap = $('mw_' + k);
        // Spalten, die es für diese Größe nicht gibt, verschwinden ganz —
        // ein „—" in der Metaleiste liest sich wie ein fehlender Wert.
        if (wrap) wrap.hidden = a[k] == null;
        el.textContent = k === 'kg'
          ? dez(Number(a.kg).toFixed(2)) + ' kg'
          : dez(a[k] ?? '—');
      }
      const K = product.dimensionKey || {};
      const fields = (product.ariaFields || Object.keys(K)).filter((k) => a[k] != null);
      const parts = fields.map((k) => (K[k] || k) + ' ' + dez(a[k]) + ' mm');
      if (a.kg != null) parts.push('Gewicht ' + dez(Number(a.kg).toFixed(2)) + ' kg');
      stage.setAttribute('aria-label',
        product.titleDe + ' ' + a.code + ', ' + parts.join(', ') +
        '. Dreidimensionale Produktansicht.');
    }

    /* ── Zustände ── */
    function setState(next) {
      stateTarget = next;
      animFrom = stateT;
      animT0 = performance.now();
      const on = next > 0.5;
      const s = product.states;
      const b = $('btnState');
      if (b) {
        b.setAttribute('aria-pressed', String(on));
        $('btnStateLbl').textContent = on ? s.closed.action : s.open.action;
      }
      const lbl = $('stateLbl');
      if (lbl) {
        const side = on ? s.open : s.closed;
        lbl.innerHTML = '<b>' + side.short + '</b> — ' + side.note;
      }
    }

    function setSection(on) {
      section = on;
      V.setSection(on, clip);
      const t = $('tSection');
      if (t) t.setAttribute('aria-pressed', String(on));
      if (on) {
        if (hasStates && stateTarget < 0.5) setState(1);
        // Halbschnitt bei z = 0: nur schräg sichtbar, frontal deckungsgleich
        stage.flyTo(-36, 16, 0.94, 700);
      }
    }

    function setExplodeUI(on) {
      const t = $('tExplode');
      if (t) t.setAttribute('aria-pressed', String(on));
      const wrapEl = $('explodeWrap');
      if (wrapEl) wrapEl.classList.toggle('on', on);
      if (!on) {
        const r = $('explodeRange');
        if (r) r.value = 0;
        explode = 0;
        V.setExplode(0);
      }
    }

    const sizes = $('sizes');
    if (sizes) sizes.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-d]');
      if (!b) return;
      // data-d ist immer der in einen String gewandelte Eintrag aus
      // product.sizes — also den ORIGINALWERT dort zurückholen, statt den
      // Typ zu raten. Die frühere Regel „sizeKey gesetzt = String lassen"
      // war eine zweite, abweichende Deutung von sizeKey (Fall 32): vier
      // Produkte führten sizeKey:'d' über numerischen Größen, der Klick
      // reichte '20' an ein striktes article(20) durch, und die Seite
      // stand mit gedrücktem Knopf vor dem alten Modell.
      size = product.sizes.find((s) => String(s) === b.dataset.d) ?? b.dataset.d;
      [...b.parentNode.children].forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      rebuild();
    });

    const btnState = $('btnState');
    if (btnState) btnState.addEventListener('click', () => setState(stateTarget > 0.5 ? 0 : 1));

    const tExplode = $('tExplode');
    if (tExplode) tExplode.addEventListener('click', (e) => {
      const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
      setExplodeUI(on);
      if (on) {
        $('explodeRange').value = 100;
        explode = 1;
        V.setExplode(1);
      }
    });
    const range = $('explodeRange');
    if (range) range.addEventListener('input', (e) => {
      explode = Number(e.target.value) / 100;
      V.setExplode(explode);
    });
    const tSection = $('tSection');
    if (tSection) tSection.addEventListener('click', (e) =>
      setSection(e.currentTarget.getAttribute('aria-pressed') !== 'true'));
    const tDims = $('tDims');
    if (tDims) tDims.addEventListener('click', (e) => {
      dims = e.currentTarget.getAttribute('aria-pressed') !== 'true';
      e.currentTarget.setAttribute('aria-pressed', String(dims));
      if (dims) stage.flyTo(-14, 10, 1.05, 700);
    });

    const presets = $('presets');
    if (presets) presets.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-v]');
      if (!b) return;
      const v = b.dataset.v;
      if (v === 'iso') stage.flyTo(ISO.az, ISO.el, ISO.dist, 700);
      if (v === 'front') stage.flyTo(0, 4, 1, 700);
      if (v === 'top') stage.flyTo(-8, 62, 1, 700);
      if (v === 'section') { if (!section) setSection(true); else stage.flyTo(-36, 16, 0.94, 700); }
    });

    /* Klick auf das Bedienteil schaltet den Zustand; Cursor wird pointer. */
    const pickId = hasStates && product.states.pickPart;
    if (pickId) {
      const ray = new THREE.Raycaster();
      const ptr = new THREE.Vector2();
      const pick = (ev) => {
        const g = V.groups && V.groups[pickId];
        if (!g) return false;
        const r = box.getBoundingClientRect();
        ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1,
          -((ev.clientY - r.top) / r.height) * 2 + 1);
        ray.setFromCamera(ptr, stage.camera);
        return ray.intersectObject(g, true).length > 0;
      };
      stage.addEventListener('pointermove', (e) => { box.style.cursor = pick(e) ? 'pointer' : ''; });
      stage.addEventListener('click', (e) => { if (pick(e)) setState(stateTarget > 0.5 ? 0 : 1); });
    }

    box.addEventListener('keydown', (e) => {
      const k = e.key;
      if (k === 'ArrowLeft') stage.orbitBy(-6, 0);
      else if (k === 'ArrowRight') stage.orbitBy(6, 0);
      else if (k === 'ArrowUp') stage.orbitBy(0, 5);
      else if (k === 'ArrowDown') stage.orbitBy(0, -5);
      else if (k === '+' || k === '=') stage.zoomBy(0.88);
      else if (k === '-') stage.zoomBy(1.14);
      else if ((k === 'o' || k === 'O') && hasStates) setState(stateTarget > 0.5 ? 0 : 1);
      else if (k === 'r' || k === 'R') stage.flyTo(ISO.az, ISO.el, ISO.dist, 500);
      else return;
      e.preventDefault();
    });

    const avoid = [$('explodeWrap')];
    stage.onFrame(() => {
      if (hasStates && stateT !== stateTarget) {
        const k = Math.min(1, (performance.now() - animT0) / ANIM);
        stateT = animFrom + (stateTarget - animFrom) * ease(k);
        if (k >= 1) stateT = stateTarget;
        V.setOpen(stateT);
      }
      overlay.update({
        modelRoot: V.root,
        explode, section,
        showDims: dims,
        dimGroup: dimLines ? dimLines.group : null,
        avoid: explode >= 0.15 ? avoid.filter((el) => el && el.classList.contains('on')) : [],
        isoAzimuth: ISO.az,
      });
    });

    rebuild();
    const skel = $('skel');
    if (skel) skel.remove();

    Object.assign(app, {
      get built() { return V; },
      size: () => size,
      setSize(d) { size = d; rebuild(); },
      measure: () => (V.measures || []).map((m) => ({ ...m, ist: m.ist() })),
      measureAll: () => product.sizes.map((d) => {
        const t = product.build(d, variant, clip);
        const rows = (t.measures || []).map((m) => {
          const ist = m.ist();
          return { key: m.key, soll: m.soll, ist: Math.round(ist * 100) / 100,
            diff: Math.round((ist - m.soll) * 100) / 100 };
        });
        const tri = t.triangleCount ? t.triangleCount() : null;
        t.dispose();
        return { d, rows, ...(tri || {}) };
      }),
      testMode: (m) => V.setTestMode(m),
    });
    window.kaqua = app;
  }
}


/* == core/export.js ==================================================== */
/* K-Aqua 3D · Core — Export (Teil 6).

   Regeln, die hier durchgesetzt werden:
     · GLB in Metern, Y-up — das erwarten glTF-Viewer und AR-Werkzeuge
     · OBJ in Millimetern — das erwarten CAD-Werkzeuge
     · Materialnamen = Schlüssel aus MAT, damit sie beim Reimport
       wiedererkennbar sind (macht materials() automatisch)
     · Standbilder mit transparentem Hintergrund, kein Boden, kein
       Gitter; der Kontaktschatten läuft im Alphakanal mit

   Die Web-Ansicht rechnet in Millimetern. Die Umrechnung passiert
   ausschließlich hier und im Viewer-Wrapper. */


const MM_TO_M = 0.001;

function wrapForExport(root, scale, name) {
  const g = new THREE.Group();
  g.name = name;
  g.scale.setScalar(scale);
  g.add(root);
  return g;
}

/* Baut eine Größe frisch auf, unabhängig von der Ansicht. */
function buildOne(product, size, variant) {
  const built = product.build(size, variant ?? (product.variants || [])[0] ?? null, null);
  built.setExplode(0);
  if (built.setOpen) built.setOpen(1);
  built.setSection(false);
  return built;
}

/* ── GLB: binäres glTF, Meter, Y-up ── */
async function exportGLB(product, opt = {}) {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const size = opt.size ?? product.defaultSize;
  const built = buildOne(product, size, opt.variant);
  const a = product.articles.find((x) => x.d === size);
  const scene = wrapForExport(built.root, MM_TO_M,
    (product.module || 'kaqua') + '_d' + size + (a ? '_' + a.code : ''));
  scene.userData = {
    kaqua: {
      id: product.id, article: a ? a.code : null, size,
      unit: 'm', source: 'kaqua-3d core', title: product.titleDe,
    },
  };
  const buf = await new Promise((res, rej) =>
    new GLTFExporter().parse(scene, res, rej, { binary: true, onlyVisible: true }));
  built.dispose();
  return new Blob([buf], { type: 'model/gltf-binary' });
}

/* ── Alle Nennweiten als benannte Knoten in einer Datei ── */
async function exportGLBAllSizes(product, opt = {}) {
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const scene = new THREE.Group();
  scene.name = (product.module || 'kaqua') + '_alle_groessen';
  const builts = [];
  let x = 0;
  for (const d of product.sizes) {
    const built = buildOne(product, d, opt.variant);
    const a = product.articles.find((s) => s.d === d);
    const node = wrapForExport(built.root, MM_TO_M, 'd' + d + (a ? '_' + a.code : ''));
    const box = new THREE.Box3().setFromObject(node);
    node.position.x = x - box.min.x;
    x += (box.max.x - box.min.x) * 1.25;
    scene.add(node);
    builts.push(built);
  }
  const buf = await new Promise((res, rej) =>
    new GLTFExporter().parse(scene, res, rej, { binary: true, onlyVisible: true }));
  builts.forEach((b) => b.dispose());
  return new Blob([buf], { type: 'model/gltf-binary' });
}

/* ── OBJ + MTL: Wavefront, Millimeter ── */
async function exportOBJ(product, opt = {}) {
  const { OBJExporter } = await import('three/addons/exporters/OBJExporter.js');
  const size = opt.size ?? product.defaultSize;
  const built = buildOne(product, size, opt.variant);
  const a = product.articles.find((x) => x.d === size);
  const base = (product.module || 'kaqua') + '-d' + size;
  const root = wrapForExport(built.root, 1, base); // Millimeter, keine Skalierung

  const mats = [];
  root.traverse((o) => {
    if (!o.isMesh || !o.visible) return;
    const list = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of list) if (m && !mats.includes(m)) mats.push(m);
  });

  const header = '# K-Aqua 3D — ' + product.titleDe + '\n' +
    '# Produkt-ID: ' + product.id + '\n' +
    '# Artikel: ' + (a ? a.code : '—') + '   Nennmaß: d' + size + '\n' +
    '# Einheit: Millimeter\n' +
    'mtllib ' + base + '.mtl\n';
  const obj = header + new OBJExporter().parse(root);

  let mtl = '# K-Aqua 3D — Materialnamen sind die Schlüssel der Material-Registry\n';
  for (const m of mats) {
    const c = m.color || { r: 0.8, g: 0.8, b: 0.8 };
    const rough = typeof m.roughness === 'number' ? m.roughness : 0.5;
    mtl += '\nnewmtl ' + m.name +
      '\nKd ' + c.r.toFixed(4) + ' ' + c.g.toFixed(4) + ' ' + c.b.toFixed(4) +
      '\nKa 0 0 0' +
      '\nKs ' + (1 - rough).toFixed(3) + ' ' + (1 - rough).toFixed(3) + ' ' + (1 - rough).toFixed(3) +
      '\nNs ' + Math.round((1 - rough) * 900 + 8) +
      '\nd 1\nillum 2\n';
  }
  built.dispose();
  return { obj, mtl, basename: base };
}

/* ── Standbilder ──
   views: [{ name, az, el, dist, explode, section, w, h }]
   Rendert in die vorhandene Stage, stellt Größe und Zustand danach
   wieder her. Transparenter Hintergrund; der Bodenschatten bleibt im
   Alphakanal, weil das Ground-Mesh ein ShadowMaterial ist. */
async function stills(app, views, opt = {}) {
  const stage = app.stage;
  const renderer = stage.renderer;
  const camera = stage.camera;
  const before = { w: renderer.domElement.width, h: renderer.domElement.height,
    dpr: renderer.getPixelRatio(), aspect: camera.aspect };
  const out = [];

  for (const v of views) {
    const w = v.w ?? opt.w ?? 1600;
    const h = v.h ?? opt.h ?? 1200;
    renderer.setPixelRatio(1);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    if (v.explode !== undefined) app.built.setExplode(v.explode);
    if (v.section !== undefined) app.built.setSection(v.section, v.section ? app.clip : null);
    stage.flyTo(v.az ?? -32, v.el ?? 18, v.dist ?? 1, 0);
    await new Promise((r) => requestAnimationFrame(r));
    renderer.render(stage.scene, camera);
    const blob = await new Promise((r) => renderer.domElement.toBlob(r, 'image/png'));
    out.push({ name: v.name, blob, w, h });
  }

  renderer.setPixelRatio(before.dpr);
  renderer.setSize(before.w / before.dpr, before.h / before.dpr, false);
  camera.aspect = before.aspect;
  camera.updateProjectionMatrix();
  return out;
}

/* Die Standardserie nach Teil 6. */
const STILL_VIEWS = [
  { name: 'hero',      az: -32, el: 18, dist: 1,    w: 1600, h: 1200, explode: 0, section: false },
  { name: 'front',     az: 0,   el: 4,  dist: 1,    w: 1200, h: 900,  explode: 0, section: false },
  { name: 'top',       az: -8,  el: 62, dist: 1,    w: 1200, h: 900,  explode: 0, section: false },
  { name: 'section',   az: -36, el: 16, dist: 0.94, w: 1200, h: 900,  explode: 0, section: true },
  { name: 'explosion', az: -32, el: 18, dist: 1.18, w: 1600, h: 1200, explode: 1, section: false },
];

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}



/* == _bendthread/parts.js ============================================== */
/* K-Aqua Winkel 90° mit Gewindeschenkel — gemeinsame Kontur.

   Ein 90°-Winkel, dessen zwei Schenkel VERSCHIEDEN sind: vorne eine
   Schweißmuffe für das Rohr, hinten ein Sitz für ein Messingteil. Beide
   Schenkel haben eigene Länge (die Bahn bekommt LB) und eigenen
   Außendurchmesser.

   Drei Produkte teilen ihn:
     transition-fittings/elbow-90-male-thread          Messingzapfen AG
     transition-fittings/elbow-bracket-90-female-thread      Ring IG
     transition-fittings/elbow-wall-bracket-90-female-thread Ring IG + Lasche

   Sie unterscheiden sich im Messingteil und in der Lasche, nicht im
   Körper. Dreimal dieselbe Rechnung würde driften (Fall 32) — deshalb
   steht sie hier und nicht dreimal im Produkt.

   Herkunft: bis zum 24.08.2026 stand dieser Körper in
   products/elbow-90-male-thread/parts.js. Beim Bau der beiden Laschen
   stellte sich heraus, dass er unverändert für sie taugt; verschoben,
   nicht umgeschrieben.

   Was das Produkt über P steuert:
     l, L1            Schenkelmaße ab der Achsenschnittstelle (A, B)
     rOut, rLegB      Außenradien der beiden Schenkel
     collarLen,
     collarR          Absatz vor dem Messing; collarLen = 0 heißt keiner
     socket,
     rSockGround,
     groundLen        Muffe am Schenkel A
     insertDepth,
     rInsertOut       Sitz des Messingteils am Schenkel B
     bendR, emR       Bogenradius, Auswerfermarke

   Kein CSG: Außenhaut, Innenhaut und zwei Ringflächen ergeben einen
   geschlossenen Körper. */


/* Weiche Blende 0…1, für die Übergänge zwischen den Zonen. */
const smooth = (u) => {
  const t = Math.min(1, Math.max(0, u));
  return t * t * (3 - 2 * t);
};

const SEAT_RAMP = 1.2;      // Übergang Einsatzsitz → Rohrbohrung
const SHOULDER = 3.0;       // Kegelschulter vom Gewindeschenkel auf den Bogen

/* Innenradius über der Bahn. sA ist die Bogenlänge ab der Stirnfläche
   der Muffe, sB die ab dem PP-Ende am Gewindeschenkel. Anders als beim
   symmetrischen Winkel sind die beiden Enden verschieden: vorne eine
   Schweißmuffe, hinten der Sitz für den Messingeinsatz. */
function boreAlong(P, sA, sB) {
  if (sA <= 0.001) return P.d / 2 + P.lead;
  if (sA <= 2) return P.d / 2 + P.lead * (1 - sA / 2);
  if (sA <= P.socket) return P.d / 2 - P.sockTaper * (sA - 2);
  if (sA <= P.socket + P.groundLen) {
    return P.rSockGround + (P.boreR - P.rSockGround) *
      smooth((sA - P.socket) / P.groundLen);
  }
  if (sB <= P.insertDepth) return P.rInsertOut + 0.05;
  if (sB <= P.insertDepth + SEAT_RAMP) {
    return (P.rInsertOut + 0.05) + (P.boreR - P.rInsertOut - 0.05) *
      smooth((sB - P.insertDepth) / SEAT_RAMP);
  }
  return P.boreR;
}

/* Außenradius über der Bahn. Der Muffenschenkel trägt D, der
   Gewindeschenkel den schlankeren Körper über dem Einsatz, davor der
   Absatz, den das Foto zeigt. */
function skinAlong(P, sA, sB, legB) {
  if (sA <= P.socket) return P.rOut - DRAFT * (P.socket - sA) * 0.5;
  if (sB <= P.collarLen) return P.collarR;
  if (sB <= P.collarLen + 1.2) {
    return P.collarR + (P.rLegB - P.collarR) * smooth((sB - P.collarLen) / 1.2);
  }
  if (sB >= legB - SHOULDER && sB <= legB) {
    return P.rLegB + (P.rOut - P.rLegB) * smooth((sB - (legB - SHOULDER)) / SHOULDER);
  }
  if (sB > legB) return P.rOut;
  return P.rLegB;
}

function buildElbowBody(P) {
  /* Der Winkel kommt aus P, damit auch die 45°-Varianten diesen Körper
     tragen. Ohne P.angle bleibt es bei 90 — die drei Gewindeprodukte
     bauen damit Zeichen für Zeichen wie vorher. */
  const path = bendPath(P.l, P.angle ?? 90, P.bendR, 24, 40, P.L1);
  let pathLen = 0;
  for (let i = 1; i < path.length; i++) pathLen += path[i].c.distanceTo(path[i - 1].c);

  /* Die beiden Endzonen dürfen sich nicht überschneiden — sonst
     überschreibt die eine die andere und die Bohrung bekommt eine Stufe,
     die niemand angeordnet hat. */
  const need = P.socket + P.groundLen + P.insertDepth + SEAT_RAMP;
  if (need >= pathLen) {
    throw new Error('K-Aqua ' + P.key + ': Muffe und Einsatzsitz brauchen ' +
      need.toFixed(1) + ' mm, die Bahn ist ' + pathLen.toFixed(1) + ' mm lang');
  }

  const legB = P.L1 - P.bendR;   // gerader Teil des Gewindeschenkels

  const outer = sweepPath((t) => {
    const sA = t * pathLen;
    return circleLoop(skinAlong(P, sA, pathLen - sA, legB), SEG_VIS, 0.15);
  }, path);

  const inner = sweepPath((t) => {
    const sA = t * pathLen;
    return circleLoop(boreAlong(P, sA, pathLen - sA), SEG_INT, 0.3);
  }, path, { flip: true });

  /* Ringflächen an beiden Stirnflächen. Ohne sie ist der Winkel eine
     offene Schale und die Schnittansicht zeigt Löcher. */
  const rings = [];
  for (const [idx, flip] of [[0, true], [path.length - 1, false]]) {
    const st = path[idx];
    const sA = idx === 0 ? 0 : pathLen;
    const rIn = boreAlong(P, sA, pathLen - sA);
    const rOutHere = skinAlong(P, sA, pathLen - sA, legB);
    const ring = new THREE.RingGeometry(rIn, rOutHere, SEG_VIS, 1);
    const q = new THREE.Quaternion().setFromUnitVectors(
      new THREE.Vector3(0, 0, flip ? -1 : 1), st.t.clone().normalize());
    ring.applyQuaternion(q);
    ring.translate(st.c.x, st.c.y, st.c.z);
    const n = ring.attributes.position.count;
    ring.setAttribute('aWear', new THREE.BufferAttribute(new Float32Array(n).fill(0.5), 1));
    rings.push(ring);
  }

  /* Auswerferstift-Marke auf dem Bogenrücken — ohne sie sieht das Teil
     nach CAD-Viewer aus (Visuelle Referenz §2.2). */
  const mid = path[Math.floor(path.length / 2)];
  const disc = revolve(buildProfile([
    { a: 0, r: 0, fillet: 0 },
    { a: 0, r: P.emR, chamfer: 0.25 },
    { a: 0.1, r: P.emR, fillet: 0.1 },
    { a: 0.1, r: 0, fillet: 0 },
  ], { segs: 3 }), { axis: 'y', segments: SEG_FINE });
  const nOut = mid.c.clone().setZ(0).normalize();
  disc.rotateX(Math.PI);
  disc.translate(nOut.x * (P.rOut - 0.05) + mid.c.x, nOut.y * (P.rOut - 0.05) + mid.c.y, 0);

  return { geo: mergeGeometries([outer, inner, ...rings, disc]), cap: null, path, pathLen };
}

/* Messingeinsatz. Achse ist +Y — das ist der Gewindeschenkel der Bahn.
   Der Schaft trägt drei Ringzähne; die Zeichnung zeigt sie im Schnitt
   als Verankerung im PP. Sichtbar ist außen nur das Gewinde. */


/* == _bracket/params.js ================================================ */
/* K-Aqua Anschlussbogen und Wandscheibe 90° IG — Parametrik.

   Zwei Produkte, ein Körper:
     transition-fittings/elbow-bracket-90-female-thread        AQ090G
     transition-fittings/elbow-wall-bracket-90-female-thread   AQ472G

   Sie unterscheiden sich in genau einem Merkmal — die Wandscheibe trägt
   eine Lasche mit Schraubloch. Zweimal dieselbe Rechnung würde driften
   (Fall 32).

   ── MASSSCHLÜSSEL, beide Tabellen gleich ──
     d    Rohr-Außendurchmesser = Muffenbohrung
     Rp   zylindrisches Innengewinde, in Zoll (ISO 228-1)
     D    Außendurchmesser des GEWINDESCHENKELS (senkrecht, +Y)
     L    Achse bis Stirnfläche des Gewindeschenkels
     z    Achse bis Schulter, wo der Messingring beginnt
     h    Achse bis Unterkante des Teils
     D₁   Außendurchmesser des MUFFENSCHENKELS (waagrecht, −X)
     L₁   Achse bis Stirnfläche der Muffe
     z₁   Achse bis Muffengrund

   Die Zuordnung von D zum Gewindeschenkel und D₁ zur Muffe steht in der
   Maßzeichnung: D ist oben über dem senkrechten Schenkel angesetzt, D₁
   rechts am waagrechten. Gegenprobe über die Zahlen: D₁ hängt allein an
   d (20→29, 25→34, 32→43, in allen fünf Zeilen), D dagegen wächst mit
   dem Gewinde (25×½"→35 gegen 25×¾"→43). Ein vertauschtes Paar würde
   diese Abhängigkeit zerreißen (Fall 28).

   ── L − z IST DIE RINGHÖHE ──
   Dieselbe Rolle, die beim T-Stück mit Innengewinde h − z₁ spielt
   (products/tee-90-female-thread). Werte:

     AQ090G  14 · 14 · 11 · 15 · 17 mm
     AQ472G  14 · 14 · 15 · 15 · 15 mm

   Die 11 mm bei AQ090G2534 fallen aus der Reihe — ½" bekommt dort 14.
   Der Wert ist KEIN Lesefehler: Druckkatalog S. 95 und die
   Website-Aufnahme führen ihn beide, Zeile für Zeile identisch. Zwei
   unabhängige Rang-1-Quellen bestätigen sich, also folgt das Modell der
   Tabelle (Fall 31).

   ── MUFFENTIEFE AUS DER NORMREIHE, NICHT AUS L₁ − z₁ ──
   Wie überall im Katalog: fusionDepth(d). Der Tabellenwert L₁ − z₁
   wandert als socketFromTable in den Prüfbericht (Fall 4). Gegenprobe:

     d20  27 − 11 = 16      Normreihe DVS 2207-11: 14,5
     d25  30 − 14 = 16  ·  32 − 19 = 13                16,0
     d32  36,5 − 18 = 18,5  ·  39,5 − 17 = 22,5        18,0

   Die Streuung ist größer als beim Winkel (dort ±1,5 mm). Sie steht so
   im Prüfbericht; modelliert wird die Norm, weil das Schweißwerkzeug je
   Nennweite dasselbe ist.

   ── h IST NICHT GEDEUTET (Fall 29) ──
   Die naheliegende Deutung „Achse bis Unterkante" wurde am gebauten
   Modell GEPRÜFT und ist WIDERLEGT: die Unterkante liegt in jeder
   Größe bei genau D₁/2 — 14,5 · 17 · 17 · 21,5 · 21,5 — die Tabelle
   führt aber 13 · 15 · 20 · 18 · 20. Nur eine Zeile (d25×¾") liegt
   über D₁/2, vier darunter; unter den Radius des Muffenschenkels kann
   die Unterkante eines Winkels nicht rutschen.

   Was h bezeichnet, ist damit offen und wird NICHT angesetzt. Die
   Zeichnung ist schematisch und zeigt h zwar unterhalb der Mittellinie,
   liefert aber keine Proportionen (dasselbe Bild wie beim Winkel mit
   Außengewinde).

   EIN Teil von h ist trotzdem belegt, und zwar der, den die Wandscheibe
   braucht: h ist bei AQ472G in jeder vergleichbaren Zeile genau 2 mm
   größer als bei AQ090G (15/17/22/22 gegen 13/15/20/20). Der Körper ist
   derselbe, also sind diese 2 mm das, was die Lasche unter ihm
   hervorsteht. Eine DIFFERENZ ist auch dann verwertbar, wenn der
   Bezugspunkt unbekannt ist — sie hebt ihn heraus. */


function bracketParams(a, cfg) {
  const P = Object.assign({}, a);
  const d = a.d;

  const th = threadSpec(a.Rp);
  if (!th) throw new Error('K-Aqua Anschlussbogen: kein Normmaß für Rp' + a.Rp);
  P.threadKind = 'Rp';
  P.threadLabel = a.Rp;
  P.threadOD = th.od;
  P.threadPitch = th.pitch;
  P.threadH = 0.640327 * th.pitch;
  P.threadCore = Math.round((th.od - 2 * P.threadH) * 1000) / 1000;

  /* Schenkel A = Muffe (−X), Schenkel B = Gewinde (+Y). Die Namen sind
     die von _bendthread/parts.js, damit derselbe Körper trägt. */
  P.l = a.L1;
  P.L1 = a.L;
  P.rOut = a.D1 / 2;
  P.rLegB = a.D / 2;
  P.OD = a.D1;

  P.socket = fusionDepth(d);
  if (!P.socket) throw new Error('K-Aqua Anschlussbogen d' + d + ': keine Schweißtiefe in der Normreihe');
  P.socketFromTable = a.L1 - a.z1;
  P.depthDeltaToNorm = Math.round((P.socketFromTable - P.socket) * 10) / 10;

  P.wallPipe = d / 6;                      // SDR 6
  P.bore = d - 2 * P.wallPipe;
  P.boreR = P.bore / 2;
  P.wallFitting = (a.D1 - d) / 2;
  P.restwand = P.wallFitting;
  P.sockTaper = Math.tan(0.6 * D2R);
  P.lead = 2 * Math.tan(15 * D2R);

  P.rSockGround = d / 2 - P.sockTaper * (P.socket - 2);
  P.groundLen = 1.0;
  P.probeR = P.rSockGround - 0.15;

  /* Ring aus Messing. Höhe aus der Tabelle (L − z), Außendurchmesser
     wie beim Gewinde-T-Stück: Gewinde-Ø plus Wand, gedeckelt so, dass
     über dem Ring 1,1 mm PP bleiben. */
  P.ringHeight = Math.round((a.L - a.z) * 10) / 10;
  P.insertDepth = P.ringHeight;
  P.brassOD = Math.min(a.D - 2.2, P.threadOD + 2 * Math.max(2.2, 0.09 * P.threadOD));
  P.brassR = P.brassOD / 2;
  P.rInsertOut = P.brassR;
  P.brassBottom = a.z;
  P.brassTop = a.L;
  P.restwandB = Math.round((a.D - P.brassOD) / 2 * 100) / 100;

  /* Gänge über die tragende Gewindelänge, mindestens drei — wie im
     Gewinde-T-Stück. */
  P.threadLen = P.ringHeight - 2.0;
  P.turns = Math.max(3, Math.floor((P.threadLen - 0.6) / P.threadPitch));

  /* KEIN Absatz vor dem Messing. Foto AQ090GP und das Katalogfoto S. 95
     zeigen einen glatten Zylinder bis zur Stirnfläche. collarLen = 0
     schaltet die Absatzzone in skinAlong ab. */
  P.collarLen = 0;
  P.collarR = P.rLegB;

  /* Bogenradius: er muss in BEIDE Schenkel passen. Der Muffenschenkel
     gibt l − socket her, der Gewindeschenkel L1 − Ringhöhe. */
  const maxRA = a.L1 - P.socket - 1.5;
  const maxRB = a.L - P.ringHeight - 1.5;
  P.bendR = Math.max(d * 0.22, Math.min(d * 0.5, maxRA, maxRB));

  P.emR = Math.min(2.0, 0.05 * d);

  /* Messstation für die Rohrbohrung: auf dem geraden Muffenschenkel,
     hinter der Muffe und vor dem Bogen. Das Fenster ist eng — bei
     d25×½" 0,5 mm breit — deshalb genau die Mitte. */
  const boreLo = -a.L1 + P.socket + P.groundLen;
  /* Setback statt bendR — bei 90° derselbe Wert, aber der Setback ist
     der richtige Begriff: der Bogen frisst R·tan(α/2) vom Schenkel. */
  const boreHi = -P.bendR * Math.tan((90 * D2R) / 2);
  P.xBore = Math.round(((boreLo + boreHi) / 2) * 100) / 100;
  if (!(boreHi > boreLo)) {
    throw new Error('K-Aqua ' + a.key + ': kein freier Rohrabschnitt zwischen ' +
      'Muffe und Bogen (' + boreLo.toFixed(1) + ' … ' + boreHi.toFixed(1) + ')');
  }

  if (P.restwandB < 1.0) {
    throw new Error('K-Aqua ' + a.key + ': PP über dem Messingring ' +
      P.restwandB.toFixed(2) + ' mm — zu dünn');
  }
  if (P.restwand < 3) {
    throw new Error('K-Aqua ' + a.key + ': Restwand Muffenschenkel ' +
      P.restwand.toFixed(2) + ' mm < 3 mm');
  }

  P.hasLug = !!cfg.lug;
  if (P.hasLug) lugParams(P, a);
  return P;
}

/* ── ASSUMPTION Lasche ──
   KEINE Spalte bemaßt sie. Die einzige Quelle ist das Foto
   Marketing/Produktbilder/grün (RAL 6024)/AQ472G …png und das
   Katalogfoto S. 95 — beide Drei-Viertel-Ansichten mit Perspektive. Die
   abgebildete Größe ließ sich nach Fall 35 NICHT bestimmen.

   Ein Maß kommt trotzdem aus der Tabelle, und es ist das wichtigste:
   h ist bei AQ472G in jeder vergleichbaren Zeile genau 2 mm größer als
   bei AQ090G (15/17/22/22 gegen 13/15/20/20). Der Körper ist derselbe,
   also sind diese 2 mm das, was die Lasche unter ihm hervorsteht.

   Alles Übrige ist am Foto abgegriffen, in Anteilen des
   Gewindeschenkel-Durchmessers D, und trägt die Unsicherheit der
   Perspektive:

     Plattenmitte ab der Achse   0,30 · D
     Plattenradius               0,70 · D   reicht bis unter den Bogen
     Lochdurchmesser             0,20 · D   ein Loch, nahe dem freien Ende
     Lochmitte ab der Achse      0,72 · D

   Der Plattenradius ist so gewählt, dass die Platte den Körper in JEDER
   Größe erreicht und mit ihm verschmilzt. Die erste Fassung setzte sie
   weiter außen an — sie schwebte dann frei neben dem Winkel, und das
   sah man erst in der Sichtprobe, nicht im Maßtest (Fall 38).

   NICHT modelliert, weil aus einem einzigen Blickwinkel nicht
   auflösbar: die Einbuchtung an der Oberkante der Platte, die auf dem
   Foto wie eine zweite, offene Befestigung aussieht. Sie steht als
   offener Punkt in LOOP-STATUS.md. */
function lugParams(P, a) {
  P.lugProud = 2.0;                          // aus h(AQ472G) − h(AQ090G)
  P.lugThick = Math.max(3.0, 0.10 * a.D);
  P.lugCenterX = Math.round(0.30 * a.D * 10) / 10;
  P.lugPadR = Math.round(0.70 * a.D * 10) / 10;
  P.lugHoleD = Math.round(0.20 * a.D * 10) / 10;
  P.lugHoleX = Math.round(0.72 * a.D * 10) / 10;
  /* Die Platte muss den Körper erreichen, sonst schwebt sie. Der
     Körper reicht am Boden bis −rOut in −X; die Platte beginnt bei
     lugCenterX − lugPadR und muss darüber hinausgehen. */
  if (P.lugCenterX - P.lugPadR > -P.rOut * 0.5) {
    throw new Error('K-Aqua ' + a.key + ': Lasche beginnt bei x = ' +
      (P.lugCenterX - P.lugPadR).toFixed(1) + ' und erreicht den Körper nicht');
  }
}

/* K-Aqua Anschlussbogen und Wandscheibe 90° IG — Konturen.

   Der Winkelkörper kommt aus ../_bendthread/parts.js — derselbe, den
   auch der Winkel mit Außengewinde trägt. Hier stehen nur die beiden
   Teile, die ihn von jenem unterscheiden: der Messingring mit
   Innengewinde und die Lasche der Wandscheibe.

   BEKANNTE DOPPLUNG: buildBrassRing steht Zeichen für Zeichen auch in
   ../_teethread/parts.js. Beide Ringe sind reine Kerngeometrie — ein
   Rotationskörper mit Innengewinde — und gehören in den Core, neben
   threadProfile und hexPrism. Das ist ein eigener Arbeitsschritt mit
   Vollbau danach und steht als solcher in LOOP-STATUS.md; hier
   benannt statt stillschweigend angelegt (Fall 32). */


/* 1 · Messingring mit zylindrischem Innengewinde Rp.
   Der Ring steht im Core (threadRing); hier bleibt nur die Zuordnung der
   P-Werte. Bis zum 24.08.2026 stand er wortgleich hier UND in
   ../_teethread/parts.js — genau die Dopplung, die dieser Kopf benannte.

   Sichtbar ist von außen nur der schmale goldene Kreis an der
   Stirnfläche. */
function buildBrassRing(P) {
  return threadRing({
    a0: P.brassBottom, a1: P.brassTop, rOuter: P.brassR,
    od: P.threadOD, pitch: P.threadPitch, turns: P.turns,
    coreDia: P.threadCore, axis: 'y', segs: SEG_VIS,
  });
}

/* 2 · Lasche der Wandscheibe.

   Eine flache Platte am Boden des Teils, mit einem Durchgangsloch. Sie
   liegt waagrecht — ihre Fläche ist die Wandauflage, das Loch nimmt die
   Schraube auf.

   ALLE Maße sind ASSUMPTION bis auf EINES: wie weit sie unter dem
   Körper hervorsteht. Das steht in der Tabelle, wenn auch nicht als
   eigene Spalte — h ist bei AQ472G in jeder vergleichbaren Zeile genau
   2 mm größer als bei AQ090G, und der Körper ist derselbe. Herleitung
   im Kopfkommentar von params.js.

   Gestalt: das Foto zeigt einen gewaisteten Umriss, außen rund um das
   Loch, zur Mitte hin schmaler. Modelliert ist die runde Platte um das
   Loch, weit genug, dass sie den Körper erreicht und mit ihm
   verschmilzt. Die Waise ist nicht bemaßt und aus einem einzigen
   Blickwinkel nicht auflösbar; sie zu erfinden hieße raten. Der Umkreis
   ist damit das größte Maß, und das ist die sichere Seite.

   plateWithHoles extrudiert in +X. Die Platte liegt aber waagrecht,
   also wird sie um Z gedreht: aus +X wird +Y. */
function buildLug(P) {
  const rPad = P.lugPadR;
  /* Unterkante NICHT aus h — die Spalte ist nicht gedeutet. Der
     Körper selbst gibt sie her: seine tiefste Stelle liegt auf dem
     Radius des Muffenschenkels. Darunter steht die Lasche um
     lugProud hervor, und DAS ist aus der Tabelle belegt (Differenz
     h(AQ472G) − h(AQ090G) = 2 mm in jeder Zeile). */
  const yBottom = -(P.rOut + P.lugProud);
  /* Koordinaten: plateWithHoles legt die Scheibe in der Shape-Ebene an
     und extrudiert in +X. Nach rotateZ(90°) wird aus der Dicke +Y, aus
     Shape-y wird −X und aus Shape-x wird −Z. Das Loch sitzt deshalb bei
     Shape-y = −(Lochmitte − Plattenmitte). */
  const dx = P.lugHoleX - P.lugCenterX;
  const geo = plateWithHoles(rPad, 0, P.lugThick,
    [{ r: P.lugHoleD / 2, x: 0, y: -dx }],
    { bevel: Math.min(0.6, P.lugThick * 0.2), segments: SEG_VIS, x0: 0 });

  geo.rotateZ(Math.PI / 2);              // Dicke von +X nach +Y
  geo.translate(P.lugCenterX, yBottom, 0);
  return { geo, cap: null };
}

/* K-Aqua Anschlussbogen und Wandscheibe 90° IG — Baugruppe und Maßtest.

   Zwei Produkte rufen buildBracket() mit ihrer Tabelle auf; cfg.lug
   entscheidet über die Lasche. Der Bau steht genau einmal hier (Fall 32).

   Achsen: Muffenschenkel auf −X, Gewindeschenkel auf +Y. */


const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

function buildBracket(cfg, size, variant, clipPlane) {
  const a = cfg.article(size);
  const P = bracketParams(a, cfg);

  const A = createAssembly({
    name: cfg.exportName + '_d' + a.d + 'x' + String(a.Rp).replace(/[ /]/g, '_'),
    materials: ['pprGreen', 'brass'],
    seed: cfg.seed,
    clipPlane,
  });

  const body = buildElbowBody(P);
  const ring = buildBrassRing(P);
  const lug = P.hasLug ? buildLug(P) : null;

  /* Abtastung der Punktwolke statt Strahl — sie liefert Werte statt
     Treffer/kein Treffer (Fall 25) und kann dieselbe Stelle in zwei um
     90° gedrehten Ebenen messen (Fall 11). Vorgehen wie beim Winkel mit
     Außengewinde. */
  const POS = body.geo.attributes.position;
  const slab = (achse, wert, halb, ebene) => {
    const querZ = ebene === 'z0';
    let rMax = 0, rMin = Infinity, n = 0;
    for (let i = 0; i < POS.count; i++) {
      const x = POS.getX(i), y = POS.getY(i), z = POS.getZ(i);
      const s = achse === 'x' ? x : y;
      const q = querZ ? z : (achse === 'x' ? y : x);
      if (Math.abs(s - wert) > halb || Math.abs(q) > 0.35) continue;
      const r = querZ ? Math.abs(y) : Math.abs(z);
      if (r > rMax) rMax = r;
      if (r < rMin) rMin = r;
      n++;
    }
    return n ? { rMax, rMin, n } : { rMax: NaN, rMin: NaN, n: 0 };
  };
  const r2 = (v) => (Number.isFinite(v) ? Math.round(v * 200) / 100 : NaN);

  A.part('body', {
    name: 'PP_Koerper', label: 'PP-R-Winkelkörper', mat: 'pprGreen',
    geo: body.geo, cap: body.cap,
    explode: V3(-0.30 * a.L1, -0.22 * a.L, 0),
    anchor: V3(-a.L1 * 0.7, P.rLegB + 0.26 * a.L, 0),
  });
  A.part('ring', {
    name: 'Messingring', label: 'Messingring Rp' + a.Rp + '" (Innengewinde)',
    mat: 'brass', geo: ring.geo, cap: ring.cap,
    explode: V3(0, 0.55 * a.L, 0),
    anchor: V3(P.rLegB + 0.30 * a.L, a.L * 0.9, 0),
  });
  if (lug) {
    A.part('lug', {
      name: 'Lasche', label: 'Wandlasche mit Schraubloch', mat: 'pprGreen',
      geo: lug.geo, cap: lug.cap,
      explode: V3(0.45 * a.L, -0.30 * a.L, 0),
      anchor: V3(P.lugHoleX, -(a.h) - 0.30 * a.L, 0),
    });
  }

  A.light(V3(-a.L1 * 0.6, 0, 0));
  A.light(V3(0, a.L * 0.6, 0));

  const boxAll = () => A.visibleBoxOf(lug ? ['body', 'lug'] : ['body']);

  A.measures = [
    { key: 'L1', label: cfg.dimensionKey.L1, soll: a.L1,
      ist: () => Math.abs(A.visibleBoxOf(['body']).min.x) },
    { key: 'L', label: cfg.dimensionKey.L, soll: a.L,
      ist: () => A.visibleBoxOf(['body']).max.y },

    /* D am Gewindeschenkel, D₁ am Muffenschenkel. Zwei Messungen
       DERSELBEN Art an verschiedenen Stellen — sie müssen verschiedene
       Werte liefern, sonst prüft keine von beiden etwas (Fall 25). */
    { key: 'D', label: cfg.dimensionKey.D, soll: a.D,
      ist: () => r2(slab('y', a.L - P.ringHeight - 3, 0.4).rMax) },
    { key: 'D1', label: cfg.dimensionKey.D1, soll: a.D1,
      ist: () => r2(slab('x', -a.L1 + P.socket, 0.4).rMax) },
    /* KEINE 90°-Gegenmessung an D₁. Sie war zuerst da und war falsch:
       in der um 90° gedrehten Ebene liegt bei diesem Teil die Außenhaut
       des BOGENS, und der reicht bis zur Oberkante des
       Gewindeschenkels. Gemessen wurden 70 statt 29 mm — die Zahl war
       nicht zufällig, sie war 2·L. Beim Winkel mit Außengewinde geht
       dieselbe Messung durch, weil dort der Gewindeschenkel schlanker
       ist als der Bogen hoch. Ersetzt durch eine Prüfung, die der Bogen
       nicht verfälschen kann. */
    { key: 'symmetrie_z', label: 'Körper symmetrisch zur XY-Ebene (soll 0)', soll: 0,
      ist: () => {
        const b = A.visibleBoxOf(['body']);
        return Math.round((b.max.z + b.min.z) * 1000) / 1000;
      } },

    { key: 'muffenbohrung', label: 'Muffenbohrung (2 mm hinter dem Mundloch)', soll: a.d,
      ist: () => r2(slab('x', -a.L1 + 2, 0.4).rMin) },
    /* Die Rohrbohrung liegt auf dem geraden Muffenschenkel HINTER der
       Muffe und VOR dem Bogen. Das Fenster ist eng: bei d25×½" ist es
       0,5 mm breit. Die erste Fassung tastete bei −(bendR + 1,6) ab und
       lag damit bei zwei Größen noch in der Muffe — gemessen wurden
       23,96 statt 16,67 mm. Jetzt die Fenstermitte. */
    { key: 'bohrung', label: 'Rohrbohrung vor dem Bogen', soll: r2(P.boreR),
      ist: () => r2(slab('x', P.xBore, 0.35).rMin) },

    /* Ringsitz: die Bohrung, in der das Messing sitzt. Gegenprobe zur
       Muffenbohrung — anderer Ort, anderer Wert. */
    /* Der Sitz ist um 0,05 mm je Seite weiter als der Ring — sonst
       lägen zwei Flächen aufeinander und der Halbschnitt zeigte
       Z-Fighting. Das Spiel steht im SOLLWERT, nicht in der Abweichung:
       eine Abweichung, die man erklärt, statt sie zu messen, ist keine
       Prüfung (Fall 23). boreAlong in ../_bendthread/parts.js setzt es. */
    { key: 'ringsitz', label: 'Ø Aufnahmebohrung für den Messingring (mit 0,05 mm Spiel)',
      soll: r2(P.brassOD / 2 + 0.05),
      ist: () => r2(slab('y', a.L - P.ringHeight / 2, 0.4).rMin) },
    { key: 'ringhoehe', label: 'Höhe des Messingrings (L − z)', soll: P.ringHeight,
      ist: () => {
        const b = A.visibleBoxOf(['ring']);
        return Math.round((b.max.y - b.min.y) * 100) / 100;
      } },
    { key: 'ringoben', label: 'Oberkante Messingring = Stirnfläche', soll: a.L,
      ist: () => A.visibleBoxOf(['ring']).max.y },

    /* UNTERKANTE, nicht h. Die Spalte h ist NICHT gedeutet (Fall 29) —
       die Messung hat die naheliegende Deutung „Achse bis Unterkante"
       widerlegt: das Modell liegt in jeder Größe bei genau D₁/2, die
       Tabelle führt 13 · 15 · 20 · 18 · 20. Was h bezeichnet, steht im
       Kopfkommentar von data.js als offene Frage.

       Gemessen wird deshalb, was das Modell zusagt: die Unterkante
       liegt auf dem Radius des Muffenschenkels. Bei der Wandscheibe
       kommt die Lasche darunter — dort ist der Sollwert um lugProud
       größer, und das ist der einzige Teil von h, der belegt ist. */
    { key: 'unterkante', label: 'Achse bis Unterkante',
      soll: r2(P.rOut) / 2 + (P.hasLug ? P.lugProud : 0),
      ist: () => Math.round(Math.abs(boxAll().min.y) * 100) / 100 },

    { key: 'restwand', label: 'Restwand Muffenschenkel', soll: P.restwand,
      ist: () => P.restwand },
    { key: 'restwandB', label: 'Restwand über dem Messingring', soll: P.restwandB,
      ist: () => P.restwandB },
  ];

  return A;
}


/* == elbow-wall-bracket-90-female-thread/data.js ======================= */
/* K-Aqua Wandscheibe 90° mit Innengewinde — Artikeltabelle.

   PHASE 1, verifiziert am 24.08.2026 gegen ZWEI unabhängige
   Rang-1-Quellen, die sich Zeile für Zeile bestätigen:

     Marketing/Print/KA-Katalog_GB_06-2025_NEU.pdf, Seite 95 (oben)
     K-Aqua Unterseitem Kopie/Transition Fittings K-Aqua/
       screencapture-…-elbowwall-bracket-90-female-thread-….png

   Spaltenköpfe wie abgebildet:
     Code · d · Rp · D · L · z · h · D₁ · L₁ · z₁ · kg · Pack.
   5 Größen. Nach der letzten Zeile folgt der ORDER-Knopf (Fall 2).
