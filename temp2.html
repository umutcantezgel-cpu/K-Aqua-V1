hen Bereichen stark vereinfacht und beschleunigt.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"37:T5e1,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch2\u003eK-Pipe Purple PP-R SDR 11: Die sichere Lösung für Brauchwasser, Regenwasser und Bewässerungssysteme\u003c/h2\u003e\u003cp\u003eMit dem K-Pipe Purple PP-R SDR 11 Rohr bieten wir eine hochspezialisierte und normgerechte Lösung für die strikte Trennung von Trinkwasser und alternativen Wasserquellen in der modernen Gebäudetechnik. Dieses Rohr besteht aus dem bewährten und robusten Polypropylen-Random-Copolymer (PP-R) und ist durchgehend in einem gut sichtbaren, kräftigen Violett eingefärbt. Diese auffällige Farbgebung dient der sofortigen optischen Identifikation von Leitungssystemen, die Nicht-Trinkwasser wie recyceltes Betriebswasser, aufgefangenes Regenwasser oder speziell aufbereitetes Grauwasser führen. Eine derartige, eindeutige farbliche Kennzeichnung ist essenziell, um gefährliche Kreuzkontaminationen mit dem sensiblen Trinkwassernetz auf Baustellen, in großen Industrieanlagen oder kommunalen Einrichtungen von vornherein absolut auszuschließen. Abgesehen von der spezifischen Farbgebung bietet das K-Pipe Purple SDR 11 alle überragenden physikalischen Eigenschaften der klassischen PP-R Rohre. Es ist vollkommen korrosionsfrei, extrem widerstandsfähig gegen chemische Einflüsse, glattwandig zur Vermeidung jeglicher Ablagerungen und zeichnet sich durch eine sehr hohe Lebensdauer aus. Dadurch stellt es eine äußerst wirtschaftliche, sichere und wartungsarme Investition für umweltbewusste Bauprojekte und nachhaltige Wassermanagementsysteme dar, die höchste Effizienz verlangen.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"38:T561,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eLeistungsstarke Eigenschaften für Nicht-Trinkwasser-Systeme im SDR 11 Standard\u003c/h3\u003e\u003cp\u003eTechnisch betrachtet entspricht das violette K-Pipe Purple PP-R SDR 11 Rohr exakt den hohen Standards unserer klassischen PP-R SDR 11 Baureihe, wurde jedoch gezielt für den Einsatz in Betriebswassernetzen adaptiert. Das Standard Dimension Ratio von 11 (Series S 5) definiert eine Rohrwandstärke, die ein perfektes Gleichgewicht zwischen mechanischer Stabilität und maximalem inneren Durchflussquerschnitt bietet. Zugelassen für einen Nenndruck von 1.2 MPa (12 bar) bei kühlen 20 °C und 0.6 MPa (6 bar) bei einer Temperatur von 60 °C, deckt es alle typischen Anforderungen an Regenwasser- und Grauwassernetzwerke sowie landwirtschaftliche Bewässerungsanlagen mehr als ausreichend ab. Obwohl es speziell für Nicht-Trinkwasser gekennzeichnet ist, ist das verwendete PP-R Material von höchster Qualität, gibt keine toxischen Substanzen an das durchströmende Medium ab und ist resistent gegen eine Vielzahl von Düngemitteln und Chemikalien, die in Bewässerungs- oder Prozesswassersystemen vorkommen können. Die hervorragende thermische Isolation verhindert zudem effektiv die Bildung von Kondenswasser an der Rohroberfläche, was besonders bei der Verlegung in klimatisierten Gebäuden oder kühlen Kellerräumen einen enormen Vorteil darstellt und Bauschäden verhindert.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"39:T584,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eZertifizierte Sicherheit durch Farbcodierung und einfache Schweißinstallation\u003c/h3\u003e\u003cp\u003eDie Anwendungsmöglichkeiten des K-Pipe Purple PP-R SDR 11 Rohres fokussieren sich auf alle modernen Konzepte der Wasserwiederverwendung und ökologischen Nachhaltigkeit. Es ist die bevorzugte Wahl für Regenwassernutzungsanlagen zur Toilettenspülung oder Gartenbewässerung, für die Verteilung von recyceltem Grauwasser in gewerblichen und öffentlichen Gebäuden sowie für komplexe industrielle Brauchwasserkreisläufe. Die violette Signalfarbe garantiert Handwerkern, Planern und späteren Nutzern eine sofortige und zweifelsfreie Zuordnung der Wasserqualität, was die Einhaltung gesetzlicher Vorschriften und Sicherheitsnormen erheblich erleichtert. Die Montage des Systems ist genauso einfach, schnell und zuverlässig wie bei herkömmlichen PP-R Systemen. Mittels Heizelement-Muffenschweißung werden Rohre und farblich passende Fittings innerhalb von Sekunden durch Hitze miteinander verschmolzen. Es entsteht eine komplett homogene, leckagefreie und unlösbare Materialverbindung, die die Strukturintegrität des gesamten Leitungsnetzes dauerhaft sicherstellt. Der Verzicht auf zusätzliche, verschleißanfällige Dichtungen oder Korrosion begünstigende Metallgewinde garantiert ein praktisch wartungsfreies System, das über Jahrzehnte hinweg reibungslos, sicher und mit maximaler Effizienz funktioniert.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"3a:T5d9,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch2\u003eK-Fiber Pipe PP-RCT SDR 7.4: Das Premium-Faserverbundrohr für anspruchsvolle thermische Anwendungen\u003c/h2\u003e\u003cp\u003eDas K-Fiber Pipe PP-RCT SDR 7.4 revolutioniert die moderne Rohrleitungstechnik durch seine hochmoderne, mehrschichtige Verbundbauweise, die speziell für höchste Ansprüche in der Heizungs-, Klima- und Sanitärtechnik entwickelt wurde. Im Kern dieses innovativen Produktes befindet sich eine spezielle, mit hochfesten Glasfasern verstärkte Mittelschicht, die von Außen- und Innenschichten aus dem fortschrittlichen Polypropylen-Random-Copolymer (PP-RCT) mit erhöhter Temperaturkristallinität umschlossen wird. Diese Kombination vereint die exzellente chemische Beständigkeit und Hygiene von PP-RCT mit der enormen mechanischen Stabilität von Glasfaser. Der entscheidende Vorteil dieses Systems liegt in der drastischen Reduzierung der thermischen Längenausdehnung um etwa 50 % bis 75 % im Vergleich zu herkömmlichen, unverstärkten Kunststoffrohren. Dadurch verhält sich das K-Fiber Pipe bei extremen Temperaturschwankungen ähnlich formstabil wie ein Metallrohr, behält jedoch alle Vorzüge des leichten, korrosionsfreien Kunststoffs. Dies macht es zur ultimativen Lösung für lange Steigleitungen, sichtbare Installationen und komplexe Heiz- und Kühlkreisläufe. Darüber hinaus sorgt die extrem glatte Rohrinnenwand für minimale Druckverluste und verhindert jede Form von Ablagerungen oder Verkrustungen, was die Effizienz der gesamten Anlage nachhaltig maximiert.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"3b:T59b,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eHöchste Formstabilität und Belastbarkeit dank Glasfaser- und PP-RCT-Technologie\u003c/h3\u003e\u003cp\u003eDie technischen Spezifikationen des K-Fiber Pipe PP-RCT SDR 7.4 unterstreichen seine Position als absolutes Premium-Produkt in der modernen Gebäudetechnik. Die Klassifizierung in SDR 7.4 (Series S 3.2) garantiert, trotz der reduzierten Wandstärke, eine außergewöhnlich hohe Druckfestigkeit, die durch die leistungsstarke Materialkombination ermöglicht wird. Bei einer kühlen Betriebstemperatur von 20 °C ist das System für einen stolzen Nenndruck von 2.0 MPa (20 bar) ausgelegt; selbst bei anspruchsvollen 70 °C Warmwasser widersteht es zuverlässig einem Druck von 1.0 MPa (10 bar). Die faserverstärkte Mittelschicht ist der Schlüssel zur minimierten Längenausdehnung, was in der Installationspraxis bedeutet, dass wesentlich weniger Befestigungsschellen, Kompensatoren oder Ausdehnungsschleifen benötigt werden. Dies reduziert nicht nur den Materialaufwand, sondern spart auch massiv Montagezeit. Gleichzeitig profitieren Anwender von einer gesteigerten hydraulischen Kapazität durch den größeren Innendurchmesser im Vergleich zu dickwandigeren Rohren. Auch die hervorragenden schall- und wärmedämmenden Eigenschaften des Kunststoffs bleiben vollständig erhalten, was den Wärmeverlust minimiert, die Energieeffizienz des Gesamtgebäudes steigert und störende Fließgeräusche in den Leitungen effektiv unterdrückt.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"3c:T5b0,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eIdeale Einsatzgebiete, vereinfachte Montage und überlegene Gesamtwirtschaftlichkeit\u003c/h3\u003e\u003cp\u003eAufgrund seiner herausragenden thermomechanischen Eigenschaften ist das K-Fiber Pipe PP-RCT SDR 7.4 die erste Wahl für eine Vielzahl anspruchsvoller Einsatzgebiete. Es brilliert in industriellen Anlagen mit hohen Temperaturschwankungen, in ausgedehnten Fernwärmenetzen, bei der Anbindung von Solarthermie-Anlagen, in komplexen Klimasystemen sowie in zentralen Trinkwarmwasserversorgungen großer Gebäudekomplexe. Trotz seiner ausgeklügelten, mehrschichtigen Struktur lässt sich das Faserverbundrohr genauso einfach, schnell und sicher verarbeiten wie ein herkömmliches PP-R Rohr. Ein vorheriges Schälen oder Abisolieren der Außenhaut vor dem Schweißvorgang ist nicht erforderlich! Mittels der bewährten Heizelement-Muffenschweißung wird eine absolut dichte, stoffschlüssige und untrennbare Verbindung mit den Standard-Fittings hergestellt. Dies eliminiert das Risiko von Leckagen, Korrosion an Verbindungsstellen und teuren Wasserschäden vollständig. Bauherren und Installateure profitieren durch die Verwendung des K-Fiber Pipe PP-RCT SDR 7.4 von einem ästhetisch einwandfreien Verlegebild (ohne durchhängende Rohre), einem deutlich schnelleren Baufortschritt, reduzierten Materialkosten für die Befestigungstechnik und einem langlebigen, wartungsfreien System, das über viele Jahrzehnte hinweg höchste Versorgungssicherheit garantiert.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"3d:T601,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch2\u003eK-Fiberclima Pipe PP-RCT SDR 11: Die spezialisierte Lösung für moderne Klima- und HLK-Systeme\u003c/h2\u003e\u003cp\u003eMit dem innovativen K-Fiberclima Pipe PP-RCT SDR 11 präsentieren wir ein maßgeschneidertes, hochleistungsfähiges Rohrleitungssystem, das explizit für die komplexen Anforderungen moderner Heizungs-, Lüftungs- und Klimatechnik (HLK) sowie industrieller Kälteanlagen konzipiert wurde. Basierend auf fortschrittlichem Polypropylen-Random-Copolymer (PP-RCT) und verstärkt durch eine hochstabile Glasfaser-Mittelschicht, bietet dieses Rohr die perfekte Synthese aus exzellenter thermischer Isolierung, mechanischer Stabilität und enormer Langlebigkeit. Besonders in großflächigen Kühl- und Heizwasserkreisläufen, bei denen ständige Temperaturschwankungen und Kondenswasserbildung eine große Herausforderung für herkömmliche Metallsysteme darstellen, spielt das K-Fiberclima Pipe seine überlegenen Stärken voll aus. Es ist zu 100 % immun gegen Korrosion, Rost und Lochfraß, was die Lebensdauer der gesamten Anlage massiv verlängert und Ausfallzeiten auf ein Minimum reduziert. Durch die faserverstärkte Struktur wird die Längenausdehnung selbst bei großen Temperaturdifferenzen drastisch minimiert, was ein sauberes, gerades und sicheres Verlegebild über sehr weite Strecken gewährleistet. Gleichzeitig sorgt die absolut glatte Innenwand für eine dauerhaft hohe Durchflussleistung bei minimalem Druckverlust, was die Energieeffizienz der angeschlossenen Zirkulationspumpen spürbar und nachhaltig optimiert.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"3e:T573,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eSDR 11 Optimierung für maximale Effizienz bei Kühl- und Heizwasser\u003c/h3\u003e\u003cp\u003eDie Konstruktion des K-Fiberclima Pipe PP-RCT SDR 11 ist technologisch exakt auf die physikalischen Betriebsbedingungen in Klimasystemen abgestimmt. Die SDR 11 Klassifizierung (Series S 5) definiert eine Rohrwandstärke, die einen maximalen Innendurchmesser zulässt und somit eine unübertroffene hydraulische Kapazität bietet. Dies ist besonders bei großen Volumenströmen in Kühldecken, Fan-Coil-Systemen oder Kaltwassersätzen von unschätzbarem Wert. Trotz der vergleichsweise geringeren Wandstärke garantiert das hochkristalline PP-RCT Material in Kombination mit der Glasfaserarmierung eine herausragende Druckbeständigkeit: Zugelassen für 1.6 MPa (16 bar) bei 20 °C und starke 0.8 MPa (8 bar) bei 70 °C, deckt es alle relevanten Parameter der modernen Gebäudeklimatisierung mühelos und sicher ab. Ein weiterer gravierender Vorteil dieses Materials ist seine extrem niedrige Wärmeleitfähigkeit. Dadurch wird der Verlust von Kälteenergie auf dem Weg zur Verbrauchsstelle signifikant reduziert, was die Systemeffizienz steigert und den Bedarf an teurer, externer Rohrisolierung zur Vermeidung von Tropfwasser deutlich verringert. Die exzellenten akustischen Eigenschaften schlucken zudem Vibrationen und Pumpengeräusche effektiv, was einen flüsterleisen Betrieb der Klimaanlage sicherstellt.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"3f:T5b3,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eReibungslose Installation, Wartungsfreiheit und Umweltfreundlichkeit im HLK-Sektor\u003c/h3\u003e\u003cp\u003eDas Anwendungsspektrum des K-Fiberclima Pipe PP-RCT SDR 11 umfasst zentrale Kälteanlagen, Wärmepumpensysteme, Geothermie-Verteiler, Eisspeicher-Anbindungen und industrielle Prozesskühlungen in Rechenzentren oder der Lebensmittelproduktion. Für den professionellen Anlagenbauer bietet dieses System unschlagbare Installationsvorteile: Durch das geringe Eigengewicht des Kunststoff-Glasfaser-Verbunds ist die Handhabung – selbst bei sehr großen Rohrdurchmessern – wesentlich leichter und sicherer als bei schweren Stahlrohren. Die Verbindungstechnik erfolgt blitzschnell und sauber über das bewährte Polyfusionsschweißen. Ohne den Einsatz von offenen Flammen (kein Schweißerpass nötig), Lötzinn oder Dichtungsringen werden Rohr und Fitting zu einer unlösbaren, absolut leckagesicheren Einheit verschmolzen, die sofort nach dem Abkühlen dem vollen Systemdruck standhält. Dies beschleunigt den Baufortschritt enorm und senkt die Personalkosten erheblich. Ein zusätzliches Schälen der Rohre ist bei diesem System nicht erforderlich! Darüber hinaus punktet das K-Fiberclima System mit seiner exzellenten Ökobilanz: Das verwendete Polypropylen ist ein umweltverträglicher Werkstoff, der nicht toxisch ist, bei der Herstellung weniger Energie benötigt als Metalle und am Ende seiner langen Nutzungsdauer problemlos zu 100 % recycelt werden kann.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"40:T5ab,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch2\u003eK-Fiber Pipe PP-R SDR 7.4: Das klassische, glasfaserverstärkte Hochleistungsrohr\u003c/h2\u003e\u003cp\u003eDas K-Fiber Pipe PP-R SDR 7.4 vereint die bewährten, exzellenten Materialeigenschaften des Standard Polypropylen-Random-Copolymers (PP-R) mit einer hochfesten, technologisch ausgereiften Glasfaser-Mittelschicht. Diese innovative 3-Schicht-Struktur bietet eine beeindruckende Lösung für die anspruchsvollsten Installationsaufgaben in der modernen Haustechnik und Gebäudeversorgung. Durch die Integration der speziellen Glasfaserarmierung wird die thermische Längenausdehnung des Rohres bei starker Erwärmung um bis zu beeindruckenden 75 % reduziert. Dies bedeutet, dass sich das Rohr unter Temperatureinfluss ähnlich formstabil verhält wie ein herkömmliches Metallrohr, dabei jedoch keinerlei Anfälligkeit für Rost, Korrosion oder Kalkablagerungen aufweist. Diese enorme Formstabilität macht das K-Fiber Pipe PP-R SDR 7.4 zur perfekten Wahl für lange Steigleitungen in Hochhäusern, sichtbare Kellerverteilungen und ausgedehnte Heizungsnetze, wo ein sauberes, gerades Verlegebild ohne durchhängende Rohre zwingend erforderlich ist. Darüber hinaus garantiert die extrem glatte und abriebfeste Rohrinnenfläche einen konstant hervorragenden Wasserdurchfluss, minimiert schädliche Druckverluste und verhindert dauerhaft mikrobiologisches Wachstum, was eine absolut hygienische und sichere Wasserverteilung über viele Jahrzehnte sicherstellt.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"41:T546,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eMechanische Stabilität und zuverlässige Druckfestigkeit (SDR 7.4)\u003c/h3\u003e\u003cp\u003eDie Konstruktion des K-Fiber Pipe PP-R als SDR 7.4 (Series S 3.2) Rohr garantiert eine sehr hohe mechanische Belastbarkeit, die den strengen Anforderungen internationaler Normen mühelos standhält. Ausgelegt für einen Nenndruck von 2.5 MPa (25 bar) bei einer Kaltwassertemperatur von 20 °C und 1.2 MPa (12 bar) bei einer Dauertemperatur von 60 °C, bietet dieses Rohrleitungssystem enorme Sicherheitsreserven für komplexe Sanitär- und Heizungsanlagen. Das hochwertige PP-R Material sichert zudem eine exzellente Beständigkeit gegen eine Vielzahl aggressiver Chemikalien und Reinigungsmittel. Ein weiterer wesentlicher Vorteil der integrierten Glasfaserschicht ist die Beibehaltung der erstklassigen Dämmeigenschaften des Kunststoffs. Das System wirkt aktiv schallisolierend, dämpft störende Fließ- und Knackgeräusche und reduziert gleichzeitig den Wärmeverlust bei der Warmwasserverteilung. Dadurch wird die Gesamtenergieeffizienz des Gebäudes signifikant verbessert. Die etwas dünnere Wandstärke im Vergleich zu einem reinen, unverstärkten SDR 6 Rohr ermöglicht obendrein einen vergrößerten Rohrquerschnitt, was die Durchflusskapazität bei gleicher Baugröße enorm erhöht und den Einsatz kleinerer, effizienterer Zirkulationspumpen ermöglicht.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"42:T5a1,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eWirtschaftliche Montage und universelle Einsatzmöglichkeiten in der Baupraxis\u003c/h3\u003e\u003cp\u003eDank seiner herausragenden thermischen und mechanischen Stabilität wird das K-Fiber Pipe PP-R SDR 7.4 für ein sehr breites Spektrum an Anwendungen eingesetzt. Es eignet sich perfekt für zentrale Trinkwasser-Warm- und Kaltwasserinstallationen, Anbindungen von Solarkollektoren, Heizkörperverteilung sowie für industrielle Prozesswasserkreisläufe. Für den Installateur bietet das Faserverbundrohr unschätzbare praktische Vorteile bei der Montage: Da sich das Rohr unter Hitzeeinwirkung kaum ausdehnt, werden deutlich weniger Befestigungsschellen, Dehnungsschleifen und teure Kompensatoren benötigt. Dies reduziert die reinen Materialkosten und beschleunigt den Installationsprozess ganz erheblich. Ein weiterer großer Pluspunkt ist die bewährte, absolut unkomplizierte Verbindungstechnik. Anders als bei Rohren mit Aluminiumschicht muss das K-Fiber Pipe vor dem Schweißen nicht mühsam geschält oder kalibriert werden. Es wird direkt und einfach mit herkömmlichen PP-R Fittings durch die zuverlässige Heizelement-Muffenschweißung (Polyfusionsschweißung) verbunden. Innerhalb weniger Sekunden entsteht so eine dauerhafte, untrennbare und hundertprozentig dichte Materialeinheit, die sofort nach dem Abkühlen dem vollen Betriebsdruck standhält und höchste Sicherheit für Bauherren und Betreiber über mehr als 50 Jahre garantiert.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"43:T5c9,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch2\u003eEffizientes K-Fiber Pipe PP-R SDR 9 für optimale Durchflussleistung und Stabilität\u003c/h2\u003e\u003cp\u003eDas K-Fiber Pipe PP-R SDR 9 präsentiert sich als die perfekte, hochmoderne Zwischenlösung im Bereich der faserverstärkten Kunststoffrohrsysteme. Entwickelt aus erstklassigem Polypropylen-Random-Copolymer (PP-R) und verstärkt durch eine hochfeste, integrierte Glasfaser-Mittelschicht, bietet dieses Rohrleitungssystem eine unschlagbare Kombination aus mechanischer Stabilität, thermischer Resistenz und außergewöhnlich hoher Durchflusskapazität. Die SDR 9 Klassifizierung (Series S 4) wurde gezielt konzipiert, um das ideale Gleichgewicht zwischen einer belastbaren Wandstärke und einem maximierten Innendurchmesser zu schaffen. Das Ergebnis ist ein hochleistungsfähiges Rohrsystem, das Druckverluste minimiert, die Strömungsdynamik im gesamten Netz optimiert und gleichzeitig die gefürchtete thermische Längenausdehnung bei Heißwasseranwendungen effektiv unterdrückt. Dank der innovativen Faserverbundtechnologie verhält sich das Rohr extrem formstabil und benötigt auf langen Strecken deutlich weniger Fixierungspunkte. Darüber hinaus ist das K-Fiber Pipe vollkommen resistent gegen Korrosion, Rost und Inkrustationen. Die hochglatte Innenoberfläche verhindert nachhaltig die Ansiedlung von Bakterien und Kalk, was eine dauerhaft sichere, hygienische und effiziente Wasserversorgung für Wohn-, Gewerbe- und Industrieobjekte auf höchstem Niveau gewährleistet.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"44:T547,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eAusgewogene Druckfestigkeit und überlegene Thermostabilität für komplexe Anlagen\u003c/h3\u003e\u003cp\u003eTechnisch brilliert das K-Fiber Pipe PP-R SDR 9 durch seine präzise abgestimmten Leistungsparameter. Mit einer Freigabe für einen Nenndruck von 2.0 MPa (20 bar) bei kühlen 20 °C und 1.0 MPa (10 bar) bei kontinuierlichen 60 °C deckt es einen riesigen Anwendungsbereich in der modernen Gebäude- und Anlagentechnik zuverlässig ab. Die spezielle 3-Schicht-Architektur mit der versteifenden Glasfaserkomponente sorgt dafür, dass die thermische Dehnung auf ein absolutes Minimum reduziert wird. Dies ist ein entscheidender Faktor für die Planungssicherheit, da aufwendige Dehnungsausgleicher, Schleifen und teure Festpunktkonstruktionen weitgehend entfallen können. Ein weiteres herausragendes Merkmal ist die exzellente energetische Effizienz des Systems: Die inhärente, geringe Wärmeleitfähigkeit des PP-R Materials in Verbindung mit der SDR 9 Wandstärke sorgt für eine natürliche Wärmedämmung, die den Verlust von kostbarer Heizenergie drastisch minimiert und den Einsatz zusätzlicher Isolationsmaterialien reduziert. Zudem dämpft das Material hervorragend Schallwellen und Wasserschläge, was den Geräuschpegel von fließendem Wasser in Schächten und Wänden auf ein unmerkliches Minimum senkt und den Wohnkomfort deutlich steigert.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"45:T547,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eSchneller Baufortschritt, wirtschaftliche Verlegung und höchste Zuverlässigkeit\u003c/h3\u003e\u003cp\u003eDie Vielseitigkeit des K-Fiber Pipe PP-R SDR 9 macht es zur bevorzugten Wahl für Sanitär-Trinkwassernetze, Klimakaltwassersysteme, komplexe Heizungsverteilungen und industrielle Fluidtransporte. Installateure und Anlagenbauer schätzen besonders die herausragende Verlegefreundlichkeit: Das im Vergleich zu Vollkunststoffrohren sehr biegesteife, aber dennoch leichte Rohr ermöglicht ein optisch perfektes, durchhangfreies Verlegebild bei sichtbaren Installationen in Kellern, Technikzentralen oder Produktionshallen. Die Verbindung der einzelnen Rohrkomponenten mit den passenden Fittings erfolgt über die tausendfach bewährte, absolut sichere Heizelement-Muffenschweißtechnik. Ohne Vorbehandlung wie Schälen oder Anspitzen verschmelzen Rohr und Fitting unter Hitze in Sekundenschnelle zu einer homogenen, unlösbaren und dauerhaft 100 % dichten Einheit. Dies schließt versteckte Leckagen und spätere Wartungskosten praktisch aus. Mit der Entscheidung für das K-Fiber Pipe PP-R SDR 9 investieren Bauherren in ein langlebiges, korrosionsfreies, umweltfreundliches und äußerst wirtschaftliches Rohrleitungssystem, das höchste Hygienestandards erfüllt und die Betriebskosten der gesamten Anlage durch minimierte Druckverluste nachhaltig senkt.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"46:T57b,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch2\u003eK-Fiber Pipe PP-R SDR 11: Das faserverstärkte Leichtgewicht für Kaltwasser und Klimatechnik\u003c/h2\u003e\u003cp\u003eDas K-Fiber Pipe PP-R SDR 11 ist die intelligente, materialoptimierte Lösung für Projekte, die höchste Formstabilität bei gleichzeitiger Gewichtsersparnis und großem Durchflussvolumen fordern. Entwickelt für Leitungssysteme, die keinen extremen Druckbelastungen ausgesetzt sind, vereint dieses System das hochwertige Polypropylen-Random-Copolymer (PP-R) mit einer stabilisierenden, hochfesten Glasfaserschicht. Die SDR 11 Dimensionierung (Series S 5) sorgt für eine geringere Wandstärke, was den Rohrinnendurchmesser deutlich maximiert und eine exzellente Hydraulik ermöglicht. Dies senkt den Reibungswiderstand drastisch und entlastet die Zirkulationspumpen. Trotz der dünneren Wände verhindert die integrierte Faserarmierung effektiv die unerwünschte Längenausdehnung bei Temperaturwechseln, sodass sich das Rohr nicht verzieht oder durchhängt. Wie alle K-Pipe Produkte ist auch dieses SDR 11 System absolut immun gegen Korrosion, Rost und chemische Angriffe, wodurch eine dauerhaft saubere, hygienische und kalkfreie Wasserführung garantiert wird. Es stellt somit eine wirtschaftlich höchst attraktive und langlebige Alternative zu schweren, korrosionsanfälligen Metallrohren dar, speziell bei der Verlegung großer Leitungslängen in Wohnkomplexen und gewerblichen Anlagen.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"47:T571,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eOptimierte Hydraulik und zuverlässige Druckbeständigkeit im Mitteldruckbereich (SDR 11)\u003c/h3\u003e\u003cp\u003eTechnisch ist das K-Fiber Pipe PP-R SDR 11 auf die spezifischen Anforderungen im Mitteldruck- und Niederdruckbereich fokussiert. Es verfügt über eine offizielle Freigabe für einen Nenndruck von 1.6 MPa (16 bar) bei einer Kaltwassertemperatur von 20 °C sowie 0.8 MPa (8 bar) bei konstanten 60 °C. Diese Leistungsparameter qualifizieren das Rohr ideal für alle klassischen Kaltwasser-Trinkwasserinstallationen, Betriebswassernetze, landwirtschaftliche Bewässerungsanlagen und zentrale Kaltwassersätze in der Gebäudeklimatisierung. Die revolutionäre, dreischichtige Konstruktion mit der Glasfaser in der Mitte sichert dabei eine thermische Dehnung, die um den Faktor 4 geringer ausfällt als bei reinen, unverstärkten Kunststoffrohren. Dies erleichtert die Planung der Fest- und Gleitpunkte enorm und reduziert den Materialaufwand für Befestigungstechnik. Darüber hinaus bietet das PP-R Material hervorragende thermische Isolationseigenschaften. Bei Kaltwasserleitungen verhindert es sehr effektiv die Bildung von störendem Kondenswasser an der Außenseite, während es bei der Durchleitung warmer Medien den Temperaturverlust minimiert. Auch die überragenden schallschluckenden Eigenschaften des Kunststoffs bleiben voll erhalten, was für einen flüsterleisen Betrieb sorgt.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"48:T511,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eZeitsparende Installation, sicheres Handling und breites Anwendungsspektrum\u003c/h3\u003e\u003cp\u003eDas K-Fiber Pipe PP-R SDR 11 punktet in der täglichen Praxis vor allem durch sein minimales Eigengewicht. Dies macht Transport, Lagerung und das Manövrieren auf der Baustelle – insbesondere bei Überkopf-Installationen oder in beengten Schächten – extrem einfach, sicher und kräfteschonend. Typische Anwendungsgebiete sind ausgedehnte Leitungsnetze für Regenwassernutzung, Schwimmbadtechnik, Druckluftverteilung und industrielle Kühlkreisläufe. Die Montage erfolgt schnell, sauber und hochgradig effizient über die Polyfusionsschweißtechnik. Da die Glasfaserschicht vollständig in das PP-R Material eingebettet ist, entfällt das zeitraubende Schälen der Rohrenden komplett. Rohr und Fitting werden lediglich über ein Heizelement kurzzeitig erwärmt und ineinandergesteckt. Nach wenigen Sekunden Abkühlzeit entsteht eine vollkommen homogene, stoffschlüssige und 100 % dichte Verbindung, die sofort einsatzbereit ist. Mit dem K-Fiber Pipe PP-R SDR 11 erhalten Bauherren und Installateure ein technologisch fortschrittliches, wartungsfreies und kostengünstiges Rohrleitungssystem, das die Sicherheit und Effizienz der Haustechnik für viele kommende Jahrzehnte verlässlich gewährleistet.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"49:T5d2,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch2\u003eGroßdimensioniertes K-Fiber Pipe PP-R SDR 17: Die Lösung für Industrie und Großanlagen\u003c/h2\u003e\u003cp\u003eDas K-Fiber Pipe PP-R SDR 17 ist ein hochspezialisiertes, großformatiges Rohrleitungssystem, das exklusiv für den Transport enormer Flüssigkeitsvolumina in der Schwerindustrie, in kommunalen Versorgungsnetzen und in großen Gebäudeinfrastrukturen entwickelt wurde. Dieses Rohr meistert die Herausforderungen, die bei extrem großen Durchmessern (von 90 mm bis zu 200 mm und mehr) auftreten, mit absoluter Bravour. Hergestellt aus feinstem Polypropylen-Random-Copolymer (PP-R) und verstärkt mit einer robusten Glasfaser-Mittelschicht, bietet das SDR 17 System eine perfekte Balance aus struktureller Integrität, extremem Durchflussquerschnitt und leichter Handhabung. Verglichen mit traditionellen, zentnerschweren Guss- oder Stahlrohren in ähnlichen Dimensionen, reduziert das K-Fiber System das Eigengewicht drastisch, was Transportkosten minimiert und die Installation auf der Großbaustelle mit leichtem Hebezeug ermöglicht. Die Glasfaserarmierung sorgt auch bei diesen massiven Rohren für eine drastische Reduktion der thermischen Dehnung, was die Planung von Leitungstrassen, Steigsträngen und Verteilern in Industriehallen erheblich vereinfacht. Absolute Korrosionsfreiheit, Unempfindlichkeit gegen chemische Aggressoren und eine ultraglatte Innenwand garantieren einen störungsfreien, wartungsarmen Betrieb über Jahrzehnte hinweg, selbst unter rauesten Bedingungen.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"4a:T54d,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eMaximale Volumenströme bei optimiertem Materialeinsatz und hoher Stabilität (SDR 17)\u003c/h3\u003e\u003cp\u003eTechnisch wurde das K-Fiber Pipe PP-R SDR 17 (Series S 8) präzise für Anwendungen konzipiert, die gewaltige Durchflussmengen bei moderaten Systemdrücken erfordern. Mit einer offiziellen Zulassung für 1.0 MPa (10 bar) bei 20 °C Kaltwasser und 0.6 MPa (6  und Integrität. Wie alle K-Pipe Produkte ist es zudem komplett korrosionsbeständig, frostsicher in Verbindung mit entsprechender Isolierung und garantiert einen stets hygienisch einwandfreien Durchfluss.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"4d:T55b,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eDoppelter Schutz: UV-Resistenz und herausragende Druckfestigkeit (SDR 7.4)\u003c/h3\u003e\u003cp\u003eDas K-Fiber UV Pipe PP-R SDR 7.4 ist ein technisches Meisterwerk, das für extremste Umweltbedingungen konstruiert wurde. Die SDR 7.4 Klassifizierung (Series S 3.2) garantiert eine enorme mechanische Widerstandsfähigkeit und eine hohe Druckfestigkeit, die auch für anspruchsvolle Anwendungen im Außenbereich ausreicht. Zugelassen für einen Nenndruck von 2.0 MPa (20 bar) bei kühlen 20 °C und 1.0 MPa (10 bar) bei warmen 60 °C, meistert dieses Rohrleitungssystem starke Druckschwankungen absolut souverän. Die spezielle UV-Schutzschicht verhindert effektiv die gefürchtete Photooxidation des Kunststoffs, sodass das Rohr seine volle Flexibilität und Schlagzähigkeit auch nach vielen Jahren intensiver UV-Bestrahlung behält. Die integrierte Glasfaserarmierung sorgt gleichzeitig dafür, dass die enorme Hitze der direkten Sonneneinstrahlung nicht zu extremen Längendehnungen führt, was sonst die Halterungen und Verbindungen zerstören könnte. Dieses Rohr benötigt keine aufwendige, zusätzliche Lackierung oder schützende Blechummantelungen, um der Sonne zu trotzen, was die Installationskosten erheblich reduziert. Zudem bietet die extrem glatte Innenschicht einen optimalen Strömungswiderstand und schützt dauerhaft vor jeglichen Ablagerungen und Verkrustungen.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"4e:T560,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eSchnelle Installation im Freien, enorme Kostenersparnis und hohe Betriebssicherheit\u003c/h3\u003e\u003cp\u003eDie Hauptanwendungsgebiete des K-Fiber UV Pipe PP-R SDR 7.4 liegen überall dort, wo Leitungen sichtbar und ungeschützt vor der Witterung verlegt werden müssen. Es ist die ideale, zukunftssichere Lösung für Kühlwassersysteme auf Flachdächern, Verbindungsleitungen zwischen Gebäuden, Solarthermie-Kreisläufe und großflächige landwirtschaftliche Verteilernetze. Der größte Vorteil für Anlagenbauer liegt in der einfachen, extrem schnellen Montage. Anders als bei Rohren, die nachträglich lackiert, isoliert oder mit UV-Schutzbändern umwickelt werden müssen, ist das K-Fiber UV Rohr out-of-the-box vollständig einsatzbereit. Die Verbindung mit den Fittings erfolgt über die absolut zuverlässige Polyfusionsschweißtechnik. Ein Schälen des Rohres ist vor dem Schweißvorgang nicht notwendig! Durch kurzzeitiges Erhitzen entsteht eine unlösbare, homogene und 100 % leckagefreie Einheit, die stark genug ist, um auch Windlasten und mechanischen Spannungen im Außenbereich dauerhaft standzuhalten. Durch den Verzicht auf zusätzliche UV-Schutzmaßnahmen und die schnelle Schweißtechnik sparen Bauherren massiv an Arbeitszeit und Materialkosten, während sie gleichzeitig ein wartungsfreies, optisch ansprechendes und jahrzehntelang sicheres Rohrsystem erhalten.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"4f:T5c7,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch2\u003eK-Fiber UV Pipe PP-RCT SDR 7.4: Das ultimative Premium-Außenrohr für höchste thermische Lasten\u003c/h2\u003e\u003cp\u003eDas K-Fiber UV Pipe PP-RCT SDR 7.4 repräsentiert die technologische Spitze im Bereich der witterungsbeständigen Kunststoffrohrsysteme. Es wurde speziell für die anspruchsvollsten Installationen im Freien konzipiert, bei denen nicht nur extreme UV-Strahlung, sondern gleichzeitig auch sehr hohe Mediumtemperaturen und starke Belastungen auftreten. Dieses Premium-Rohr kombiniert drei hochleistungsfähige Schichten: Ein extrem glattes und chemisch hochbeständiges Innenrohr aus Polypropylen-Random-Copolymer mit erhöhter Temperaturkristallinität (PP-RCT), eine extrem steife, temperaturstabile Glasfaser-Mittelschicht und eine speziell entwickelte, dauerhaft UV-stabilisierte Außenschicht. Diese einzigartige Konstruktion verhindert die gefährliche Photooxidation und Versprödung durch hartes Sonnenlicht vollkommen, während das PP-RCT Material eine drastisch erhöhte Druck- und Temperaturfestigkeit im Vergleich zu Standard-PP-R bietet. Das Ergebnis ist ein nahezu unverwüstliches, extrem formstabiles Leitungsnetz für Dachzentralen, große Solarkraftwerke, industrielle Freileitungen und exponierte Steigstränge. Rost, Korrosion oder Verkrustungen sind physikalisch ausgeschlossen, wodurch das System über viele Jahrzehnte hinweg eine vollkommene, hygienische und effiziente Leistung erbringt, ohne aufwendig gewartet oder lackiert werden zu müssen.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"50:T510,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eDie Symbiose aus PP-RCT, Glasfaser und UV-Schutz für extreme Dauerbelastbarkeit\u003c/h3\u003e\u003cp\u003eAus technischer Sicht setzt das K-Fiber UV Pipe PP-RCT SDR 7.4 neue Maßstäbe für die Außeninstallation. Durch die überlegene kristalline Struktur des PP-RCT Materials verfügt das System bei gleicher Wandstärke (SDR 7.4 / Series S 3.2) über eine signifikant höhere Langzeitfestigkeit bei hohen Temperaturen als herkömmliche Kunststoffrohre. Zugelassen für einen Nenndruck von 2.0 MPa (20 bar) bei 20 °C und enormen 1.0 MPa (10 bar) bei sehr heißen 70 °C, ist es prädestiniert für den Transport von heißem Kühlwasser, industriellen Fluiden und heißen Medien aus Solarkollektoren. Die Glasfaser-Mittelschicht minimiert die thermische Längenausdehnung auf ein absolutes Minimum (bis zu 75 % weniger Dehnung), was bedeutet, dass sich das Rohr unter der sengenden Sommersonne und bei heißem Medium im Inneren kaum ausdehnt. Dies verhindert enorme Spannungen in den Halterungen und macht unzählige, teure Kompensatoren überflüssig. Zudem profitiert die Anlage von einem vergrößerten Innendurchmesser durch die optimierte Wandstärke des PP-RCT, was die hydraulische Kapazität und den Durchfluss der gesamten Anlage erhöht und die Effizienz von Umwälzpumpen signifikant steigert.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"51:T573,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch3\u003eHöchste Planungssicherheit, schnelle Verarbeitung und extreme Lebensdauer im Außenbereich\u003c/h3\u003e\u003cp\u003eDas K-Fiber UV Pipe PP-RCT SDR 7.4 ist die erste und beste Wahl für Ingenieure und Planer, die keine Kompromisse bei der Sicherheit und Langlebigkeit von Außenanlagen eingehen wollen. Es ist ideal für ausgedehnte Rohrbrücken in Chemie- und Industrieanlagen, Anbindungen von Rückkühlwerken auf Flachdächern, Geothermieverteiler im Freien und große landwirtschaftliche Versorgungskomplexe. Für den ausführenden Handwerker bietet das Rohr unschätzbare Vorteile: Trotz der hochkomplexen 3-Schicht-Technologie und des UV-Schutzes lässt sich das Rohr schnell, sauber und extrem sicher mit der standardisierten Polyfusionsschweißtechnik verarbeiten. Ein zeitraubendes Schälen der Außenschicht entfällt komplett! Rohr und Fitting verschmelzen unter Hitze zu einer dauerhaft homogenen, leckagefreie und sofort voll belastbaren Einheit. Der Verzicht auf nachträgliche UV-Schutzanstriche, Schutzschläuche oder Metallverkleidungen beschleunigt den gesamten Bauprozess radikal und senkt die Installationskosten enorm. Bauherren investieren mit diesem System in höchste Zuverlässigkeit, maximale Ausfallsicherheit, optimale Energieeffizienz und ein völlig wartungsfreies Rohrnetzwerk, das allen Naturgewalten und thermischen Herausforderungen für Generationen mühelos standhält.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"52:T6d4,"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"\u003ch2\u003eNachhaltigkeit und LCA (Life Cycle Assessment)\u003c/h2\u003e\u003cp\u003eDie Wahl des richtigen Rohrleitungssystems hat signifikante Auswirkungen auf den CO2-Fußabdruck eines Gebäudes oder einer Industrieanlage. Der K-Aqua CO2-Rechner ermöglicht eine vollumfängliche Lebenszyklusanalyse (LCA) gemäß den Standards der EN 15804. Diese Analyse deckt den gesamten Lebenszyklus ab: von der Rohstoffgewinnung und Produktherstellung (Phasen A1-A3) über den Transport und die Installation (Phasen A4-A5) bis hin zur Nutzungsphase (Phase B) und dem End-of-Life (Phase C).\u003c/p\u003e\u003cp\u003eIm Vergleich zu herkömmlichen Metallrohren aus Kupfer oder Stahl weisen PP-R und PPRCT Rohre von K-Aqua eine deutlich vorteilhaftere Ökobilanz auf. Der geringere Energieaufwand bei der Extrusion des Kunststoffs sowie das wesentlich geringere Gewicht reduzieren die CO2-Emissionen bei Produktion und Transport erheblich. Darüber hinaus sorgt die spiegelglatte Innenoberfläche (Rauhigkeit von nur 0,007 mm) für einen extrem geringen Strömungswiderstand. Nach der Darcy-Weisbach-Gleichung bedeutet dies, dass Umwälzpumpen deutlich weniger Energie (Strom) aufwenden müssen, um die Flüssigkeit durch das System zu fördern.\u003c/p\u003e\u003cp\u003eGerade in der Nutzungsphase (Phase B), die bei Rohrleitungssystemen oft 50 Jahre oder länger dauert, summiert sich diese Energieeinsparung zu massiven CO2- und Kosteneinsparungen (Total Cost of Ownership, TCO). Auch am Ende der Lebensdauer (Phase C) bietet Polypropylen ökologische Vorteile, da es zu 100 % recycelbar ist und im Sinne der Kreislaufwirtschaft (Modul D) wiederverwertet werden kann. Nutzen Sie diesen Rechner, um die ökologischen und ökonomischen Einsparpotenziale Ihres K-Aqua Projekts präzise und transparent zu quantifizieren.\u003c/p\u003e"])</script><script nonce="YzkzYTA2MDctOGIwZS00MjkxLWExMjItYzQyMDJkY2RhZDhk">self.__next_f.push([1,"24:[\"$\",\"$L26\",null,{\"locale\":\"de\",\"now\":\"$D2026-07-26T21:33:25.418Z\",\"timeZone\":\"America/Los_Angeles\",\"messages\":{\"nav\":{\"home\":\"Start\",\"products\":\"Produkte\",\"finder\":\"Produktfinder\",\"co2\":\"CO₂-Rechner\",\"markets\":\"Märkte\",\"trust\":\"Trust Center\",\"contact\":\"Kontakt\",\"quote\":\"Angebot anfragen\",\"menu\":\"Menü\",\"lang\":\"Sprache\",\"skipToContent\":\"Zum Inhalt springen\",\"menuPlaceholder\":\"Platzhalter (Mega-Menü)\",\"academy\":\"Academy\",\"service\":\"Service\",\"about\":\"Unternehmen\",\"solutions\":\"Lösungen\",\"partners\":\"Partnerschaft\",\"references\":\"Referenzen\",\"career\":\"Karriere\",\"news\":\"News\",\"knowledge_trust\":\"Wissen \u0026 Vertrauen\",\"mapAria\":\"Kartennavigation öffnen\",\"sitemapAria\":\"Seitenübersicht\"},\"menu\":{\"pipes\":\"Rohre\",\"fittings\":\"Fittings\",\"transition\":\"Übergangsfittings\",\"valves\":\"Ventile \u0026 Hähne\",\"tools\":\"Schweißwerkzeuge\"},\"quote\":\"Projektanfrage\",\"toggle_theme_light\":\"Zu hellem Design wechseln\",\"toggle_theme_dark\":\"Zu dunklem Design wechseln\",\"home\":{\"chip\":\"geprüft seit Oktober 2025\",\"h1a\":\"Führend bei\",\"h1b\":\"K-Aqua PP-R Rohrsystemen\",\"globeAria\":\"Interaktiver Globus — ziehen zum Drehen\",\"scrolly\":[{\"t\":\"Gefertigt in Deutschland\",\"d\":\"Entwicklung und Produktion am Standort Waldsolms — jedes Rohr, jedes Formteil.\"},{\"t\":\"d20 bis d630\",\"d\":\"Ein vollständiges System: fünf Druckstufen, Formteile, Armaturen und Schweißtechnik.\"},{\"t\":\"Dreifach geprüft\",\"d\":\"ISO 9001, 14001 und 50001 — Qualität, Umwelt und Energie aus einem Managementsy sion von {title} optimale Strömungseigenschaften, minimiert Druckverluste und eliminiert das Risiko von Kalkablagerungen oder Korrosion über die gesamte Betriebslebensdauer vollständig. Diese kompromisslose Hingabe zur Materialwissenschaft stellt sicher, dass jede Verbindung auch unter extremen thermischen und Druckschwankungen absolute Integrität bewahrt. Ob in Wohnhochhäusern, kritischen Gesundheitseinrichtungen oder anspruchsvollen industriellen Verarbeitungsanlagen eingesetzt, liefert dieses Produkt eine wartungsfreie Zuverlässigkeit, auf die Ingenieure und Installateure blind vertrauen können.\"},\"uniqueProductContext\":\"Das Produkt {title} ist ein wesentlicher Bestandteil des K Aqua {category}-Sortiments. Es wurde für maximale Langlebigkeit sowie nahtlose Integration entwickelt und erfüllt die höchsten internationalen Standards für moderne Rohrleitungs- und Sanitäranwendungen. Sie können dieses spezifische Produkt anhand der Artikelnummer(n) identifizieren und bestellen: {codes}. Für weitere Dokumentationen oder Unterstützung wenden Sie sich bitte an unser technisches Team.\",\"heroDesc\":\"Entdecken Sie die Spezifikationen, Dimensionen und Einsatzbereiche. Für detaillierte Informationen laden Sie das Technische Datenblatt herunter.\",\"articleNumbers\":\"Artikelnummern\",\"technicalSpecs\":\"Technische Spezifikationen\",\"eyebrow\":\"Produkte\",\"videoGuide\":\"K Aqua Video-Anleitung\",\"localAvailability\":\"Lokale Verfügbarkeit\",\"localDesc\":\"Finde lokale Händler, spezifische Zulassungen und Normen für deine Region.\",\"allMarkets\":\"Alle 50+ Märkte ansehen\",\"title1\":\"PP-R/PPRCT Rohre \u0026 Formteile für\",\"titleGrad\":\"Trinkwasser.\",\"lead\":\"Ein vollständiges Rohrleitungssystem für heißes und kaltes Trinkwasser — vom Rohr über das Formteil bis zur Schweißtechnik. Vier Bausteine, ein System.\",\"ctaCatalog\":\"Produktkatalog (PDF)\",\"ctaVideos\":\"Installationsvideos\",\"sysEyebrow\":\"Das System\",\"sysTitle\":\"K-Aqua PP-R Rohre \u0026 Fittings: Vier Bausteine, ein System.\",\"range\":[{\"t\":\"Rohre — Mono \u0026 Multilayer\",\"d\":\"Monolayer- und glasfaserverstärkte Multilayer-Rohre in SDR 6, 7,4, 9, 11 und 17. Dimensionen von 20 mm bis 630 mm.\"},{\"t\":\"Formteile \u0026 Armaturen\",\"d\":\"Fittings von 20 mm bis 315 mm, ergänzt um Ventile, Verschraubungen und Übergangsstücke.\"},{\"t\":\"Schweißtechnik \u0026 Werkzeug\",\"d\":\"Schneidwerkzeuge, Schweißgeräte und Schweißmaschinen für Muffen-, Stumpf- und Elektroschweißverfahren.\"},{\"t\":\"Heiß- \u0026 Kaltwasser\",\"d\":\"Ausgelegt für Trinkwasser — heiß und kalt — mit hoher Temperatur- und Druckbeständigkeit über Jahrzehnte.\"}],\"techEyebrow\":\"Technische Daten\",\"techTitle\":\"Dimensionen \u0026 Druckstufen\",\"techLead\":\"Je nach Rohrtyp ab 20 mm bis 630 mm — Formteile bis 315 mm.\",\"ctaFeatures\":\"Produkteigenschaften (PDF)\",\"tableHead\":[\"Komponente\",\"Dimension\",\"Druckstufen\"],\"tableRows\":[[\"Monolayer-Rohre\",\"20 – 630 mm\",\"SDR 6 / 7,4 / 9 / 11 / 17\"],[\"Multilayer-Rohre (GF-verstärkt)\",\"20 – 630 mm\",\"SDR 6 / 7,4 / 9 / 11 / 17\"],[\"Formteile\",\"20 – 315 mm\",\"systemkompatibel\"],[\"Ventile \u0026 Verschraubungen\",\"systemabhängig\",\"—\"],[\"Schweißtechnik \u0026 Werkzeuge\",\"alle Dimensionen\",\"—\"]],\"seoArticle\":{\"pipes\":{\"areas\":\"Trinkwasserinstallation, Heizungsbau, Klimatechnik, Industrielle Anlagen, Schiffbau\",\"advTitle\":\"Überlegene Rohrleitungstechnik für jedes Projekt\",\"advList\":[\"Keine Korrosion: 100% resistent gegen Lochfraß und Rost.\",\"Geringer Druckverlust: Die extrem glatte Innenfläche minimiert Reibung und spart Pumpenenergie.\",\"Lange Lebensdauer: Garantiert über 50 Jahre wartungsfrei im Dauereinsatz.\",\"Geräuschreduktion: Hervorragende Schalldämmung gegen Fließgeräusche.\",\"Hygienisch: Erfüllt strengste internationale Trinkwassernormen (DVGW, KIWA).\"],\"seoText\":\"Unsere Hochleistungsrohre werden in Waldsolms nach höchsten Qualitätsstandards gefertigt. Die Materialkombination PP-R und PPRCT sorgt für außergewöhnliche Temperatur- und Druckbeständigkeit. Egal ob in der Haustechnik, im industriellen Anlagenbau oder bei komplexen Kühlsystemen – dieses Rohrsystem liefert maximale Sicherheit und Effizienz. Die einfache und sichere Schweißtechnik garantiert absolut leckagefreie Verbindungen.\",\"guideTitle\":\"Umfassender Ratgeber: Planung und Installation von K Aqua PP-R \u0026 PPRCT Rohrsystemen\",\"guideText\":\"$27\",\"seoTitle\":\"PP-R \u0026 PPRCT Rohrsysteme Übersicht\",\"faq\":[{\"q\":\"Was unterscheidet PPRCT von herkömmlichem PP-R bei Rohrleitungssystemen?\",\"a\":\"PPRCT (Polypropylene Random Copolymer with Modified Crystallinity Temperature resistance) besitzt eine speziell modifizierte Kristallstruktur, die eine höhere Druckbeständigkeit bei erhöhten Betriebstemperaturen ermöglicht. Dadurch können dünnwandigere Rohre bei gleichem Nenndruck eingesetzt werden, was den Innendurchmesser und die hydraulische Durchflusskapazität um bis zu 17 % erhöht.\"},{\"q\":\"Wie reduziert die K-Fiber Faserverbundtechnologie die thermische Längenausdehnung?\",\"a\":\"Unsere K-Fiber Rohre besitzen eine integrierte Mittelschicht aus glasfaserverstärktem Polypropylen. Diese Schicht stabilisiert das Rohr mechanisch und senkt den Ausdehnungskoeffizienten auf ca. 0,035 mm/(m·K). Dies entspricht einer Reduktion der thermischen Längenausdehnung um 75 % gegenüber Standard-Kunststoffrohren.\"},{\"q\":\"Sind K Aqua PP-R Rohrsysteme für Trinkwasser zertifiziert?\",\"a\":\"Ja, K Aqua Rohrsysteme erfüllen die strengsten Prüf- und Hygieneanforderungen internationaler Zertifizierungsstellen wie DVGW, KIWA und WRAS. Der Werkstoff ist vollkommen unbedenklich, geschmacks- und geruchsneutral und verhindert wirksam Kalk- sowie Biofilmbildung.\"},{\"q\":\"Wie wird eine absolut leckagefreie Schweißverbindung hergestellt?\",\"a\":\"Die Verbindung erfolgt durch thermische Polyfusion bei 260°C. Rohr und Fitting verschmelzen dabei auf molekularer Ebene zu einer homogenen, unlösbaren Einheit. Da keine fehleranfälligen Gummidichtungen oder Pressfittings verwendet werden, bleibt die Schweißnaht über 50 Jahre lang vollkommen dicht.\"},{\"q\":\"Welche Druckstufen und Dimensionen sind für K Aqua Rohre verfügbar?\",\"a\":\"K Aqua bietet Rohrsysteme in den Druckstufen SDR 6, SDR 7.4, SDR 9 und SDR 11 (PN10 bis PN25) sowie in Außendurchmessern von 20 mm bis 250 mm an. Damit lassen sich sowohl feingliedrige Etagenverteilungen als auch massive Haupt- und Steigleitungen realisieren.\"}]},\"fittings\":{\"areas\":\"Trinkwassernetz, Sanitärinstallation, Industrielle Verteilung, Heizungsbau\",\"advTitle\":\"Sichere und homogene Verbindungen\",\"advList\":[\"Homogene Verschweißung: Rohr und Fitting verschmelzen zu einer untrennbaren Einheit.\",\"Keine Dichtungen nötig: Die dauerhafte Verbindung benötigt keine fehleranfälligen O-Ringe.\",\"Einfache Montage: Schnelle und sichere Verarbeitung auf der Baustelle.\",\"Voller Durchfluss: Keine Querschnittsverengung, wodurch der Systemdruck erhalten bleibt.\",\"Chemische Beständigkeit: Resistent gegen eine Vielzahl aggressiver Medien.\"],\"seoText\":\"Formteile von K Aqua sind das Bindeglied für zuverlässige Rohrnetze. Gefertigt in Deutschland, bieten diese Fittings höchste Präzision und Maßhaltigkeit. Die Verschweißungstechnik (Muffenschweißen) dauert nur wenige Sekunden und kühlt zu einer Verbindung ab, die genauso stark ist wie das Rohr selbst. Dadurch eliminieren Sie das Risiko von Mikroleckagen, wie sie oft bei Press- oder Stecksystemen nach Jahren auftreten können.\",\"guideTitle\":\"Technischer Leitfaden: Sichere Verbindungen mit K Aqua Formteilen\",\"guideText\":\"$28\",\"seoTitle\":\"Kunststoff-Fittings \u0026 Formteile\"},\"valves\":{\"areas\":\"Strangabsperrung, Anlagensteuerung, Verteilerschränke, Industrie\",\"advTitle\":\"Präzise Steuerung und langlebige Funktion\",\"advList\":[\"Wartungsfrei: Die Mechanik ist auf jahrzehntelange reibungslose Funktion ausgelegt.\",\"Voller Durchgang: Kugelhähne mit vollem Querschnitt minimieren Druckverluste.\",\"Einfache Integration: Direkt in das PP-R System einschweißbar.\",\"Hochwertige Materialien: Ventilsitze und Kugeln aus korrosionsfesten Legierungen.\",\"Sichere Absperrung: 100% dicht selbst unter extremen Druck- und Temperaturwechseln.\"],\"seoText\":\"Absperrarmaturen und Ventile von K Aqua kombinieren die bewährte PP-R Schweißtechnik mit hochwertigen mechanischen Komponenten. Sie ermöglichen eine präzise Steuerung von Fluiden und eine sichere Isolation von Netzabschnitten für Wartungsarbeiten. Jede Armatur wird vor der Auslieferung strengen Druckprüfungen unterzogen, um höchste Betriebssicherheit in kritischen Anwendungen zu gewährleisten.\",\"guideTitle\":\"Expertenratgeber: Anlagensteuerung mit K Aqua Ventilen und Armaturen\",\"guideText\":\"$29\",\"seoTitle\":\"Absperrventile \u0026 Kugelhähne\"},\"weldInSaddles\":{\"areas\":\"Nachträgliche Abzweige, Rohrnetzerweiterung, Verteilungsaufbau\",\"advTitle\":\"Weld-in Saddles (Einschweißsättel) für maximale Flexibilität\",\"advList\":[\"Nachträgliche Installation: Erweiterung bestehender PP-R Rohrnetze ohne Trennen des Hauptrohres.\",\"Zeitsparend: Bohren, Aufheizen, Einschweißen – fertig in wenigen Minuten.\",\"Druckresistent: Die Sattelschweißung erreicht dieselbe Druckstufe wie das Basisrohr.\",\"Voller Durchfluss: Keine Querschnittsverengung im Hauptstrang.\",\"Vielseitig: Erhältlich mit oder ohne metallischen Gewindeübergang (IG/AG).\"],\"seoText\":\"Weld-in Saddles (Einschweißsättel) für maximale Flexibilität sind die perfekte Lösung für nachträgliche Abzweige in bestehenden Leitungsnetzen. Anstatt das Hauptrohr mühsam zu trennen und T-Stücke einzusetzen, wird das Rohr lediglich angebohrt und der Sattel homogen aufgeschweißt. Diese Technik spart enorme Montagezeiten und Materialkosten bei industriellen Verteilersystemen.\",\"guideTitle\":\"Installationsleitfaden: Flexibilität durch Einschweißsättel (Weld-in Saddles)\",\"guideText\":\"$2a\",\"seoTitle\":\"Einschweißsättel für Rohrleitungen\"},\"accessories\":{\"areas\":\"Rohrbefestigung, Dichtung, Flanschverbindung, Reparatur\",\"advTitle\":\"Accessories (Zubehör) für eine normgerechte Installation\",\"advList\":[\"Perfekte Passform: Alle Zubehörteile sind geometrisch auf das K Aqua Rohrsystem abgestimmt.\",\"Thermodynamische Befestigung: Rohrschellen mit Gummieinlage für Fest- und Loslager.\",\"Hochwertige Flanschverbindungen: Losflansche und EPDM-Dichtungen für den Übergang auf Metall.\",\"Schnelle Reparatur: Reparaturstopfen für versehentlich angebohrte Rohre.\",\"UV-Beständigkeit: Ausgewählte Zubehörteile sind speziell für die Außenaufstellung stabilisiert.\"],\"seoText\":\"Das richtige Accessories-Sortiment (Zubehör) ist entscheidend für die Langlebigkeit eines Rohrnetzes. K Aqua bietet eine umfassende Zubehör-Matrix: von der thermodynamischen Befestigungsschelle zur Aufnahme von Längenausdehnungen bis hin zur EPDM-Flachdichtung für Flanschverbindungen. Nur mit dem perfekt abgestimmten K Aqua Zubehör gewährleisten Sie die Einhaltung aller GEG- und DIN 18381-Vorgaben.\",\"guideTitle\":\"Fachratgeber: K Aqua Zubehör für normgerechte Installationen\",\"guideText\":\"$2b\",\"faq\":[{\"q\":\"Sind die Zubehörteile für Kalt- und Warmwasser geeignet?\",\"a\":\"Ja, unsere Accessories wie Rohrschellen und Flachdichtungen sind für den Einsatz in Kaltwasser-, Warmwasser- und Heizungssystemen konzipiert und weisen eine hervorragende thermische Stabilität auf.\"},{\"q\":\"Kann ich Zubehör von Drittanbietern verwenden?\",\"a\":\"Um die volle K Aqua Systemgewährleistung in Anspruch zu nehmen, ist es zwingend erforderlich, Original-Zubehörteile zu verwenden. Fremdkomponenten können zu Dichtigkeitsproblemen oder mechanischen Ausfällen führen.\"},{\"q\":\"Gibt es spezielles Zubehör für den industriellen Einsatz?\",\"a\":\"Ja, unser Sortiment umfasst hochbelastbare Losflansche mit Stahlkern, EPDM-Spezialdichtungen und verstärkte Rohrschellen, die extremen industriellen Belastungen problemlos standhalten.\"}],\"seoTitle\":\"Zubehör für die Rohrinstallation\"},\"tools\":{\"areas\":\"Vorfertigung, Baustellenmontage, Reparatur, Spezialanwendungen\",\"advTitle\":\"Höchste Präzision für die perfekte Verbindung\",\"advList\":[\"Exakte Temperaturkontrolle: Mikroprozessorgesteuerte Heizelemente halten exakt 260°C.\",\"Antihaft-Beschichtung: Teflon-PTFE für eine rückstandsfreie Schmelze.\",\"Ergonomisches Design: Reduziert die physische Belastung des Installateurs.\",\"Digitale Dokumentation: Stumpf- und Elektroschweißmaschinen mit Protokollfunktion.\",\"Lange Lebensdauer: Robuste Mechanik für den rauen Baustellenalltag.\"],\"seoText\":\"Das K Aqua Werkzeugsortiment bildet die unverzichtbare Grundlage für die fachgerechte Verarbeitung unserer Rohrleitungssysteme. Von der präzisen Rohrschere bis zur automatisierten CNC-Stumpfschweißmaschine bieten wir für jede Dimension das optimale Equipment. Nur mit kalibrierten Originalwerkzeugen lassen sich die vom DVS geforderten Fügeparameter exakt einhalten, um die Lebensdauer von über 50 Jahren zu garantieren.\",\"guideTitle\":\"Praxisleitfaden: Profi-Werkzeuge für die K Aqua Rohrmontage\",\"guideText\":\"$2c\",\"seoTitle\":\"Schweißwerkzeuge \u0026 Rohrabschneider\"},\"fallback\":{\"areas\":\"Universelle Installationstechnik, Baustellenbedarf, Systemergänzung\",\"advTitle\":\"Perfekte Systemergänzung\",\"advList\":[\"geprüfte Qualität: Entspricht dem ISO 9001 Managementsystem.\",\"Systemkompatibilität: Perfekt auf das K Aqua Rohrsystem abgestimmt.\",\"Langlebigkeit: Robuste Materialien für den rauen Baustellenalltag.\",\"Sichere Anwendung: Garantierte Funktion bei fachgerechter Anwendung.\",\"Wirtschaftlichkeit: Hervorragendes Preis-Leistungs-Verhältnis.\"],\"seoText\":\"Als Systemanbieter liefert K Aqua nicht nur Rohre und Fittings, sondern auch das gesamte benötigte Werkzeug und Zubehör. Vom hochpräzisen Schweißgerät bis zum zuverlässigen Rohrabschneider – unsere Werkzeuge garantieren eine normgerechte Verarbeitung und maximale Installationssicherheit. Setzen Sie auf Originalzubehör, um die Gewährleistung Ihres K Aqua Gesamtsystems zu erhalten.\"},\"transitionFittings\":{\"guideText\":\"$2d\"}},\"labels\":{\"applicationAreas\":\"Einsatzgebiete\",\"advantages\":\"Ihre Vorteile im Überblick\",\"technicalDescription\":\"Technisches Profil \u0026 SEO\",\"noResults\":\"Keine Produkte gefunden\",\"searchPlaceholder\":\"Suchen nach Titel oder Artikelnummer...\",\"faqTitle\":\"Häufig gestellte Fragen (FAQ)\",\"faqFallbackQ1\":\"Was sind die Hauptvorteile?\",\"faqFallbackA1\":\"Das System bietet extreme Langlebigkeit, Korrosionsbeständigkeit und hervorragende hygienische Eigenschaften für Trinkwasser.\",\"faqFallbackQ2\":\"Ist das Material umweltfreundlich?\",\"faqFallbackA2\":\"Ja, PPRCT ist zu 100% recycelbar und hat einen sehr geringen CO2-Fußabdruck im Vergleich zu Metallrohren.\",\"faqFallbackQ3\":\"Wie erfolgt die Installation?\",\"faqFallbackA3\":\"Die Installation erfolgt sicher und leckagefrei durch Polyfusion-Schweißen.\",\"downloads\":\"Downloads \u0026 Dokumente\",\"tds\":\"Technisches Datenblatt\",\"tdsDesc\":\"Spezifikationen \u0026 Maße (PDF)\",\"cert\":\"Zertifikate \u0026 Normen\",\"certDesc\":\"ISO 9001 · 14001 · 50001 (PDF)\",\"install\":\"Installations-Guide\",\"installDesc\":\"Anleitung zum Schweißen (PDF)\",\"range\":\"Produktprogramm\",\"rangeDesc\":\"Komplettes Produktprogramm mit Maßen (PDF)\",\"features\":\"Produkteigenschaften\",\"featuresDesc\":\"Materialeigenschaften \u0026 Systemvorteile (PDF)\"},\"specAndDim\":\"Spezifikationen \u0026 Dimensionen\",\"certsAndNorms\":\"Zertifikate \u0026 Normen\",\"approved\":\"geprüft\",\"monitoring\":\"überwacht\",\"certified\":\"geprüft\",\"quickLinks\":\"Schnellzugriff\",\"calcCo2\":\"CO2-Fußabdruck berechnen\",\"backToFinder\":\"Zurück zum Produktfinder\",\"enterpriseCore\":\"Enterprise Core\",\"highPerformance\":\"High-Performance Pipe Systems\",\"highPerformanceDesc\":\"For industrial applications, drinking water supply, and climate control under extreme conditions.\",\"sysPressure\":\"System Pressure\",\"tempMax\":\"Max Temperature\",\"material\":\"Material\",\"norm\":\"Standard\",\"certification\":\"Certification\",\"lifespan\":\"Lifespan\",\"fiberTech\":\"Fiber-Composite Technology\",\"fiberTechDesc\":\"3-layer structure for minimized linear expansion and maximum stability at high temperatures.\",\"compliance\":\"Compliance \u0026 Standards\",\"dimensions\":\"Dimensions\",\"globalNetwork\":\"Global Network\",\"globalNetworkDesc\":\"K Aqua systems are in use in over 40 countries worldwide.\",\"whyChoose\":\"Why {product} is the right choice\",\"tools\":{\"metaTitle\":\"Professionelle Werkzeuge \u0026 Zubehör für PP-R Systeme\",\"metaDesc\":\"Entdecken Sie professionelle K-Aqua Werkzeuge und Zubehörteile. Für sichere, effiziente und langlebige Installationen von PP-R und PP-RCT Rohrleitungssystemen.\",\"heroEyebrow\":\"German Engineering\",\"heroTitle\":\"Werkzeuge \u0026 Zubehör.\",\"heroSubtitle\":\"Absolute Präzision.\",\"heroDesc\":\"Dieses Modul liefert kompromisslose Sicherheit für die anspruchsvollsten Projekte weltweit. Gefertigt nach den strengsten Industriestandards, um Generationen zu überdauern. Wo Materialversagen keine Option ist.\",\"heroBtnPrimary\":\"Projekt anfragen\",\"heroBtnSecondary\":\"Technische Daten\",\"bentoEyebrow\":\"Das K Aqua Ökosystem\",\"bentoTitle\":\"Werkzeuge für globale Megaprojekte.\",\"bentoLead\":\"Wenn internationale Generalunternehmer Milliardenprojekte planen, vertrauen sie nicht auf Versprechungen, sondern auf harte Fakten und hochpräzises Equipment.\",\"bento1Title\":\"Heizelemente-Muffenschweißgeräte\",\"bento1Desc\":\"Für Dimensionen 20 mm bis 125 mm. Kompakte, robuste Bauweise für den harten Baustelleneinsatz.\",\"bento2Title\":\"Rohrschneider \u0026 Scheren\",\"bento2Desc\":\"Ergonomische Designs für ermüdungsfreies Arbeiten und perfekte 90°-Schnitte.\",\"bento3Title\":\"Stumpfschweißmaschinen\",\"bento3Desc\":\"Für Nennweiten bis zu 250 mm. CNC-gesteuert für absolute Wiederholgenauigkeit.\",\"bento4Title\":\"Reparatursets \u0026 Zubehör\",\"bento4Desc\":\"Bohrerköpfe, Reparatursättel und Lochsägen für nachträgliche Abzweige.\",\"scrollEyebrow\":\"Tiefe Technologie\",\"scrollTitle\":\"Kein Raum für Fehlertoleranzen.\",\"scrollLead\":\"Entdecken Sie die technologischen Details, die unser Werkzeug zur ersten Wahl für geprüfte Installateure machen.\",\"scroll1Title\":\"Perfekte Thermodynamik. Bei jeder Schweißung.\",\"scroll1Desc\":\"Unsere Heizelemente-Muffenschweißgeräte sind mit hochpräzisen, teflonbeschichteten Heizdornen und Heizbuchsen ausgestattet. Die mikroprozessorgesteuerte Temperaturregelung garantiert eine konstante Schweißtemperatur von 260°C – selbst bei extremen Außentemperaturen auf globalen Baustellen. So entsteht eine untrennbare, homogene Verbindung auf molekularer Ebene.\",\"scroll2Title\":\"CNC-gesteuerte Stumpfschweißung.\",\"scroll2Desc\":\"Für große Nennweiten (bis zu 250 mm und mehr) setzen wir auf CNC-gesteuerte Stumpfschweißmaschinen. Automatische Druck- und Zeitberechnung eliminieren menschliche Fehlerquellen. Jeder Schweißzyklus wird digital protokolliert, um eine lückenlose Rückverfolgbarkeit für die Bauabnahme sicherzustellen. German Engineering auf höchstem Niveau.\",\"scroll3Title\":\"Präzisions-Rohrschäler. Auf den Millimeter genau.\",\"scroll3Desc\":\"Die Vorbereitung ist 80% der Schweißung. Unsere mechanischen und elektrischen Rohrschäler entfernen die Oxidschicht von K Aqua Rohren mit absolut gleichmäßiger Schnitttiefe. Dies verhindert Mikrorisse und stellt eine perfekte Fusionsebene her. Ein Werkzeug, das Generationen überdauert.\",\"scroll4Title\":\"Kaltkreissägen für exakte Schnitte.\",\"scroll4Desc\":\"Rohrscheren können das Material verformen. Unsere industriellen Kaltkreissägen garantieren perfekt rechtwinklige, gratfreie Schnitte. Das Resultat: Keine spannungsinduzierten Risse, kein Druckverlust, absolute Planparallelität vor dem Schweißvorgang.\",\"timelineTitle\":\"Der K Aqua Schweißprozess\",\"timelineDesc\":\"Vom Schnitt bis zur molekularen Fusion. Ein standardisierter Prozess, der zu 100% dichten und wartungsfreien Rohrsystemen führt.\",\"timeline1Year\":\"Phase 1: Materialvorbereitung\",\"timeline1Title\":\"Der perfekte Schnitt.\",\"timeline1Text\":\"Ein gratfreier, 90-Grad-Schnitt ist das Fundament jeder dauerhaften Verbindung. Unsere Präzisionsschneider und Kaltkreissägen garantieren eine absolut plane Oberfläche ohne mikrostrukturelle Verformungen des Polypropylens.\",\"timeline2Year\":\"Phase 2: Kalibrierung \u0026 Schälen\",\"timeline2Title\":\"Entfernung der Oxidschicht.\",\"timeline2Text\":\"Vor dem Schweißen wird das Rohr exakt kalibriert und die äußere Oxidschicht mit unseren speziellen Schäler-Werkzeugen auf den Millimeter genau abgetragen. Das ermöglicht eine 100% reine Oberfläche für den Fusionsprozess.\",\"timeline3Year\":\"Phase 3: Thermische Fusion\",\"timeline3Title\":\"Molekulare Verschmelzung.\",\"timeline3Text\":\"Rohr und Fitting werden simultan auf der teflonbeschichteten Heizmatrix auf exakt 260°C erwärmt. Der mikroprozessorgesteuerte Thermostat der K Aqua Schweißgeräte hält die Temperatur konstant – unabhängig von Wind oder Wetter.\",\"timeline4Year\":\"Phase 4: Die Verbindung\",\"timeline4Title\":\"Lebenslange Sicherheit.\",\"timeline4Text\":\"Innerhalb der vorgegebenen Umstellzeit werden die erhitzten Bauteile ohne Verdrehen ineinandergefügt. Nach der Auskühlphase entsteht ein neues, absolut homogenes Werkstück. Wartungsfrei für über 50 Jahre.\",\"specsTitle\":\"Industrielle Autorität. \u003cbr/\u003e Bis ins Detail.\",\"specsP1\":\"Seit Jahrzehnten bündeln wir in unserem Stammwerk im Herzen Deutschlands handwerklichen Stolz mit modernster, hochautomatisierter Fertigungstechnologie.\",\"specsP2\":\"Im Einsatz in den härtesten Wüsten und extremsten Klimazonen der Welt beweist sich unser Material jeden Tag aufs Neue. Wir setzen den Standard, dem der Rest der Welt folgt.\",\"specsList1\":\"ISO 9001 geprüft\",\"specsList2\":\"Teflon PTFE Beschichtung der Güteklasse A\",\"specsList3\":\"Digitale Temperaturkalibrierung\",\"ctaTitle\":\"Bereit für kompromisslose Qualität?\",\"ctaDesc\":\"Sprechen Sie mit unserem Engineering Team über Ihr nächstes Megaprojekt und fordern Sie Muster unserer Werkzeuge an.\",\"ctaBtn\":\"Projektanfrage starten\",\"hero\":{\"eyebrow\":\"Werkzeuge \u0026 Zubehör\",\"title\":\"Schweißwerkzeuge für die PP-R Installation\",\"lead\":\"Muffenschweißgeräte, Heizwendel-Technik und Kalibrierwerkzeug: Mit K Aqua Originalwerkzeugen entstehen normgerechte, dauerhaft dichte Schweißverbindungen auf jeder Baustelle. Professionelle Werkzeuge für die PP-R Installation.\"}},\"valves\":{\"metaTitle\":\"Hochwertige Armaturen \u0026 Ventile für PP-R Rohrsysteme\",\"metaDesc\":\"Entdecken Sie hochwertige Armaturen und Ventile von K-Aqua. Maximale Sicherheit und Langlebigkeit durch German Engineering für anspruchsvolle Rohrnetze.\",\"heroEyebrow\":\"Die Armaturen-Klasse\",\"heroTitle\":\"Absolute Kontrolle.\",\"heroSubtitle\":\"Unter höchstem Druck.\",\"heroDesc\":\"Willkommen in der obersten Liga der Strömungstechnik. K Aqua Ventile und Armaturen sind nicht einfach nur Komponenten – sie sind das unbestechliche Herzstück globaler Infrastruktur. Gefertigt für die Ewigkeit.\",\"heroBtnPrimary\":\"Technologie anfragen\",\"heroBtnSecondary\":\"Die Architektur entdecken\",\"manifestoTitle\":\"Wenn das Material nachgibt, bricht das System. \u003cbr/\u003e\u003cspan class=\\\"text-primary\\\"\u003eWir geben nicht nach.\u003c/span\u003e\",\"manifestoP1\":\"In der industriellen Strömungstechnik ist ein Ventil niemals nur ein Schalter für Flüssigkeiten. Es ist der kritische Knotenpunkt, an dem kinetische Energie, extremer Druck, thermische Ausdehnung und chemische Aggressivität aufeinandertreffen.\",\"manifestoP2\":\"Hier trennt sich banale Massenware von echter Ingenieurskunst. Unsere Armaturen sind massiv überdimensioniert, paranoid genau en nicht aus, wenn Milliarden-Infrastrukturen auf dem Spiel stehen. Bevor eine Armatur das K Aqua Werk verlässt, wird sie einem vollautomatisierten, robotischen Prüfzyklus unterzogen, der die realen Belastungen um ein Vielfaches übersteigt. Hydraulische Hochdrucktests, Helium-Vakuum-Lecktests und thermische Schockprüfungen garantieren unsere legendäre Null Fehler-Quote.\",\"showcaseEyebrow\":\"Anatomie der Zuverlässigkeit\",\"showcaseTitle\":\"Keine Schwachstellen. \u003cbr/\u003e Keine toten Winkel.\",\"showcaseP1\":\"Die innere Architektur unserer Armaturen ist konsequent auf \u003cstrong\u003eTotraumfreiheit\u003c/strong\u003e getrimmt. Stagnationszonen, in denen sich Bakterien wie Legionellen vermehren könnten, sind geometrisch eliminiert.\",\"showcaseP2\":\"Das Wasser schießt in einer perfekt geführten laminaren Strömung durch den Ventilkörper. Die massiven Dichtsitze sind selbstreinigend und schließen selbst nach dem millionsten Zyklus hermetisch ab.\",\"showcaseList1\":\"geprüfte Trinkwasserhygiene nach höchsten Standards\",\"showcaseList2\":\"Hermetische Abdichtung bei maximalem Betriebsdruck\",\"showcaseList3\":\"Wartungsfreie Spindelabdichtungen mit Doppel-O-Ring\",\"bentoEyebrow\":\"Spezifikationen\",\"bentoTitle\":\"Die nackten Zahlen der Überlegenheit.\",\"bentoLead\":\"Wenn Marketing-Phrasen enden, sprechen die Daten. Entdecken Sie die technischen Parameter, die unsere Ventile zur ultimativen Wahl für Megaprojekte machen.\",\"bento1Title\":\"PN25 Dauerdruckbelastung\",\"bento1Desc\":\"Entwickelt für dauerhafte Hochdruckanwendungen jenseits der Norm. Die Wandstärken und Gewindekonstruktionen sind so massiv ausgelegt, dass sie selbst bei extremen Druckspitzen und Wasserschlägen nicht im Geringsten nachgeben. Ein monolithischer Block der Sicherheit.\",\"bento2Title\":\"Thermische Souveränität\",\"bento2Desc\":\"Von eisiger Kälte bis hin zu kochenden Vorlauftemperaturen. Das High End-Material behält seine volle Elastizität, versprödet nicht und widersteht thermischer Ausdehnung extrem effektiv.\",\"bento3Title\":\"Chemische Resistenz\",\"bento3Desc\":\"Korrosion ist ein Konzept aus der Vergangenheit. Unsere Armaturen sind immun gegen aggressive Bodenbeschaffenheiten, harte Wässer und chlorhaltige Desinfektionsmaßnahmen. Kein Rosten, kein Lochfraß.\",\"bento4Title\":\"Industrielle Ergonomie \u0026 Haptik\",\"bento4Desc\":\"Design trifft auf rohe Funktionalität. Die massiven Handräder, massereichen Hebel und präzise gearbeiteten Spindeln bieten selbst mit schweren Schutzhandschuhen ein sofortiges, taktiles und absolut präzises Feedback beim Schließen und Öffnen.\",\"timelineEyebrow\":\"Der Weg der Härte.\",\"timelineLead\":\"Ein Zeitstrahl der kompromisslosen Qualitätssicherung. Wie eine Idee zu einer industriellen Legende wird.\",\"timeline1Year\":\"Phase 01\",\"timeline1Title\":\"Molekulare Selektion\",\"timeline1Text\":\"Auswahl von spezifisch für K Aqua formulierten metallischen Legierungen und Hochleistungs-Polymeren. Wir setzen auf absolute Kriechfestigkeit und maximale molekulare Stabilität.\",\"timeline2Year\":\"Phase 02\",\"timeline2Title\":\"CFD Strömungsoptimierung\",\"timeline2Text\":\"Mithilfe von Supercomputern werden die inneren Strömungskanäle in Tausenden Iterationen berechnet, um den Fließwiderstand gegen Null zu minimieren.\",\"timeline3Year\":\"Phase 03\",\"timeline3Title\":\"Klimakammer-Stresstest\",\"timeline3Text\":\"Prototypen durchlaufen monatelange Dauerbelastungstests in unseren Klimakammern bei bis zu 120°C, 25 Bar Druck und extremen chemischen Lösungen.\",\"timeline4Year\":\"Phase 04\",\"timeline4Title\":\"Robotische Serienfertigung\",\"timeline4Text\":\"Die Überführung in unsere hochautomatisierte Industrie 4.0 Fertigungslinie. Wir erreichen maximale Reproduzierbarkeit bei minimalsten Toleranzen ohne menschliche Fehlerquelle.\",\"timeline5Year\":\"Phase 05\",\"timeline5Title\":\"Globaler Einsatz\",\"timeline5Text\":\"Bereitstellung auf den kritischsten Baustellen der Welt – von Wüsten-Megaprojekten bis zu Offshore-Anlagen. Begleitet von unserem Field-Engineering Team.\",\"finalTitle\":\"Bauen Sie für Generationen. \u003cbr/\u003eNicht für das nächste Wartungsintervall.\",\"finalDesc\":\"In einer Welt, die zunehmend auf schnelle Obsoleszenz und billige Austauschprodukte setzt, stehen wir als stählerner Gegenpol. Eine K Aqua Armatur wird eingebaut – und dann vergessen. Weil sie einfach funktioniert. Jahrzehnt für Jahrzehnt. Vertrauen Sie auf echte industrielle Autorität.\",\"ctaTitle\":\"Bereit für absolute Kontrolle?\",\"ctaDesc\":\"Sprechen Sie mit unseren Chef-Ingenieuren über die Spezifikationen Ihres nächsten Megaprojekts. Wir liefern die Lösungen für Probleme, die andere noch nicht einmal verstanden haben.\",\"ctaBtnPrimary\":\"Technisches Consulting anfordern\",\"ctaBtnSecondary\":\"Spezifikationen als PDF\",\"hero\":{\"eyebrow\":\"Ventile \u0026 Armaturen\",\"title\":\"PP-R Armaturen \u0026 Ventile für präzise Regelung\",\"lead\":\"Absperren, regeln, sichern: K Aqua Armaturen aus PP-R verbinden korrosionsfreie Hydraulik mit deutscher Fertigungspräzision — für Trinkwasser, HLK und Industrie. Für präzise Regelung in Trinkwasser- und Heizungsnetzen.\"}},\"category\":{\"allProducts\":\"Alle Produkte\",\"openInFinder\":\"Im Finder öffnen\",\"artNA\":\"Art. N/A\",\"viewDetails\":\"Details ansehen\",\"learnMoreKnowledge\":\"Mehr erfahren im K Aqua Fachwissen\",\"learnMoreDesc\":\"Tauchen Sie tiefer in die technische Dokumentation ein und entdecken Sie Fachartikel zur Installation, Nachhaltigkeit und Prüfung unserer Systeme.\",\"toKnowledgeBase\":\"Zur Wissensdatenbank\"},\"fittings\":{\"meta\":{\"title\":\"Formteile \u0026 Fittings | K Aqua\",\"desc\":\"K Aqua Formteile \u0026 Fittings – Kompromisslose Sicherheit durch German Engineering für globale Megaprojekte.\"},\"hero\":{\"eyebrow\":\"Formteile \u0026 Fittings\",\"title\":\"PP-R Fittings \u0026 Formteile für dauerhaft dichte Verbindungen\",\"lead\":\"Vom Winkel bis zur Reduzierung: K Aqua PP-R Fittings verschmelzen beim Schweißen molekular mit dem Rohr — ein homogenes System ohne Dichtungen und ohne Schwachstellen. Für dauerhaft dichte Verbindungen in jedem Rohrnetz.\"},\"intro\":{\"eyebrow\":\"Die Industrielle Autorität\",\"title\":\"Sicherheit ist kein Zufall. Sie ist berechenbar.\",\"lead\":\"Wenn internationale Generalunternehmer Milliardenprojekte planen, vertrauen sie nicht auf Versprechungen, sondern auf harte Fakten. Wir setzen den Standard, dem der Rest der Welt folgt.\",\"text1\":\"Seit Jahrzehnten bündeln wir in unserem Stammwerk im Herzen Deutschlands handwerklichen Stolz mit modernster, hochautomatisierter Fertigungstechnologie. Jeder Winkel, jede Muffe, jedes T-Stück trägt die unverkennbare DNA deutscher Ingenieurskunst. Im Einsatz in den härtesten Wüsten, extremsten Klimazonen und anspruchsvollsten Industrieanlagen der Welt beweist sich unser Material jeden Tag aufs Neue.\",\"text2\":\"Die Verschmelzung von Makromolekülen in unserem PP-R System schafft ein Rohrleitungsnetzwerk ohne Schwachstellen. Es gibt keine Dichtungsringe, die korrodieren können, keine Klebestellen, die durch Chemikalien angegriffen werden. Das Rohr und das Fitting werden thermisch zu einem einzigen, untrennbaren Werkstück verschmolzen. Dies ist die absolute Definition von Sicherheit.\"},\"sticky\":{\"eyebrow\":\"Architektur der Perfektion\",\"title\":\"Die Anatomie der Zuverlässigkeit.\",\"lead\":\"Ein tiefer Einblick in die physikalischen und chemischen Eigenschaften, die unsere Formteile zum weltweiten Benchmark machen.\",\"items\":[{\"title\":\"Das molekulare Gefüge\",\"desc\":\"Unsere Fittings basieren auf einem hochgradig vernetzten PP-R Polypropylen Random Copolymerisat. Durch kontrollierte Temperatur-Druck-Profile während der Extrusion erreichen wir eine isotrope Kristallstruktur. Das Ergebnis: Eine nie dagewesene Widerstandsfähigkeit gegenüber Spannungsrissen und extremen Temperaturschwankungen.\"},{\"title\":\"Thermoplastische Präzision\",\"desc\":\"Jedes Formteil durchläuft einen thermoplastischen Spritzgussprozess mit Kavitäten-Toleranzen im Mikrometerbereich. Das stellt sicher, dass die Schmelzindizes beim Verschweißen mit unseren Rohren absolut identisch sind – für eine homogene, unlösbare und 100% leckagefreie Materialverbindung.\"},{\"title\":\"Null Fehlertoleranz\",\"desc\":\"Wir überlassen nichts dem Zufall. Mittels Ultraschall-Wanddickenmessung, hydrostatischen Innendruck-Zeitstandversuchen und DSC (Differential Scanning Calorimetry) wird jede Charge analysiert. Nur Material, das unsere internen Standards – die weit über der DIN EN ISO 15874 liegen – übertrifft, erhält die Freigabe.\"},{\"title\":\"Kavitationswiderstand\",\"desc\":\"Die strömungsoptimierte Innengeometrie unserer Fittings verhindert effektiv Druckabfälle und Kavitation, selbst bei extremen Fließgeschwindigkeiten in industriellen Steigleitungen. Dies minimiert Geräuschemissionen und schützt die Anlage vor abrasiver Abnutzung von innen.\"}]},\"bento\":{\"eyebrow\":\"Leistungsdaten\",\"title\":\"Spezifikationen jenseits des Standards.\",\"lead\":\"Während die Industrie Normen als Ziel betrachtet, sehen wir sie lediglich als absolutes Minimum.\",\"items\":[{\"title\":\"DIN EN ISO 15874\",\"desc\":\"Vollständige Konformität und Prüfung für Kunststoffrohrleitungssysteme für die Warm- und Kaltwasserinstallation.\"},{\"title\":\"PN 20 / PN 25\",\"desc\":\"Ausgelegt für permanente Hochdruck-Beanspruchung selbst bei kritischen Temperaturen.\"},{\"title\":\"Chemische Inertheit\",\"desc\":\"Herausragende Beständigkeit gegen aggressive Medien. pH-Wert-unabhängig (pH 1 bis 14) für industriellen Einsatz.\"},{\"title\":\"Akustische Dämpfung\",\"desc\":\"Die inhärente Elastizität des PP-R Materials absorbiert Körperschall und reduziert Fließgeräusche auf ein absolutes Minimum, ideal für Luxus-Hotellerie und Krankenhäuser.\"}]},\"timeline\":{\"title\":\"Der Genesis-Prozess\",\"desc\":\"Von der molekularen Rohmasse zum unzerstörbaren Bauteil. Ein Blick in unsere hochgradig automatisierte Fertigungsmatrix.\",\"items\":[{\"year\":\"Schritt 01\",\"title\":\"Granulat-Selektion\",\"text\":\"Ausschließlich hochreines, vorsynthetisiertes Polypropylen-Granulat aus europäischen Premium-Raffinerien passiert unsere Eingangskontrolle.\"},{\"year\":\"Schritt 02\",\"title\":\"Thermische Konditionierung\",\"text\":\"Vor dem Spritzguss wird das Granulat thermisch stabilisiert, um Restfeuchte zu eliminieren und eine homogene Schmelze zu garantieren.\"},{\"year\":\"Schritt 03\",\"title\":\"Hochdruck-Spritzguss\",\"text\":\"In vollautomatisierten, robotergestützten Spritzgusszellen formen wir das Material unter enormem Druck zu makellosen Fittings.\"},{\"year\":\"Schritt 04\",\"title\":\"Kühlungs-Matrix\",\"text\":\"Ein computergesteuertes Abkühlprofil verhindert innere Spannungen im Material und sorgt für perfekte Maßhaltigkeit.\"},{\"year\":\"Schritt 05\",\"title\":\"Prüfung \u0026 Logistik\",\"text\":\"Jedes Los erhält sein digitales Zertifikat. Bereit für den Versand an die anspruchsvollsten Baustellen der Welt.\"}]},\"depth\":{\"title\":\"Lebensdauer \u003e 50 Jahre. Garantiert.\",\"text\":\"Die Zeit ist der ultimative Stresstest für jedes Material. Unsere Fittings sind darauf ausgelegt, die Lebensdauer des Gebäudes selbst zu übertreffen. Durch die Zugabe von speziellen Antioxidantien und thermischen Stabilisatoren in unsere PP-R Matrix wird die thermisch-oxidative Alterung massiv verzögert. Selbst bei kontinuierlichen Vorlauftemperaturen von 70°C und Druckbelastungen von 10 Bar garantieren wir eine Standzeit von über einem halben Jahrhundert. Das ist kein Marketing. Das ist angewandte Polymerphysik.\",\"badge\":\"100% Wartungsfrei\"},\"cta\":{\"title\":\"Bereit für kompromisslose Qualität?\",\"desc\":\"Verbinden Sie sich mit unserem Engineering Team. Wir liefern nicht nur Produkte, wir liefern die Sicherheit für Ihr nächstes Megaprojekt.\",\"primary\":\"Projektanfrage starten\",\"secondary\":\"Gesamtes Sortiment ansehen\"}},\"pipes\":{\"met
