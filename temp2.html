turen volle Funktion.\"},{\"q\":\"Wie wird das Ventil gewartet?\",\"a\":\"Die K Aqua PP-R Kugelhähne sind durch ihre Konstruktion absolut wartungsfrei und auf jahrzehntelangen, reibungslosen Betrieb ausgelegt.\"}]},\"pp-r-ball-valve-ball-in-brass-chromium-plated\":{\"seo_p1\":\"Der Kugelhahn mit verchromter Messingkugel (PP-R Ball Valve Ball in Brass Chromium Plated) vereint die Schweißbarkeit von Kunststoff mit der mechanischen Härte von Metall.\",\"seo_p2\":\"Eingebettet in einen massiven PP-R-Körper sorgt die hochglanzverchromte Messingkugel für extrem reibungsarmes und verschleißfreies Absperren selbst bei hohen Temperaturdifferenzen.\",\"seo_p3\":\"Dies ist die Standardarmatur für die Hauptabsperrung in Trinkwasser- und Heizungsnetzen, die sich durch absolute Zuverlässigkeit und eine lange, wartungsfreie Lebensdauer auszeichnet.\",\"faq\":[{\"q\":\"Bietet die Messingkugel Vorteile beim Durchfluss?\",\"a\":\"Ja, die verchromte Messingkugel kann mit geringeren Wandstärken gefertigt werden, was einen vollen, widerstandsfreien Durchgang ermöglicht.\"},{\"q\":\"Ist die Messingkugel trinkwassergeeignet?\",\"a\":\"Selbstverständlich, wir verwenden ausschließlich hochreines, zertifiziertes DZR-Messing, das keine Schwermetalle an das Trinkwasser abgibt.\"},{\"q\":\"Kann das Ventil in bestehende Metallrohrnetze integriert werden?\",\"a\":\"Ja, in Kombination mit Übergangsmuffen oder Flanschen lässt es sich problemlos als Absperrventil in Mischinstallationen einsetzen.\"}]},\"tee-90-female-thread-for-internal-valve\":{\"seo_p1\":\"Das 90°-T-Stück für Unterputzventile (Tee 90° Female Thread for Internal Valve) bildet die Basis für eine unsichtbare und platzsparende Armatureninstallation in der Wand.\",\"seo_p2\":\"Es besteht aus einem PP-R-Durchflusskörper mit einem speziell tiefgezogenen Messing-Innengewinde im Abzweig, das die Aufnahme von Ventiloberteilen ermöglicht.\",\"seo_p3\":\"Sanitärprofis nutzen dieses Bauteil in Vorwandinstallationen für Duschen und Wannen, um Absperrventile ästhetisch und sicher hinter Fliesen zu integrieren.\",\"faq\":[{\"q\":\"Welche Funktion erfüllt das Unterputzventil?\",\"a\":\"Es ermöglicht die Strangabsperrung einzelner Nasszellen (z. B. Bad oder Küche) direkt vor Ort, ohne in den Keller gehen zu müssen.\"},{\"q\":\"Wie tief darf das Ventil in der Wand sitzen?\",\"a\":\"Die Einbautiefe ist variabel. Sollte das Ventil durch dicken Fliesenaufbau zu tief sitzen, bieten wir entsprechende Spindelverlängerungen an.\"},{\"q\":\"Ist die Spindel austauschbar?\",\"a\":\"Ja, das gesamte mechanical Innenoberteil (Spindel, Dichtung) kann bei Bedarf herausgeschraubt und ausgetauscht werden, ohne die Wand zu öffnen.\"}]},\"concealed-valve-chrome-light-part\":{\"seo_p1\":\"Das Unterputzventil-Oberteil in leichter Chromausführung (Concealed Valve Chrome Light Part) bietet eine elegante Sichtkomponente für wandintegrierte Absperrungen.\",\"seo_p2\":\"Das Set umfasst einen Griff und eine Rosette aus verchromtem ABS-Kunststoff, passend für die standardisierten Messing-Spindeln unserer Unterputz-Armaturenkörper.\",\"seo_p3\":\"Es dient der komfortablen und optisch ansprechenden Wasserabsperrung direkt in der Nasszelle, ideal für moderne und kostensensible Objektbauten.\",\"faq\":[{\"q\":\"Ist der Chromgriff im Lieferumfang enthalten?\",\"a\":\"Ja, dieses Set beinhaltet das PP-R Ventilunterteil sowie die komplette, hochglanzverchromte Sichtgarnitur inklusive Rosette.\"},{\"q\":\"Kann die Rosette nach dem Fliesen montiert werden?\",\"a\":\"Selbstverständlich. Der Grundkörper wird unter Putz geschweißt, die Rosette und der Griff werden erst nach Fertigstellung der Wand aufgesteckt.\"},{\"q\":\"Aus welchem Material besteht der Griff?\",\"a\":\"Der Drehgriff besteht aus einer robusten Zinkdruckguss-Legierung (Zamak) mit einer langlebigen, pflegeleichten Chrombeschichtung.\"}]},\"concealed-valve-chrome-heavy-part\":{\"seo_p1\":\"Das schwere Unterputzventil-Oberteil aus verchromtem Messing (Concealed Valve Chrome Heavy Part) ist die Premium-Wahl für exklusive Badezimmerausstattungen.\",\"seo_p2\":\"Rosette und Bediengriff sind aus massivem, hochglanzverchromtem Messing gefertigt, was höchste mechanische Belastbarkeit und eine edle Haptik sicherstellt.\",\"seo_p3\":\"Diese Ausführung widersteht intensiver Beanspruchung in Hotels oder öffentlichen Sanitäranlagen und bewahrt über Jahrzehnte ihren makellosen Glanz.\",\"faq\":[{\"q\":\"Was unterscheidet das 'Long' Modell vom Standard-Unterputzventil?\",\"a\":\"Die verlängerte Spindelkonstruktion überbrückt problemlos tiefe Wandaufbauten, wie dicke Marmorplatten oder Trockenbau-Doppelbeplankungen.\"},{\"q\":\"Verfügt der Griff über eine Farbmarkierung?\",\"a\":\"Ja, zur einfachen Unterscheidung von Heiß- und Kaltwassersträngen liegen unseren Garnituren austauschbare Farbmarkierungen (Rot/Blau) bei.\"},{\"q\":\"Wie wird der Ventilsitz abgedichtet?\",\"a\":\"Wir verwenden hochhitzebeständige EPDM-Profildichtungen im Innenoberteil, die extrem resistent gegen chemische Reiniger und thermische Desinfektion sind.\"}]},\"straight-seat-valve-upper-part-green-handle\":{\"seo_p1\":\"Das Schrägsitzventil-Oberteil mit grünem Griff (Straight Seat Valve Upper Part Green Handle) ist die bewährte Mechanik für eine präzise Durchflussregulierung.\",\"seo_p2\":\"Ausgestattet mit einer hochwertigen Messingspindel, einer langlebigen EPDM-Dichtung und dem markanten grünen Handrad, ist es für hohe Systemdrücke und Temperaturen konzipiert.\",\"seo_p3\":\"Eingeschraubt in die entsprechenden PP-R-Ventilunterteile dient es der sicheren Strangabsperrung in Heizungskellern und Hauptverteilungen der Gebäudetechnik.\",\"faq\":[{\"q\":\"Handelt es sich bei diesem Bauteil um ein Ersatzteil?\",\"a\":\"Ja, es ist das komplette mechanische Innenleben (Oberteil) des Unterputzventils, ideal für Wartungszwecke oder den modularen Aufbau.\"},{\"q\":\"Muss bei einem Tropfen das ganze Ventil getauscht werden?\",\"a\":\"Nein, es genügt, das Wasser abzustellen und dieses Messing-Oberteil auszutauschen – der PP-R Grundkörper bleibt in der Wand.\"},{\"q\":\"Wie oft muss das Oberteil gefettet werden?\",\"a\":\"Das Spindelgewinde ist werkseitig mit einer lebensmittelechten Dauerschmierung versehen, eine nachträgliche Wartung ist nicht erforderlich.\"}]},\"elongation-pieces\":{\"seo_p1\":\"Die Verlängerungsstücke (Elongation Pieces) sind unverzichtbare Problemlöser, wenn Armaturenanschlüsse zu tief im Mauerwerk verborgen sind.\",\"seo_p2\":\"Diese massiven Messingkomponenten verlängern das Gewinde von Unterputzventilen millimetergenau nach außen, ohne den Fließquerschnitt zu verringern oder die Druckfestigkeit zu beeinträchtigen.\",\"seo_p3\":\"Sie retten Installationen bei nachträglich erhöhten Wandaufbauten oder dicken Fliesenbelägen und stellen die problemlose Montage der sichtbaren Bedienelemente sicher.\",\"faq\":[{\"q\":\"Wann benötige ich eine Ventil-Verlängerung?\",\"a\":\"Wenn der Putz oder die Fliesen dicker ausfallen als geplant und die Spindel des Unterputzventils nicht mehr weit genug aus der Wand ragt.\"},{\"q\":\"Können mehrere Verlängerungen kombiniert werden?\",\"a\":\"Technisch ist das möglich, aus Stabilitätsgründen empfehlen wir jedoch, stattdessen sofort ein langes Oberteil ('Long') zu verwenden.\"},{\"q\":\"Ist das Verlängerungsgewinde genormt?\",\"a\":\"Ja, die Gewinde unserer Verlängerungen passen exakt auf die Standard-Oberteile der K Aqua Unterputzventile.\"}]},\"battery-female-thread\":{\"seo_p1\":\"Die Verteilerbatterie mit Innengewinde (Battery Female Thread) bündelt mehrere Abgänge in einem kompakten, vormontierten PP-R-Bauteil.\",\"seo_p2\":\"Hergestellt aus einem durchgehenden Polypropylen-Körper mit integrierten Messing-Innengewinden, bietet sie absolute Formstabilität bei perfektem Stichmaß für Armaturen.\",\"seo_p3\":\"Diese Batterie beschleunigt die Installation von Waschtisch- oder Duscharmaturen drastisch, da aufwendiges Einmessen und Ausrichten einzelner Wandscheiben entfällt.\",\"faq\":[{\"q\":\"Welches Stichmaß weist die Armaturenbatterie auf?\",\"a\":\"Sie ist auf das internationale Standard-Stichmaß von 150 mm fixiert, passend für 99% aller handelsüblichen Aufputz-Mischarmaturen.\"},{\"q\":\"Kann die Batterie gebogen werden?\",\"a\":\"Nein, die integrierte Kunststoffbrücke sorgt für starre, exakte Abstände. Für abweichende Maße empfehlen wir Einzelwandscheiben.\"},{\"q\":\"Wie wird die Batterie befestigt?\",\"a\":\"Sie verfügt über mehrere vorgebohrte Montageösen, um sie mit Schrauben sicher an Ziegel-, Beton- oder Trockenbauwänden zu fixieren.\"}]},\"adjustable-battery-female-thread\":{\"seo_p1\":\"Die einstellbare Verteilerbatterie (Adjustable Battery Female Thread) bietet maximale Flexibilität bei der Installation von Wandarmaturen mit abweichenden Stichmaßen.\",\"seo_p2\":\"Dank eines verschiebbaren PP-R-Schienensystems lassen sich die Positionen der integrierten Innengewinde präzise justieren und anschließend fest arretieren.\",\"seo_p3\":\"Sie ist die ideale Lösung für Sanierungsprojekte oder spezielle Spezialarmaturen, bei denen das Standard-Stichmaß von 150 mm nicht angewendet werden kann.\",\"faq\":[{\"q\":\"Wie flexibel ist die Abstandsverstellung?\",\"a\":\"Durch die gleitende Schiene lassen sich die Wandscheiben stufenlos auf das exakt benötigte Stichmaß der Mischarmatur einstellen.\"},{\"q\":\"Besteht bei der verstellbaren Version die Gefahr von Verschiebungen?\",\"a\":\"Nachdem das korrekte Maß eingestellt wurde, werden die Wandscheiben fest arretiert. Ein Verrutschen während des Fliesenlegens ist somit ausgeschlossen.\"},{\"q\":\"Ist eine Wasserwaage zur Ausrichtung nötig?\",\"a\":\"Ja, wie bei allen Armaturenanschlüssen sollte die Montageplatte vor dem endgültigen Fixieren sorgfältig mit einer Wasserwaage horizontiert werden.\"}]},\"weld-in-saddle\":{\"seo_p1\":\"Der Einschweißsattel (Weld-in Saddle) ist eine revolutionäre Lösung, um nachträgliche Abzweige ohne das Durchtrennen der Hauptleitung zu realisieren.\",\"seo_p2\":\"Das sattelförmige PP-R-Formteil wird nach dem Anbohren des Hauptrohres direkt auf die Rohrwandung aufgeschweißt. Dies garantiert dieselbe Druckfestigkeit wie das Originalrohr.\",\"seo_p3\":\"In industriellen Netzwerken und Steigleitungen spart dieses Bauteil enorme Montagezeiten, da Hauptstränge für Erweiterungen nicht komplett demontiert werden müssen.\",\"faq\":[{\"q\":\"Was ist der Unterschied zum Sattel mit Metallgewinde?\",\"a\":\"Dieser Einschweißsattel verfügt über einen reinen PP-R Abzweig, in den direkt ein Rohr oder ein weiterer Fitting (Muffe) eingeschweißt werden kann.\"},{\"q\":\"Muss die Rohrwand des Hauptrohres eine Mindeststärke haben?\",\"a\":\"Nein, der Sattel kann bei fachgerechter Anbohrung auf alle K Aqua Druckstufen (SDR 6 bis SDR 17) sicher aufgeschweißt werden.\"},{\"q\":\"Wie lange dauert der Anbohr- und Schweißvorgang?\",\"a\":\"Ein erfahrener Installateur benötigt für das Anbohren, das Erwärmen mit dem speziellen Sattelwerkzeug und das Fügen maximal 3-5 Minuten.\"}]},\"weld-in-saddle-female-thread\":{\"seo_p1\":\"Der Einschweißsattel mit Innengewinde (Weld-in Saddle Female Thread) kombiniert die Vorteile der schnellen Sattelmontage mit einem direkten Metallanschluss.\",\"seo_p2\":\"Zusätzlich zum PP-R-Sattelkörper verfügt dieses Fitting über ein fest verankertes Messing-Innengewinde, das eine extrem verdrehsichere Basis für Ventile bietet.\",\"seo_p3\":\"Ideal für die nachträgliche Installation von Entleerungsventilen, Entlüftern oder Messfühlern direkt in bestehende Hauptleitungen ohne aufwendige Rohrnetztrennung.\",\"faq\":[{\"q\":\"Worin besteht der Hauptvorteil dieses Einschweißsattels?\",\"a\":\"Er ermöglicht die direkte Installation eines Metall-Innengewindes an einer bestehenden Rohrleitung, was extrem zeit- und platzsparend ist.\"},{\"q\":\"Können hier Thermometer eingeschraubt werden?\",\"a\":\"Ja, der Sattel ist die ideale Schnittstelle, um Temperatursensoren oder kleine Manometer dauerhaft und druckdicht in Heizungsnetze zu integrieren.\"},{\"q\":\"Ist das Messinggewinde vor Ausreißen geschützt?\",\"a\":\"Absolut. Der Messingeinsatz ist tief in die PP-R-Struktur eingespritzt und durch eine spezielle Rändelung mechanisch unlösbar verankert.\"}]},\"weld-in-saddle-male-thread\":{\"seo_p1\":\"Der Einschweißsattel mit Außengewinde (Weld-in Saddle Male Thread) erlaubt den sofortigen Anschluss von Systemkomponenten mit Überwurfmuttern an ein Basisrohr.\",\"seo_p2\":\"Der nahtlos eingeschweißte PP-R-Sattel trägt ein massives Außengewinde aus Messing, das höchsten Hebelkräften und dauerhaften Temperaturwechseln standhält.\",\"seo_p3\":\"Diese Komponente wird häufig im Verteilerbau eingesetzt, um Absperrventile oder Pumpenabgänge extrem platzsparend und strömungsgünstig zu montieren.\",\"faq\":[{\"q\":\"Für welche Verbindungen eignet sich das Außengewinde am Sattel?\",\"a\":\"Es ist optimal für den direkten Anschluss von Armaturen mit Innengewinde oder für Verbindungen, die mit einer Überwurfmutter gesichert werden.\"},{\"q\":\"Gibt es diesen Sattel für alle Rohrdimensionen?\",\"a\":\"Der Einschweißsattel ist für Hauptrohre von 40 mm bis 125 mm verfügbar, wobei das Außengewinde typischerweise 1/2\\\" oder 3/4\\\" beträgt.\"},{\"q\":\"Wie wird die Dichtigkeit nach der Anbohrung sichergestellt?\",\"a\":\"Durch das Verschmelzen von Sattel und Rohr entsteht eine stoffschlüssige, homogene Verbindung, die auf molekularer Ebene 100% dicht ist.\"}]},\"pipe-clamps\":{\"seo_p1\":\"Die Rohrschellen (Pipe Clamps) bilden das mechanische Fundament für eine normgerechte und langlebige Befestigung der PP-R-Rohrleitungssysteme.\",\"seo_p2\":\"Ausgestattet mit schallentkoppelnden Gummieinlagen und stabilen Stahlscharnieren, nehmen diese Schellen die thermische Längenausdehnung des Rohres sicher auf.\",\"seo_p3\":\"Sie sind zwingend erforderlich, um Rohrstränge an Wänden oder Decken zu fixieren und dabei Rohrgeräusche effektiv von der Gebäudestruktur zu isolieren.\",\"faq\":[{\"q\":\"Wozu dient die Gummieinlage in der Schelle?\",\"a\":\"Die EPDM-Einlage dient der Schallentkopplung gemäß DIN 4109 und verhindert die Übertragung von Fließgeräuschen auf das Mauerwerk.\"},{\"q\":\"Sollte die Schelle als Festpunkt oder Losspunkt montiert werden?\",\"a\":\"Je nach Anzugsmoment der Schrauben kann die Schelle sowohl als fixierender Festpunkt als auch als gleitender Losspunkt für die thermische Längenausdehnung genutzt werden.\"},{\"q\":\"Welchen Gewindeanschluss haben die Rohrschellen?\",\"a\":\"Unsere Standard-Rohrschellen verfügen über eine aufgeschweißte Kombimutter (M8/M10), die eine flexible Befestigung an gängigen Stockschrauben oder Gewindestangen ermöglicht.\"}]},\"backing-flange-pp-steel-sfbf\":{\"seo_p1\":\"Der PP-Stahl-Losflansch (Backing Flange PP/Steel SFBF) sorgt für eine hochbelastbare und formstabile Flanschverbindung bei großen Rohrdurchmessern.\",\"seo_p2\":\"Ein stählerner Kern, der vollständig mit robustem Polypropylen (PP) ummantelt ist, verhindert Korrosion komplett und verhindert ein Verbiegen unter hohem Anpressdruck.\",\"seo_p3\":\"Dieses Zubehörteil ist entscheidend für den Übergang auf Großpumpen oder Stahlbehälter in industriellen Anlagen, wo extreme Zugkräfte sicher abgeleitet werden müssen.\",\"faq\":[{\"q\":\"Warum wird der Stahlkern mit Polypropylen ummantelt?\",\"a\":\"Die Kunststoffummantelung schützt den hochfesten Stahl dauerhaft vor Korrosion, was besonders in feuchten Kellern oder aggressiven Industrieumgebungen entscheidend ist.\"},{\"q\":\"Entspricht das Lochbild den gängigen Normen?\",\"a\":\"Ja, das Bohrbild unserer Losflansche ist exakt auf die europäische DIN EN 1092-1 Norm abgestimmt und passt auf alle handelsüblichen Gegenflansche.\"},{\"q\":\"Müssen die Schrauben mit einem Drehmomentschlüssel angezogen werden?\",\"a\":\"Wir empfehlen dringend das kreuzweise Anziehen mit einem kalibrierten Drehmomentschlüssel, um eine gleichmäßige Verpressung der Dichtung zu gewährleisten.\"}]},\"flat-gasket\":{\"seo_p1\":\"Die Flachdichtung (Flat Gasket) ist das essentielle Dichtelement für alle Flanschverbindungen innerhalb unseres PP-R Systems.\",\"seo_p2\":\"Aus hochwertigem EPDM oder anderen Elastomeren gestanzt, ist die Dichtung speziell auf die glatten Stirnflächen der Bundkragen abgestimmt und hält hohem Netzdruck stand.\",\"seo_p3\":\"Sie gleicht mikroskopische Unebenheiten aus und sorgt bei Flanschübergängen in der Industrie oder Heizungstechnik für eine 100-prozentig leckagefreie und langlebige Verbindung.\",\"faq\":[{\"q\":\"Aus welchem Material besteht die Flachdichtung?\",\"a\":\"Standardmäßig bestehen unsere Flanschdichtungen aus hochdruckfestem EPDM, das für Trinkwasser und Heizungswasser hervorragend geeignet ist.\"},{\"q\":\"Darf die Dichtung wiederverwendet werden?\",\"a\":\"Nein, nach dem Lösen einer Flanschverbindung muss aus Sicherheitsgründen zwingend eine neue Flachdichtung eingesetzt werden.\"},{\"q\":\"Ist die Dichtung beständig gegen Chemikalien?\",\"a\":\"EPDM bietet eine gute Beständigkeit gegen viele wässrige Lösungen. Für spezielle industrielle Chemikalien prüfen Sie bitte vorab unsere Beständigkeitslisten.\"}]},\"flat-gasket-for-unions-pp-r\":{\"seo_p1\":\"Die Flachdichtung für Verschraubungen (Flat Gasket for Unions PP-R) ist präzise für unsere Kunststoff- und Metallverschraubungen dimensioniert.\",\"seo_p2\":\"Das trinkwasserzugelassene Elastomermaterial bietet eine hohe Rückstellkraft und ist resistent gegenüber dauerhaften thermischen Belastungen in Warmwassernetzen.\",\"seo_p3\":\"Ein regelmäßiger Austausch dieser Dichtung nach Wartungsarbeiten an Ventilen oder Pumpen garantiert die dauerhafte Dichtigkeit der Schraubverbindung.\",\"faq\":[{\"q\":\"Wie stark darf die Verschraubung angezogen werden?\",\"a\":\"Um die Dichtung nicht zu zerstören, sollte die Überwurfmutter handfest und anschließend mit Werkzeug nur leicht (ca. 1/4 Drehung) nachgezogen werden.\"},{\"q\":\"Gibt es diese Dichtungen auch in anderen Materialien?\",\"a\":\"Für extreme Temperaturanforderungen oder spezielle industrielle Medien können wir auf Anfrage auch Dichtungen aus FKM (Viton) oder PTFE anbieten.\"},{\"q\":\"Passt diese Dichtung auf Fremdfabrikate?\",\"a\":\"Sie ist maßgeschneidert für die Nut- und Federkonstruktion der K Aqua Verschraubungen, kann aber auch bei maßgleichen Fremdverschraubungen verwendet werden.\"}]},\"plug\":{\"seo_p1\":\"Der Verschlussstopfen (Plug) dient dem temporären oder dauerhaften Verschließen von offenen Gewindeanschlüssen in der Sanitärinstallation.\",\"seo_p2\":\"Aus stabilem PP-R gespritzt und oft mit einem integrierten Dichtring versehen, widersteht der Stopfen dem vollen Prüfdruck bei der Anlagenabnahme.\",\"seo_p3\":\"Er schützt das Leitungssystem während der Bauphase vor Verschmutzungen und verschließt Wandscheiben zuverlässig bis zur endgültigen Montage der Auslaufarmaturen.\",\"faq\":[{\"q\":\"Hält der Stopfen dem Wasserdruck während der Bauphase stand?\",\"a\":\"Ja, er ist so konstruiert, dass er dem vollen Prüfdruck (oftmals mehr als 15 bar) bei der Druckprobe des Leitungsnetzes standhält.\"},{\"q\":\"Muss der Stopfen zusätzlich mit Teflon abgedichtet werden?\",\"a\":\"Unsere Stopfen verfügen meist über einen integrierten O-Ring, sodass kein zusätzliches Dichtband wie Teflon oder Hanf benötigt wird.\"},{\"q\":\"Kann der Stopfen dauerhaft in der Wand verbleiben?\",\"a\":\"Er ist primär als Baustopfen konzipiert. Für dauerhafte Blindverschlüsse empfehlen wir entsprechende Messing-Blindstopfen.\"}]},\"pipe-cutter-2040\":{\"seo_p1\":\"Der Rohrschneider d20-d40 (Pipe Cutter 20-40) ist das unerlässliche Präzisionswerkzeug für saubere Kappschnitte bei kleinen bis mittleren Rohrdimensionen.\",\"seo_p2\":\"Ausgestattet mit einer titanbeschichteten Klinge und einer mechanischen Hebelübersetzung, garantiert die Schere einen absolut rechtwinkligen Schnitt durch PP-R Rohre ohne Materialverformung.\",\"seo_p3\":\"Ein sauberer, gratfreier Schnitt ist die Grundvoraussetzung für eine normgerechte und langlebige Schweißverbindung. Dieses Werkzeug ist der ständige Begleiter jedes Installateurs.\",\"faq\":[{\"q\":\"Warum ist ein spezieller Rohrschneider so wichtig?\",\"a\":\"Ein rechtwinkliger und gratfreier Schnitt ohne Quetschungen ist absolut zwingend, um eine perfekte, hohlraumfreie Schweißverbindung zu gewährleisten.\"},{\"q\":\"Kann die Klinge ausgetauscht werden?\",\"a\":\"Ja, bei Verschleiß oder Beschädigung lässt sich die hochfeste Stahlklinge problemlos durch ein Original-Ersatzteil austauschen.\"},{\"q\":\"Funktioniert die Schere auch bei kalten Temperaturen?\",\"a\":\"Die Kraftübersetzung funktioniert immer, jedoch sollte das PP-R Rohr bei Frosttemperaturen nicht geschnitten werden, da es splittern könnte.\"}]},\"pipe-cutter-50125\":{\"seo_p1\":\"Der große Rohrschneider d50-d125 (Pipe Cutter 50-125) ist ein robustes Rollenschneidwerkzeug für großvolumige Kunststoffrohre.\",\"seo_p2\":\"Sein massiver Stahlkörper und das speziell gehärtete Schneidrad durchdringen mühelos dicke Rohrwandungen der großen SDR-Klassen mit absoluter Planparallelität.\",\"seo_p3\":\"Ideal für die Vorbereitung von Hauptverteilungsleitungen im Industriebau, verhindert dieser Schneider spannungsinduzierte Risse, die bei einfachen Sägeschnitten auftreten könnten.\",\"faq\":[{\"q\":\"Wie funktioniert das Schneiden von derart dicken Rohren?\",\"a\":\"Das Werkzeug wird um das Rohr gespannt, das Schneidrad wird langsam zugestellt und der Schneider wird in gleichmäßigen Drehbewegungen um das Rohr geführt.\"},{\"q\":\"Schneidet dieses Werkzeug auch Faserverbundrohre?\",\"a\":\"Ja, das speziell gehärtete Schneidrad durchtrennt auch unsere glasfaserverstärkten PPRCT Rohre mühelos und extrem präzise.\"},{\"q\":\"Ersetzt der Rollenschneider das Anfasen?\",\"a\":\"Das Muffenschweißen erfordert kein Anfasen. Der absolut gerade Schnitt dieses Werkzeugs ist die perfekte Vorbereitung für den Schweißprozess.\"}]},\"pipe-cutter-50125-1\":{\"seo_p1\":\"Der Hochleistungs-Rohrschneider d50-d125 V1 (Pipe Cutter 50-125-1) ist eine modifizierte Version für besonders schnelle und ergonomische Schnitte.\",\"seo_p2\":\"Mit einer optimierten Spindelführung und einem integrierten Schnellrücklauf-Mechanismus beschleunigt er den Schneidprozess massiver PP-R Rohre enorm.\",\"seo_p3\":\"Für Bauprojekte mit hohem Rohrverbrauch ab 50 mm Durchmesser konzipiert, reduziert dieses Werkzeug die physische Belastung des Anwenders auf ein Minimum.\",\"faq\":[{\"q\":\"Was bedeutet 'Schnellrücklauf-Mechanismus'?\",\"a\":\"Nach Beendigung des Schnitts kann das Schneidrad per Knopfdruck sofort in die Ausgangsposition gefahren werden, ohne lästiges Zurückkurbeln.\"},{\"q\":\"Eignet sich dieses Modell besser für den stationären Einsatz?\",\"a\":\"Es ist mobil, lässt sich aber dank seiner massiven Bauform und der präzisen Spindelführung hervorragend für stationäre Vorfertigungen nutzen.\"},{\"q\":\"Gibt es Ersatzteile für diesen Rohrschneider?\",\"a\":\"Ja, sowohl das Schneidrad als auch die Führungsrollen sind als Original-Ersatzteile dauerhaft lieferbar.\"}]},\"hand-welding-machine-2032-complete-set\":{\"seo_p1\":\"Das Handschweißgerät d20-d32 im Komplettset (Hand Welding Machine 20-32 Complete Set) ist die professionelle Basisstation für kleine Dimensionen.\",\"seo_p2\":\"Es beinhaltet ein thermostatgesteuertes 800-Watt-Heizelement, teflonbeschichtete Schweißwerkzeuge sowie einen stabilen Ständer in einem robusten Metallkoffer.\",\"seo_p3\":\"Konzipiert für die schnelle und normgerechte Vorwand- und Etageninstallation, hält das Gerät die erforderliche Schweißtemperatur von 260°C jederzeit absolut konstant.\",\"faq\":[{\"q\":\"Warum ist ein elektronisches Thermostat so wichtig?\",\"a\":\"Nur ein präzises Thermostat garantiert die DVS-konforme Dauertemperatur von exakt 260°C, die für eine sichere PP-R Verschmelzung zwingend nötig ist.\"},{\"q\":\"Wie lange dauert die Aufheizphase?\",\"a\":\"Dank des starken 800-Watt-Heizelements erreicht das Gerät die Betriebstemperatur in der Regel in unter 10 Minuten.\"},{\"q\":\"Welche Werkzeuge sind im Koffer enthalten?\",\"a\":\"Das Set umfasst das Heizgerät, den Standfuß, Teflondorne für 20, 25 und 32 mm, Inbusschlüssel und Montageschrauben im Stahlkoffer.\"}]},\"hand-welding-machine-2063-complete-set\":{\"seo_p1\":\"Das Handschweißgerät d20-d63 im Komplettset (Hand Welding Machine 20-63 Complete Set) deckt die gesamte Bandbreite der klassischen Haustechnik ab.\",\"seo_p2\":\"Mit einer höheren Heizleistung und doppelten Steckplätzen für Heizdorne ermöglicht dieses Gerät das simultane Vorbereiten verschiedener Dimensionen ohne Werkzeugwechsel.\",\"seo_p3\":\"Das robuste Komplettset ist für den rauen Baustellenalltag konzipiert und liefert auch bei widrigen Witterungsbedingungen eine kompromisslos präzise Schweißtemperatur.\",\"faq\":[{\"q\":\"Können mehrere Schweißwerkzeuge gleichzeitig montiert werden?\",\"a\":\"Ja, der breite Heizschwert-Kopf erlaubt die simultane Montage von bis zu drei Heizdorn-Paaren für ein unterbrechungsfreies Arbeiten.\"},{\"q\":\"Gibt das Gerät ein Signal bei Erreichen der Temperatur?\",\"a\":\"Eine gut sichtbare Kontrollleuchte signalisiert dem Anwender, sobald die Betriebstemperatur von 260°C erreicht und stabilisiert ist.\"},{\"q\":\"Ist das Gerät für den Dauerbetrieb auf Großbaustellen geeignet?\",\"a\":\"Absolut. Das langlebige Heizelement und die hitzebeständige Verkabelung sind speziell für den industriellen Schichtbetrieb ausgelegt.\"}]},\"hand-welding-machine-mirror-50125\":{\"seo_p1\":\"Das Handschweißgerät mit Spiegel d50-d125 (Hand Welding Machine Mirror 50-125) ist speziell für große Muffenschweißungen entwickelt worden.\",\"seo_p2\":\"Ein extrem flacher, großflächiger Heizspiegel garantiert die gleichmäßige Erwärmung massiver Fittings und Rohre. Die Leistung von über 1200 Watt sichert schnelle Aufheizphasen.\",\"seo_p3\":\"Zwingend erforderlich für die manuelle Verarbeitung großer Versorgungsstränge in der Industrie, bei denen Temperaturabfälle während des Schweißvorgangs katastrophal wären.\",\"faq\":[{\"q\":\"Warum benötigt man für große Rohre einen Flachspiegel?\",\"a\":\"Große Durchmesser (ab 50 mm) haben eine enorme Masse. Der flache Spiegel bietet eine extrem große Kontaktfläche, um die Hitze schnell und gleichmäßig in den Kunststoff einzubringen.\"},{\"q\":\"Wie schwer ist das Gerät?\",\"a\":\"Trotz der hohen Leistung ist das Gerät ergonomisch ausbalanciert, erfordert bei Rohren ab 90 mm jedoch meist zwei Installateure zum exakten Fügen.\"},{\"q\":\"Müssen die teflonbeschichteten Flächen gereinigt werden?\",\"a\":\"Ja, sie sollten nach jedem Einsatz im noch warmen Zustand mit einem fusselfreien Papiertuch oder einem speziellen Holzspatel vorsichtig gereinigt werden.\"}]},\"welding-tool\":{\"seo_p1\":\"Die Schweißwerkzeuge (Welding Tool) sind die teflonbeschichteten Heizdorne und Heizbuchsen, die das eigentliche Schmelzen des PP-R Materials übernehmen.\",\"seo_p2\":\"Gefertigt aus hochwärmeleitfähigen Legierungen und mit einer speziellen Antihaft-PTFE-Schicht versehen, garantieren sie eine perfekte, rückstandsfreie molekulare Schmelze.\",\"seo_p3\":\"Nur mit unbeschädigten und hochwertigen Schweißwerkzeugen lässt sich die vom DVS geforderte Homogenität der Verbindung für eine 50-jährige Lebensdauer erzielen.\",\"faq\":[{\"q\":\"Wann muss ein Schweißwerkzeug ausgetauscht werden?\",\"a\":\"Sobald die Teflonbeschichtung zerkratzt ist oder sich PP-R-Reste festbrennen, muss das Werkzeug zwingend getauscht werden, um fehlerhafte Schweißnähte zu vermeiden.\"},{\"q\":\"Warum darf ich Kunststoffreste nicht mit dem Messer abkratzen?\",\"a\":\"Ein Messer zerstört sofort die mikrofeine PTFE-Antihaftbeschichtung. Nutzen Sie ausschließlich weiche Tücher auf dem noch heißen Werkzeug.\"},{\"q\":\"Passt das K Aqua Schweißwerkzeug auch auf Fremdgeräte?\",\"a\":\"Die Befestigungsbohrung entspricht dem Industriestandard, sodass unsere Werkzeuge auf fast alle professionellen Muffenschweißgeräte passen.\"}]},\"welding-machine-50125-complete-set\":{\"seo_p1\":\"Die Tisch-Schweißmaschine d50-d125 (Welding Machine 50-125 Complete Set) bietet stationäre Präzision für die Vorfertigung großer Rohrbaugruppen.\",\"seo_p2\":\"Sie verfügt über Spannbacken, eine Hebelmechanik zum kraftsparenden Fügen und ein digital geregeltes Heizelement für absolut exakte Fügedrücke und -zeiten.\",\"seo_p3\":\"In der Werkstattfertigung von Verteilern oder komplexen industriellen Baugruppen eliminiert diese Maschine menschliche Fehler und maximiert die Verarbeitungsgeschwindigkeit.\",\"faq\":[{\"q\":\"Welchen Vorteil bietet die stationäre Maschine gegenüber dem Handgerät?\",\"a\":\"Die Hebelmechanik ermöglicht ein exakt lineares, verkantungsfreies Einschieben der großen Rohre, was per Hand extrem kraftaufwendig wäre.\"},{\"q\":\"Können damit auch kleine Rohre geschweißt werden?\",\"a\":\"Technisch ja, die Maschine ist jedoch speziell für die hohen Fügekräfte der Dimensionen 50 mm bis 125 mm konzipiert.\"},{\"q\":\"Wie wird das Rohr fixiert?\",\"a\":\"Universal-Spannbacken mit verschiedenen Einsätzen greifen das Rohr schonend aber absolut fest, um eine kraftvolle, axiale Bewegung zu garantieren.\"}]},\"butt-welding-machine-90250\":{\"seo_p1\":\"Die Stumpfschweißmaschine d90-d250 (Butt Welding Machine 90-250) ist das High End-System für flanschlose Rohr-an-Rohr-Verbindungen im Großformat.\",\"seo_p2\":\"Eine hydraulische Presseinheit, ein CNC-gesteuerter Heizspiegel und ein präziser Rohrhobel sorgen für eine vollautomatisierte, protokollierbare Schweißnaht auf höchstem Niveau.\",\"seo_p3\":\"Für kommunale Hauptwasserleitungen oder industrielle Kühlwassernetze ab 90 mm ist dieses Gerät unverzichtbar, um zertifizierte und abnahmefähige Stumpfschweißungen durchzuführen.\",\"faq\":[{\"q\":\"Was ist der Unterschied zwischen Muffen- und Stumpfschweißen?\",\"a\":\"Beim Stumpfschweißen werden die Rohrenden plan gefräst und direkt ohne zusätzlichen Fitting (Muffe) auf Stoß miteinander verschmolzen.\"},{\"q\":\"Werden die Schweißdaten für die Qualitätskontrolle gespeichert?\",\"a\":\"Ja, die integrierte CNC-Steuerung protokolliert Temperatur, Druck und Zeit für jede einzelne Schweißnaht zur späteren Auswertung.\"},{\"q\":\"Warum ist ein Hobel integriert?\",\"a\":\"Der Hobel fräst beide Rohrenden vor dem Schweißen absolut parallel und oxidationsfrei, was für eine dauerhafte molekulare Verbindung zwingend erforderlich ist.\"}]},\"electrofusion-machine\":{\"seo_p1\":\"Das Elektroschweißgerät (Electrofusion Machine) steuert den vollautomatischen Verschweißungsprozess von Heizwendelmuffen durch elektrische Widerstandserwärmung.\",\"seo_p2\":\"Der intelligente Mikroprozessor liest den Barcode des Fittings per Scanner ein und berechnet automatisch die exakte Spannung und Schweißzeit in Abhängigkeit der Umgebungstemperatur.\",\"seo_p3\":\"Essentiell für Reparaturen in extrem engen Schächten, nachträgliche Anbindungen oder Erdverlegungen, wo klassisches Muffenschweißen aus Platzgründen unmöglich ist.\",\"faq\":[{\"q\":\"Wie liest die Maschine die Schweißparameter?\",\"a\":\"Jede Heizwendelmuffe verfügt über einen Barcode, den der Anwender mit dem angeschlossenen Scanner einliest – die Maschine stellt sich vollautomatisch ein.\"},{\"q\":\"Gleicht die Maschine Temperaturschwankungen auf der Baustelle aus?\",\"a\":\"Ja, ein Umgebungssensor misst die Temperatur und passt die Schweißdauer automatisch an (im Winter länger, im Sommer kürzer).\"},{\"q\":\"Muss das Rohr vor der Elektroschweißung geschält werden?\",\"a\":\"Zwingend! Die Oxidschicht auf dem PP-R Rohr muss im Schweißbereich mit einem speziellen Schälgerät mechanisch entfernt werden.\"}]},\"welding-tool-for-weld-in-saddles\":{\"seo_p1\":\"Das Sattel-Schweißwerkzeug (Welding Tool for Weld-in Saddles) ist speziell für die Montage von Einschweißsätteln an bestehende PP-R Rohre konstruiert.\",\"seo_p2\":\"Es besteht aus einem konkav geformten Heizdorn für die Rohrwandung und einer konvexen Heizbuchse für den Sattel, beide hochwertig teflonbeschichtet.\",\"seo_p3\":\"Es erwärmt exakt die benötigte Fläche auf dem Basisrohr, um den Sattel homogen und unlösbar mit dem Leitungssystem zu verschmelzen.\",\"faq\":[{\"q\":\"Warum hat das Werkzeug eine konkave und eine konvexe Seite?\",\"a\":\"Die konkave (gewölbte) Seite erwärmt das runde Außenrohr, während die konvexe Seite exakt den sattelförmigen Abzweig auf Schmelztemperatur bringt.\"},{\"q\":\"Passt ein Werkzeug für alle Rohre?\",\"a\":\"Nein, Sie benötigen für jede Hauptrohr-Abzweig-Kombination (z.B. 63 mm auf 20 mm) ein exakt passendes Sattel-Schweißwerkzeug.\"},{\"q\":\"Wie wird das Werkzeug auf dem Schweißgerät montiert?\",\"a\":\"Es wird wie ein normaler Heizdorn mit einer Inbusschraube direkt auf das Heizschwert des K Aqua Handschweißgeräts geschraubt.\"}]},\"drilling-tool-for-weld-in-saddle\":{\"seo_p1\":\"Der Spezialbohrer für Einschweißsättel (Drilling Tool for Weld-in Saddle) ist das präzise Vorbereitungswerkzeug für Sattelabzweige.\",\"seo_p2\":\"Er bohrt nicht nur das exakt erforderliche Loch in das wasserführende Hauptrohr, sondern fräst gleichzeitig den Randbereich für die nachfolgende Schweißung sauber aus.\",\"seo_p3\":\"Ein extrem scharfes und sauberes Bohrloch ist kritisch, um beim späteren Einschweißen des Sattels keine Kunststoffspäne in das Rohrnetz gelangen zu lassen.\",\"faq\":[{\"q\":\"Warum kann ich keinen normalen Holz- oder Metallbohrer verwenden?\",\"a\":\"Standardbohrer reißen den Kunststoff ein und erzeugen unkontrollierte Späne. Unser Spezialbohrer fräst das Loch und fängt den Span sauber ab.\"},{\"q\":\"Passt der Bohrer in einen handelsüblichen Akkuschrauber?\",\"a\":\"Ja, der Bohrer verfügt über einen genormten Sechskantschaft, der in jedes handelsübliche Bohrfutter passt.\"},{\"q\":\"Muss das Loch entgratet werden?\",\"a\":\"Nein, der Fräskopf des Bohrers ist so konstruiert, dass er die Lochkante automatisch für die nachfolgende Schweißung vorbereitet und glättet.\"}]},\"welding-tool-for-repairing-plug\":{\"seo_p1\":\"Das Reparatur-Schweißwerkzeug (Welding Tool for Repairing Plug) ist ein hochspezialisierter Aufsatz für die Instandsetzung angebohrter Leitungen.\",\"seo_p2\":\"Dieser konische Heizstift erwärmt gezielt das Innere eines beschädigten Bohrlochs und gleichzeitig den entsprechenden PP-R-Reparaturstopfen auf Schmelztemperatur.\",\"seo_p3\":\"Er ist die Rettung auf jeder Baustelle, um versehentlich angebohrte Rohre (z.B. bei der Wandmontage) schnell und nachweislich dicht wieder zu verschließen.\",\"faq\":[{\"q\":\"Wie genau funktioniert der Reparaturstift?\",\"a\":\"Das konische Werkzeug schmilzt das Bohrloch auf. Danach wird der ebenfalls erwärmte PP-R Reparaturstopfen in das Loch gedrückt und verschmilzt dauerhaft.\"},{\"q\":\"Ist die reparierte Stelle wirklich sicher?\",\"a\":\"Ja, es handelt sich nicht um eine bloße Verklebung, sondern um eine molekulare Verschweißung, die denselben Druck aushält wie das unbeschädigte Rohr.\"},{\"q\":\"Welche Bohrdurchmesser können repariert werden?\",\"a\":\"Das Werkzeug ist ideal für typische Bohrunfälle (Dübellöcher) im Bereich von 7 mm bis 11 mm.\"}]},\"repairing-plug\":{\"seo_p1\":\"Der Reparaturstopfen (Repairing Plug) ist ein massiver PP-R-Stift, der in Kombination mit dem speziellen Schweißwerkzeug Bohrlochnotfälle behebt.\",\"seo_p2\":\"Er besteht aus dem identischen Material wie das K Aqua Rohrsystem und verschmilzt beim Einsetzen in das beschädigte Rohr zu einer absolut homogenen Masse.\",\"seo_p3\":\"Statt Wände großflächig aufzustemmen, um Rohrabschnitte zu ersetzen, wird das Loch einfach verschweißt – die reparierte Stelle ist danach genauso druckfest wie das Originalrohr.\",\"faq\":[{\"q\":\"Aus welchem Material besteht der Reparaturstopfen?\",\"a\":\"Er besteht zu 100% aus hochwertigem Polypropylen Random Copolymer (PP-R) Typ 3, genau wie unsere K Aqua Rohrsysteme.\"},{\"q\":\"Muss der Stopfen nach dem Einschweißen abgeschnitten werden?\",\"a\":\"Ja, nachdem die Schweißstelle vollständig abgekühlt ist, wird das überstehende Ende des Stopfens bündig mit der Rohrwandung abgeschnitten.\"},{\"q\":\"Kann ich den Stopfen bei gefülltem Rohrnetz verwenden?\",\"a\":\"Nein, das Wasser muss am betroffenen Strang vollständig abgestellt und das Rohr im Bereich des Bohrlochs trockengelegt sein.\"}]}}},\"newsx\":{\"moreEyebrow\":\"Aus Werk und Wissen\",\"moreTitle\":\"Mehr aus dem Hause K Aqua.\",\"moreLead\":\"Aktuelles von K Aqua. Hintergründe aus Fertigung und Materialkunde — zum Aufklappen.\",\"readMore\":\"Weiterlesen\",\"readLess\":\"Einklappen\",\"posts\":[{\"date\":\"Oktober 2025\",\"tag\":\"Unternehmen\",\"t\":\"Dreifach geprüft: ISO 9001, 14001 und 50001\",\"teaser\":\"Das ISO-Managementsystem der KWT GmbH umfasst jetzt Qualität, Umwelt und Energie — DAkkS-akkreditiert.\",\"body\":[\"Seit Oktober 2025 ist das Managementsystem der KWT GmbH dreifach geprüft: ISO 9001:2015 für Qualität, ISO 14001:2015 für Umwelt und ISO 50001:2018 für Energie. Die Zertifikate stammen von einer DAkkS-akkreditierten Zertifizierungsgesellschaft und gelten bis Oktober 2028.\",\"Für Einkauf und Compliance bedeutet das: dokumentierte, auditierbare Prozesse vom Extruder bis zum Versand. Das gelebte GENAU-Managementsystem erfüllte die Anforderungen der DIN EN ISO 14001 und 50001 bereits zuvor — die Prüfung macht es extern belastbar.\",\"Beide Zertifikatsversionen (DE/EN) stehen zum Download bereit; das vollständige Audit-Paket schnüren Sie im Trust Center.\"]},{\"date\":\"2018\",\"tag\":\"Produktion\",\"t\":\"Fortlaufend gekennzeichnet: Rückverfolgbarkeit ab Extruder\",\"teaser\":\"Jedes K Aqua-Rohr trägt eine kontinuierliche Kennzeichnung direkt aus dem Extrusionsprozess.\",\"body\":[\"Bei bis zu 14.000 Metern Rohr pro Tag und Anlage ist Rückverfolgbarkeit keine Kür: Jedes Rohr wird im laufenden Extrusionsprozess fortlaufend gekennzeichnet — mit den Angaben, die Planer und Prüfer auf der Baustelle brauchen.\",\"Die Kennzeichnung verbindet das physische Produkt mit seiner Charge und den Prüfprotokollen der Qualitätssicherung. Was auf dem Rohr steht, lässt sich bis ins Prüflabor zurückverfolgen — ein Baustein des QS-Handbuchs, das Auditoren im Trust Center anfordern können.\"]},{\"date\":\"Wissen\",\"tag\":\"Material\",\"t\":\"Warum eigentlich PP-R?\",\"teaser\":\"Vom Abfackelgas zum Trinkwasserrohr: die kurze Materialgeschichte des Polypropylens.\",\"body\":[\"Polypropylen entsteht aus Gasen, die früher nutzlos abgefackelt wurden — die stoffliche Nutzung reduziert Luftverschmutzung an der Quelle. Als technischer Kunststoff ist PP ungewöhnlich beständig gegen Lösungsmittel, Laugen und Säuren und formt im Spritzguss komplexe Geometrien.\",\"Im Rohr zählt vor allem die Innenfläche: Mit 0,007 mm Rauheit bleibt der Druckverlust minimal, Biofilm und Inkrustation finden kaum Halt. Dazu kommt die Wärmeleitfähigkeit von 0,24 W/(m·K) — Warmwasser bleibt warm, ohne dass die Leitung gedämmt gegen sich selbst arbeitet.\",\"PPRCT verschiebt die Grenzen noch einmal: Die modifizierte Kristallstruktur bringt mehr Temperatur- und Druckreserve — SDR 7,4 hält 70 °C bei 10 bar im Dauerbetrieb.\"]},{\"date\":\"Wissen\",\"tag\":\"Material\",\"t\":\"Messing trifft Polypropylen: Übergänge in den Bestand\",\"teaser\":\"Sanierung heißt fast immer Systemwechsel — Übergangsstücke mit Messing-Gewinde machen ihn sauber.\",\"body\":[\"Kaum ein Projekt startet auf der grünen Wiese: Bestandsleitungen aus Kupfer oder verzinktem Stahl müssen angebunden werden. Dafür gibt es Übergangsstücke mit eingebettetem Messing-Innen- oder Außengewinde — die Gewindeseite verbindet den Metallbestand, die PP-Seite wird stoffschlüssig verschweißt.\",\"So lässt sich abschnittsweise sanieren: Korrodierte Stränge werden ersetzt, funktionierende bleiben — und das Korrosionsproblem wandert nicht ins neue System. Verschraubungen machen die Verbindung bei Bedarf wieder lösbar, etwa an Armaturen und Wasserzählern.\"]}],\"ishTitle\":\"Treffpunkt Branche\",\"ishText\":\"Die TGA-Branche trifft sich auf der ISH in Frankfurt — der Weltleitmesse, auf der Partner KESSEL regelmäßig Präsenz zeigt. Sobald K Aqua-Termine feststehen, erscheinen sie hier.\"},\"academyx\":{\"paramEyebrow\":\"Schweißparameter\",\"paramTitle\":\"Muffenschweißen: die Richtwerte.\",\"paramLead\":\"Anwärm-, Umstell- und Abkühlzeiten für das Muffenschweißen nach DVS 2207-11 (Heizelement 250–270 °C) — die Grundlage, die in den Videos praktisch gezeigt wird.\",\"paramHead\":[\"d (mm)\",\"Schweißtiefe (mm)\",\"Anwärmen (s)\",\"Umstellen max. (s)\",\"Abkühlen (min)\"],\"paramNote\":\"Richtwerte nach DVS 2207-11 für PP bei 250–270 °C Heizelementtemperatur. Verbindlich sind die Angaben des Schweißgeräte-Herstellers und die Verarbeitungsanleitung — im Zweifel gilt: Video ansehen, Parameter am Gerät prüfen.\",\"stepEyebrow\":\"Verfahren Schritt für Schritt\",\"stepTitle\":\"Vier Verfahren, ein Qualitätsanspruch.\",\"stepLead\":\"Jedes Verfahren hat seinen Dimensionsbereich — und fünf Schritte, die über die Qualität der Verbindung entscheiden.\",\"procTabs\":[\"Muffe (Hand)\",\"Muffe (Maschine)\",\"Elektroschweißen\",\"Stumpfschweißen\"],\"procs\":[{\"t\":\"Muffenschweißen von Hand — bis d63\",\"steps\":[{\"t\":\"Schneiden \u0026 entgraten\",\"d\":\"Rohr rechtwinklig ablängen, sauber entgraten und anfasen — Rohrschneider aus dem K Aqua-Werkzeugprogramm verwenden.\"},{\"t\":\"Schweißtiefe anzeichnen\",\"d\":\"Einstecktiefe nach Tabelle (z. B. 14 mm bei d20) am Rohr markieren — sie definiert die Fügezone.\"},{\"t\":\"Gleichzeitig anwärmen\",\"d\":\"Rohr in die Heizbuchse, Fitting auf den Heizdorn — gleichzeitig aufschieben und die Anwärmzeit exakt halten.\"},{\"t\":\"Zügig fügen — ohne Drehen\",\"d\":\"Innerhalb der Umstellzeit axial fügen. Niemals verdrehen: Drehen zerstört das plastifizierte Gefüge.\"},{\"t\":\"Fixieren \u0026 abkühlen\",\"d\":\"Verbindung einige Sekunden fixieren, dann die Abkühlzeit abwarten, bevor mechanische Last aufgebracht wird.\"}]},{\"t\":\"Muffenschweißen mit Maschine — mittlere Dimensionen\",\"steps\":[{\"t\":\"Vorbereiten wie beim Handschweißen\",\"d\":\"Ablängen, entgraten, Schweißtiefe markieren — die Grundregeln bleiben identisch.\"},{\"t\":\"Rohr \u0026 Fitting einspannen\",\"d\":\"Die Maschine hält beide Fügepartner koaxial — Versatz und Kippfehler sind mechanisch ausgeschlossen.\"},{\"t\":\"Anwärmen mit Heizelement\",\"d\":\"Heizbuchse und -dorn nach DVS-Richtwerten; die Maschine hält Position und Zeit reproduzierbar.\"},{\"t\":\"Maschinell fügen\",\"d\":\"Der Vorschub fügt axial und gleichmäßig — besonders bei d75 bis d125 der Schlüssel zu konstanter Qualität.\"},{\"t\":\"Abkühlen unter Fixierung\",\"d\":\"Erst nach Ablauf der Abkühlzeit ausspannen und weiterverarbeiten.\"}]},{\"t\":\"Elektroschweißen (Electrofusion) — Heizwendelfittings\",\"steps\":[{\"t\":\"Oberfläche schälen\",\"d\":\"Die Rohroberfläche in der Fügezone schälen und reinigen — Oxidhaut und Verschmutzung verhindern die Verschweißung.\"},{\"t\":\"Einstecktiefe markieren\",\"d\":\"Tiefe am Rohr anzeichnen, Rohr bis zum Anschlag in das Fitting schieben.\"},{\"t\":\"Spannungsfrei fixieren\",\"d\":\"Halteklemmen verwenden — das Fitting darf während des Schweißens nicht unter Biegespannung stehen.\"},{\"t\":\"Schweißprozess starten\",\"d\":\"Das Gerät bestromt die eingebetteten Heizwendeln im Fitting — Parameter kommen vom Fitting, nicht aus dem Gefühl.\"},{\"t\":\"Abkühlzeit einhalten\",\"d\":\"Erst nach der angegebenen Abkühlzeit bewegen oder belasten — Kontrollindikatoren am Fitting prüfen.\"}]},{\"t\":\"Stumpfschweißen (Butt Fusion) — Großdimensionen bis d630\",\"steps\":[{\"t\":\"Enden planhobeln\",\"d\":\"Beide Rohrenden in der Maschine planhobeln, bis durchgehende Späne entstehen — Planparallelität ist Pflicht.\"},{\"t\":\"Ausrichten \u0026 Versatz prüfen\",\"d\":\"Versatz maximal 10 % der Wanddicke — bei d630 zählt jeder Millimeter.\"},{\"t\":\"Anwärmen am Heizelement\",\"d\":\"Angleichen unter Druck bis zur Wulstbildung, dann drucklos durchwärmen — Zeiten nach DVS 2207-11.\"},{\"t\":\"Umstellen \u0026 fügen\",\"d\":\"Heizelement zügig entnehmen und die Enden unter definiertem Fügedruck zusammenfahren.\"},{\"t\":\"Abkühlen unter Fügedruck\",\"d\":\"Der Fügedruck bleibt bis zum Ende der Abkühlzeit — dann entsteht der homogene, dauerhaft dichte Strang.\"}]}],\"errEyebrow\":\"Fehlerkunde\",\"errTitle\":\"Die sechs teuersten Fehler — und ihre Prävention.\",\"errHead\":[\"Fehler\",\"Folge\",\"Prävention\"],\"errRows\":[[\"Zu langes Anwärmen\",\"Wulst wächst nach innen, Querschnitt verengt sich\",\"Anwärmzeit nach Tabelle stoppen — nicht nach Gefühl\"],[\"Verdrehen beim Fügen\",\"Plastifiziertes Gefüge wird zerstört, Verbindung undicht\",\"Nur axial fügen, Markierung als Kontrolle nutzen\"],[\"Fehlendes Entgraten/Anfasen\",\"Material schiebt sich auf, Fügezone wird ungleichmäßig\",\"Jeden Schnitt entgraten — Werkzeug gehört zum System\"],[\"Verschmutztes Heizelement\",\"Anhaftungen verbrennen und lagern sich in der Naht ein\",\"Heizflächen vor jeder Schweißung mit fusselfreiem Tuch reinigen\"],[\"Zu frühe Belastung\",\"Naht verformt sich vor dem Erstarren\",\"Abkühlzeiten einhalten — bei d110 sind das 8 Minuten\"],[\"Falsche Schweißtiefe\",\"Zu kurz: kleine Fügefläche · zu tief: Querschnittsverengung\",\"Einstecktiefe immer anzeichnen, nie schätzen\"]],\"glossEyebrow\":\"Glossar\",\"glossTitle\":\"Die Begriffe der Rohrleitungstechnik.\",\"gloss\":[[\"SDR\",\"Standard Dimension Ratio = Außendurchmesser geteilt durch Wandstärke (d/s). Kleiner SDR = dickere Wand = höherer Nenndruck.\"],[\"PN\",\"Nenndruck in bar bei 20 °C über den Auslegungshorizont — SDR 6 entspricht PN 20, SDR 17 entspricht PN 6.\"],[\"d / di / s\",\"Außendurchmesser / Innendurchmesser / Wandstärke in Millimetern — di = d − 2s.\"],[\"PP-R\",\"Polypropylen Random Copolymer — der bewährte Standardwerkstoff für Trinkwasserinstallationen.\"],[\"PPRCT\",\"PP-R mit modifizierter Kristallstruktur („Crystallinity Temperature\\\") — mehr Temperatur- und Druckreserve bei gleicher Wand.\"],[\"K-Fiber / GF\",\"Glasfaserverstärkter Multilayer-Aufbau — reduziert die Wärmeausdehnung auf rund ein Viertel.\"],[\"Muffenschweißen\",\"Socket Fusion: Rohr und Fitting werden über Heizbuchse und -dorn plastifiziert und ineinandergefügt.\"],[\"Elektroschweißen\",\"Electrofusion: eingebettete Heizwendeln im Fitting erzeugen die Schweißwärme — parametergesteuert.\"],[\"Stumpfschweißen\",\"Butt Fusion: planparallele Rohrenden werden am Heizelement erwärmt und unter Druck gefügt — Standard bis d630.\"],[\"DVS 2207-11\",\"Das Regelwerk für das Schweißen von Polypropylen — Quelle der Richtwerte auf dieser Seite.\"]]},\"co2\":{\"eyebrow\":\"Premium Engineering Tool\",\"title1\":\"LCA \u0026 TCO Simulator\",\"titleGrad\":\"Pro\",\"lead\":\"Berechnen Sie die realen ökologischen und ökonomischen Auswirkungen Ihres Rohrleitungssystems über den gesamten Lebenszyklus. Mit echten physikalischen Strömungsmodellen (Darcy-Weisbach) und EN-konformen LCA-Phasen.\",\"tabGeometry\":\"Rohr\",\"tabFlow\":\"Fluid\",\"tabEnvironment\":\"Einbau\",\"tabLogistics\":\"LCA\",\"dia\":\"Nennweite\",\"length\":\"Leitungslänge\",\"sdrClass\":\"SDR-Klasse\",\"velocity\":\"Fließgeschwindigkeit (v)\",\"velocityDesc\":\"Wirkt sich drastisch auf den Druckverlust und Pumpenstrom (B) aus.\",\"fluidTemp\":\"Fluidtemperatur\",\"ambientTemp\":\"Umgebungstemperatur\",\"insulation\":\"Isolierung\",\"insulationNone\":\"Keine\",\"insulationBasic\":\"Basis\",\"insulationStandard\":\"Standard EnEV\",\"insulationPremium\":\"Premium\",\"installMethod\":\"Verlegeart (A5)\",\"installBuilding\":\"Gebäudeinstallation\",\"installTrench\":\"Erdverlegt (Bagger)\",\"installTrenchless\":\"Grabenlos (HDD)\",\"installDesc\":\"Erdarbeiten verursachen massive CO2-Emissionen durch Maschinen (Diesel).\",\"lifespan\":\"Lebensdauer (Jahre)\",\"lifespanDesc\":\"Kurzlebige Rohre (z.B. C-Stahl) müssen evtl. mehrfach ersetzt werden.\",\"energyMixLabel\":\"Strommix (Betrieb \u0026 Produktion)\",\"transportKm\":\"Transportdistanz (km)\",\"co2Savings\":\"LCA CO₂-Einsparung\",\"co2SavingsDesc\":\"Gegenüber dem ineffizientesten System (inkl. Pumpenstrom). Entspricht ca. {n} Bäumen.\",\"costSavings\":\"TCO Ersparnis (NPV)\",\"costSavingsDesc\":\"Ersparnis über {n} Jahre (inkl. Instandhaltung und Betriebskosten-NPV).\",\"lcaPhases\":\"LCA Phasen (EN 15804)\",\"phaseA13\":\"A1-A3 (Material)\",\"phaseA45\":\"A4-A5 (Install/Transport)\",\"phaseB\":\"B (Betrieb/Energie)\",\"phaseC\":\"C (EoL)\",\"moduleD\":\"Modul D:\",\"costAnalysis\":\"Total Cost of Ownership (NPV, {n} Jahre)\",\"costMaterial\":\"Material\",\"costInstall\":\"Einbau\",\"costOperation\":\"Energie (NPV)\",\"costMaintenance\":\"Instandhaltung\",\"costTotal\":\"Gesamt\",\"certTitle\":\"Zertifizierter LCA \u0026 TCO Report.\",\"certDesc\":\"Beinhaltet Strömungswiderstand nach Darcy-Weisbach und EPD konforme Lebenszyklusphasen.\",\"certBtn\":\"PDF-Report erzeugen\",\"generating\":\"Erzeuge...\",\"energyGreen\":\"Ökostrom\",\"energyDe\":\"DE-Mix\",\"energyEu\":\"EU-Mix\",\"energyGlobal\":\"Global-Mix\",\"materials\":{\"kaqua\":\"K Aqua PPRCT\",\"pvc\":\"PVC-U\",\"copper\":\"Kupfer\",\"steel\":\"Edelstahl / C-Stahl\",\"pex\":\"Mehrschichtverbund (PEX)\",\"pehd\":\"PE 100 (HDPE)\",\"castiron\":\"Gusseisen\"},\"project\":\"Your project\",\"advanced\":\"Advanced LCA Parameters\",\"tempMode\":\"Operating temperature\",\"tempCold\":\"Cold water (10°C)\",\"tempHot\":\"Hot water (60°C)\",\"recycle\":\"Enable End-of-Life recycling credit\",\"guideText\":\"$52\",\"disclaimer\":\"Calculations are based on validated Type III EPDs (EN 15804) and the ecoinvent database (A1-A3, A4, B, C1-C4).\",\"savedLabel\":\"CO₂e Savings vs. best alternative\",\"savedBody1\":\"Equals the CO₂ absorption of\",\"trees\":\"{n} trees\",\"or\":\"or\",\"carKm\":\"{n} car kilometres\",\"compareTitle\":\"Life-Cycle Assessment (LCA)\",\"phases\":{\"a13\":\"Production (A1-A3)\",\"a4\":\"Transport (A4)\",\"b\":\"Operation/Thermal (B)\",\"c\":\"End-of-Life (C)\"},\"auditor\":\"Auditor cockpit:\",\"auditorBody\":\"EPD evidence, ISO certificates and GAEB texts as a package — in the\",\"trustLink\":\"Trust Center\" F hochladen\",\"uploadDesc\":\"Ziehe deinen Lebenslauf hierhin oder klicke zum Auswählen (max. 5MB)\",\"builderTitle\":\"Oder: CV online erstellen\",\"builderDesc\":\"Hast du kein PDF zur Hand? Fülle einfach deinen Werdegang hier aus.\",\"workExp\":\"Berufserfahrung hinzufügen\",\"education\":\"Ausbildung hinzufügen\",\"company\":\"Unternehmen\",\"role\":\"Position\",\"school\":\"Schule / Uni\",\"degree\":\"Abschluss\",\"from\":\"Von\",\"to\":\"Bis\",\"skills\":\"Fähigkeiten (Kommagetrennt)\",\"next\":\"Weiter\",\"back\":\"Zurück\",\"submit\":\"Bewerbung absenden\",\"submitting\":\"Wird gesendet...\",\"success\":\"Vielen Dank für deine Bewerbung!\",\"successSub\":\"Wir haben deine Unterlagen erhalten und melden uns in Kürze bei dir.\",\"error\":\"Es ist ein Fehler aufgetreten. Bitte versuche es später erneut.\"}}},\"trustAndCases\":{\"eyebrow\":\"Zertifizierte Sicherheit\",\"title\":\"Bewährte Qualität \u0026 Einsatzbereiche\",\"lead\":\"Als Hersteller mit Sitz in Deutschland garantieren wir höchste Standards. Unsere Rohrsysteme sind weltweit in kritischen Infrastrukturen im Einsatz.\",\"trustTitle\":\"Zertifiziert \u0026 Geprüft\",\"iso9001\":\"Qualitätsmanagement\",\"iso14001\":\"Umweltmanagement\",\"iso50001\":\"Energiemanagement\",\"madeInGermany\":\"Made in Germany\",\"case1Title\":\"Kommunale Wasserversorgung\",\"case1Desc\":\"Erneuerung von Trinkwassernetzen. Einsatz von korrosionsfreien PPR-Rohren für maximale Versorgungssicherheit bei minimalem Wartungsaufwand.\",\"case2Title\":\"Industrielle Kühlsysteme\",\"case2Desc\":\"Installation von großkalibrigen Rohrleitungen in der Schwerindustrie. Hohe Druckbeständigkeit und chemische Resistenz garantieren Ausfallsicherheit.\",\"case3Title\":\"Infrastruktur \u0026 Tiefbau\",\"case3Desc\":\"Großprojekte mit extremen Anforderungen an Langlebigkeit (SDR 11/17). Schnelle Verlegung und 100% stoffliche Verwertbarkeit am Ende der Lebensdauer.\"},\"buyers\":{\"eyebrow\":\"Für Planer, Einkauf \u0026 Verarbeiter\",\"title1\":\"Sie planen, kalkulieren oder verlegen.\",\"titleGrad\":\"Wir liefern die Grundlage.\",\"lead\":\"Jede Rolle findet bei K Aqua genau die Information, die sie für die nächste Entscheidung braucht — ohne PDF-Wälzen, ohne Rückruf-Warteschleife.\",\"personas\":[{\"t\":\"Planer \u0026 Fachingenieure\",\"d\":\"Normkonforme technische Daten, SDR-Tabellen und CO₂-Nachweise für die Ausschreibung — direkt verwertbar.\",\"cta\":\"Zu den technischen Daten\",\"goto\":\"products\"},{\"t\":\"Einkauf \u0026 Beschaffung\",\"d\":\"Werksdirekte Lieferung, planbare Logistik ab Waldsolms und ein Ansprechpartner statt Zwischenhandel.\",\"cta\":\"Projektanfrage starten\",\"goto\":\"rfq\"},{\"t\":\"Installateure \u0026 Verarbeiter\",\"d\":\"Vier Schweißverfahren als Video, Werkzeugübersicht und klare Verarbeitungsgrenzen — Sicherheit auf der Baustelle.\",\"cta\":\"Zur Academy\",\"goto\":\"academy\"}],\"whyEyebrow\":\"Warum K Aqua\",\"whyTitle\":\"Sechs Gründe, die in der Kalkulation ankommen.\",\"why\":[{\"t\":\"Druckfest \u0026 heißwasserfest\",\"d\":\"PPRCT mit modifizierter Kristallstruktur — mehr Temperatur- und Druckreserve über Jahrzehnte.\"},{\"t\":\"Korrosionsfrei\",\"d\":\"Kein Rost, keine Inkrustation, keine Lochfraß-Risiken wie bei metallischen Leitungen.\"},{\"t\":\"Recycelbar \u0026 CO₂-arm\",\"d\":\"Recycling Code 5, deutlich kleinerer Fußabdruck als Kupfer oder Stahl — belegbar im CO₂-Rechner.\"},{\"t\":\"Ein Ansprechpartner\",\"d\":\"Rohr, Formteil, Armatur und Schweißtechnik aus einer Hand — vom Hersteller, nicht vom Zwischenhandel.\"}],\"promise\":[\"Werksdirekt\",\"Antwort \u003c 24 h\",\"Unverbindlich\"],\"ctaAll\":\"Projektanfrage in 2 Minuten\"},\"about\":{\"seo\":{\"impressum1\":\"Die K Aqua PP-R und PPRCT Rohrsysteme werden von der KWT GmbH in Waldsolms, Deutschland, mit höchster Präzision hergestellt. Unser Impressum bietet unseren Kunden und Geschäftspartnern vollständige Transparenz über unsere Unternehmensstruktur, die gesetzlichen Vertreter und alle relevanten Handelsregisterdaten. Wir legen größten Wert auf eine offene Kommunikation und die Einhaltung sämtlicher rechtlicher Vorgaben im nationalen sowie internationalen Geschäftsverkehr. Die auf unseren Seiten zur Verfügung gestellten Informationen werden kontinuierlich geprüft und aktualisiert, um Ihnen stets korrekte technische und kaufmännische Daten unserer Kunststoffrohrsysteme zur Verfügung zu stellen.\",\"impressum2\":\"Als weltweit agierender Hersteller von Premium-Kunststoffrohrlösungen für Trinkwasser, Heizungs- und Kühlungsanlagen sowie hochkomplexe Industrieanwendungen verpflichten wir uns zur strikten Einhaltung aller gesetzlichen und regulatorischen Standards. Dies schließt den Datenschutz, faire Wettbewerbsbedingungen und internationale Handelsrichtlinien mit ein. Eine Haftung oder Garantie für die Aktualität, Richtigkeit und Vollständigkeit der zur Verfügung gestellten Informationen und Software-Tools zur hydraulischen Berechnung kann jedoch nicht übernommen werden. Inhalt und Struktur der K Aqua Webseiten sind urheberrechtlich geschützt. Die Vervielfältigung von Informationen, technischen Datenblättern oder Installationsrichtlinien bedarf der vorherigen Zustimmung.\",\"kontakt1\":\"Haben Sie technische Fragen zu unseren PP-R/PPRCT-Rohren oder benötigen Sie Unterstützung bei einem internationalen Projekt? Das K Aqua Kontakt-Team in Waldsolms steht Ihnen gerne zur Verfügung.\",\"kontakt2\":\"Ob isometrische Berechnungen, Schweißerschulungen vor Ort oder kaufmännische Anfragen – unsere Ingenieure und Vertriebsmitarbeiter antworten prompt, um den Erfolg Ihres Projekts sicherzustellen.\",\"projektanfrage1\":\"Planen Sie ein wegweisendes Bauvorhaben? Senden Sie uns Ihre Projektanfrage für K Aqua PP-R und PPRCT Rohrsysteme. Unsere technische Abteilung in Waldsolms ist auf die Auslegung und Dimensionierung von Großinstallationen spezialisiert. Dazu gehören anspruchsvolle Hochhäuser, hygienisch sensible Krankenhäuser, weitreichende Fernkältenetze und komplexe industrielle Kühl- und Heizsysteme. Dank unserer jahrzehntelangen Erfahrung im Polymer-Engineering verstehen wir die spezifischen hydraulischen und thermischen Anforderungen, die an die Infrastruktur moderner Bauwerke gestellt werden. Mit K Aqua wählen Sie nicht nur ein Produkt, sondern eine ganzheitliche Systemlösung.\",\"projektanfrage2\":\"Sobald Sie uns Ihre detaillierten Projektspezifikationen, P\u0026ID-Pläne oder Isometrien mitteilen, beginnen unsere Fachingenieure mit einer tiefgehenden Analyse. Wir unterstützen Sie bei komplexen Druckverlustberechnungen, der Ermittlung von thermischen Längenausdehnungen und der exakten Positionierung von Fest- und Loslagern. Zudem erstellen wir präzise Materialauszüge (Bill of Materials) und konzipieren maßgeschneiderte Übergangsfittings für die Anbindung an metallische Großkomponenten. Unser Ziel ist es, Ihnen ein hydraulisch perfekt ausbalanciertes Rohrnetz zu entwerfen, das den Energieverbrauch Ihrer Pumpen minimiert und eine wartungsfreie Lebensdauer von über 50 Jahren garantiert.\",\"projektanfrage3\":\"Diskretion und Zuverlässigkeit stehen bei uns an erster Stelle. Jede Projektanfrage wird streng vertraulich behandelt und ausschließlich von unserem qualifizierten deutschen Ingenieurteam bearbeitet. Wir koordinieren darüber hinaus die weltweite Logistik und gewährleisten, dass unsere High End-Rohre und Formteile termingerecht und unbeschadet auf Ihrer Baustelle eintreffen. Zusätzlich bieten wir Vor Ort-Schweißerschulungen durch unsere zertifizierten Instruktoren an, um sicherzustellen, dass die Installation exakt nach den Vorgaben des German Engineerings ausgeführt wird. Mit K Aqua sichern Sie maximale Effizienz, absolute Leckagefreiheit und die Langlebigkeit Ihres gesamten Rohrleitungssystems.\",\"news1\":\"Bleiben Sie auf dem neuesten Stand mit aktuellen News von K Aqua. Wir veröffentlichen regelmäßig Updates zu neuen PP-R/PPRCT Produktentwicklungen, internationalen Messeauftritten und globalen Großprojekten.\",\"news2\":\"Unsere News-Sektion informiert Sie zudem über technische Innovationen beim Muffenschweißen, materialwissenschaftliche Fortschritte bei Polypropylen Random Copolymer und Nachhaltigkeitsinitiativen in unserem Werk in Waldsolms.\"},\"eyebrow\":\"Über uns\",\"title1\":\"Erfahrung ist Ihr\",\"titleGrad\":\"Vorteil.\",\"lead\":\"Neue Strategien, gewachsenes Wissen: Die KWT GmbH verbindet jahrzehntelange Fertigungserfahrung mit einem klaren Blick nach vorn.\",\"h2\":\"K Aqua — führend in der Wasserversorgung\",\"p1\":\"Das Geschäftsfeld der KWT GmbH ist die Fertigung von Rohren und Formteilen für die Wasserversorgung aus verschiedenen Kunststoffen. Damit positioniert sich das Unternehmen in der Wertschöpfungskette Bau als Baustofflieferant und Hersteller.\",\"p2\":\"Mit dem Premiumhersteller KESSEL — „Leading in drainage\\\" — besteht eine enge und langjährige Partnerschaft. Mit dieser Erfahrung aus Jahrzehnten tragen wir unseren Erfolg in die Zukunft.\",\"polEyebrow\":\"Unternehmenspolitik\",\"polTitle\":\"Nutzen entsteht im Zusammenspiel.\",\"polLead\":\"Kein Kundennutzen ohne Mitarbeiternutzen, kein Mitarbeiternutzen ohne Unternehmensnutzen — und kein Unternehmensnutzen ohne Nutzen für Umwelt und Mitwelt.\",\"cards\":[{\"t\":\"Menschen im Mittelpunkt\",\"d\":\"Alle Mitarbeitenden sind in den kontinuierlichen Verbesserungsprozess eingebunden — Qualität bleibt dabei stets mit Kosten und Terminen vereinbar.\"},{\"t\":\"Verlässlichkeit\",\"d\":\"Wünsche von Kunden und allen Interessierten werden unter Einhaltung gesetzlicher und sozialer Standards erkannt, ernst genommen und umgesetzt.\"},{\"t\":\"Ökologische Verantwortung\",\"d\":\"Alle Unternehmensaktivitäten erfolgen unter Beachtung von Ressourcenschonung, Umweltverträglichkeit und strikter Einhaltung aller Verpflichtungen.\"}],\"genauEyebrow\":\"GENAU-Managementsystem\",\"genauTitle\":\"Genau hinschauen. Genau verbessern.\",\"genauLead\":\"Das GENAU-Managementsystem ist in das House of KWT integriert und damit ein zentrales Element unserer Philosophie.\",\"points\":[\"Kontinuierliche Verbesserung von Arbeits-, Umwelt- und Gesundheitsschutz\",\"Optimierung der Energieeffizienz\",\"Prävention, laufende Gefahrenermittlung und Risikobewertung\",\"Jeder Mitarbeitende ist verpflichtet, Gefahren zu melden und aktiv mitzuwirken\"],\"certTitle\":\"geprüft nach Norm\",\"certText\":\"Das gelebte GENAU-Management erfüllt die Anforderungen der DIN EN ISO 14001 und 50001 — seit Oktober 2025 ergänzt um ISO 9001:2015.\",\"meta\":{\"title\":\"Über KWT GmbH: Experten für Rohrherstellung\",\"desc\":\"Das Epizentrum deutscher Ingenieurskunst.\"},\"hero\":{\"eyebrow\":\"Die K Aqua Doktrin\",\"title1\":\"German Engineering.\",\"title2\":\"Kompromisslos.\",\"desc\":\"Wir machen keine Kompromisse. Wir definieren den globalen Standard für PP-R Rohrleitungssysteme. Willkommen im Epizentrum deutscher Ingenieurskunst.\"},\"intro\":{\"title1\":\"WIR LEITEN NICHT NUR WASSER.\",\"title2\":\"WIR KONTROLLIEREN ES.\",\"desc\":\"Seit über 30 Jahren fertigen wir Rohrleitungssysteme, die für die Ewigkeit gebaut sind. Kein Raum für Fehler. Kein Platz für Mittelmaß. Nur reine, unerbittliche Präzision, die sich in jedem einzelnen Fitting manifestiert.\"},\"material\":{\"eyebrow\":\"Materialwissenschaft\",\"title1\":\"Polypropylen Random Copolymerisat.\",\"title2\":\"Entfesselt.\",\"p1\":\"PP-R Typ 3 ist nicht einfach ein Kunststoff. Es ist ein hochkomplexes, thermoplastisches Material, das wir auf molekularer Ebene beherrschen.\",\"p2\":\"Durch die strategische Anordnung von Ethylen-Monomeren in der Propylen-Kette erreichen wir eine unerreichte Schlagzähigkeit – selbst bei Minustemperaturen. Unsere Granulate stammen ausschließlich von der globalen Elite der Rohstoffproduzenten. Wir analysieren jede Charge mittels Differential Scanning Calorimetry (DSC) und Melt Flow Rate (MFR) Tests. Was unsere Spezifikationen um auch nur ein Promille verfehlt, wird erbarmungslos eliminiert.\",\"items\":[{\"title\":\"Extreme Molmasse\",\"desc\":\"Garantiert maximale Zeitstandfestigkeit und absoluten Widerstand gegen Spannungsrisskorrosion unter extremen Drücken.\"},{\"title\":\"Kristalline Optimierung\",\"desc\":\"Die perfekte thermodynamische Balance. Höchste Flexibilität für radikale Verlegebedingungen bei simultaner axialer Steifigkeit.\"}]},\"timeline\":{\"title\":\"Die Evolution der Perfektion\",\"desc\":\"Ein unaufhaltsamer Aufstieg zur globalen Marktmacht. Jede Dekade ein Meilenstein technologischer Überlegenheit.\",\"items\":[{\"year\":\"1990\",\"title\":\"Der Ursprung der Toleranzlosigkeit\",\"text\":\"Wo andere Kompromisse machten, zogen wir eine rote Linie. Die Gründung von K Aqua basierte auf einem einzigen, unerschütterlichen Prinzip: Makellose Rohrleitungssysteme. Unsere ersten Extruder liefen mit einer Präzision, die den Markt schockierte.\"},{\"year\":\"2005\",\"title\":\"Die Polypropylen-Revolution\",\"text\":\"Wir weigerten uns, den Status quo zu akzeptieren. Mit der Einführung unserer proprietären PP-R Mischung definierten wir thermische Stabilität neu. Während Konkurrenzprodukte unter Druck kollabierten, blieben unsere Systeme stoisch intakt. Ein Triumph der Polymerchemie.\"},{\"year\":\"2015\",\"title\":\"Die architektonische Symbiose\",\"text\":\"Von den Skylines in Dubai bis zu den Industrieanlagen im Ruhrgebiet – K Aqua wurde zum Synonym für unzerstörbare Infrastruktur. Unsere PPRCT Faserverbundrohre revolutionierten den Hochbau. Weniger Ausdehnung, mehr Durchfluss, absolute Dominanz.\"},{\"year\":\"2026\",\"title\":\"Die Molekulare Diktatur\",\"text\":\"Heute kontrollieren wir jeden Aspekt der Produktion. Von der Auswahl der Rohgranulate bis zur Endinspektion unterliegen unsere Systeme einem diktatorischen Qualitätsregime. Das Ergebnis? Eine garantierte Lebensdauer, die Generationen überdauert.\"}]},\"sticky\":{\"eyebrow\":\"DIE PHYSIK BEZWUNGEN\",\"title\":\"Die Vier Säulen der Macht.\",\"lead\":\"Technologie, die an Magie grenzt. Wir haben die Limitierungen herkömmlicher Rohrsysteme nicht nur überwunden, wir haben sie pulverisiert.\",\"items\":[{\"title\":\"Absolutismus in der Qualität\",\"desc\":\"Jeder Millimeter unserer PP-R und PPRCT Systeme durchläuft brutalste Belastungstests. 50 Jahre Lebensdauer sind kein Versprechen, sondern eine mathematische Gewissheit. Wir tolerieren null Abweichungen. Was unsere Hallen verlässt, ist Perfektion in Polymerform.\"},{\"title\":\"Thermische Unverwundbarkeit\",\"desc\":\"Unsere Faserverbundrohre (K Aqua Faser) neutralisieren thermische Längenausdehnung beinahe vollständig. Ob eiskalte -20°C oder kochende +95°C, unsere Systeme bleiben absolut formstabil. Eine ingenieurstechnische Meisterleistung, die den physikalischen Gesetzen zu trotzen scheint.\"},{\"title\":\"Chemische Resistenz\",\"desc\":\"Korrosion existiert in unserem Vokabular nicht. Unsere Polymere sind immun gegen aggressivste Medien, Inkrustation und biologische Zersetzung. Während Metalle im Boden rosten und verfallen, bleibt K Aqua unangetastet – stoisch, monolithisch, unverwüstlich.\"},{\"title\":\"Molekulare Fusion\",\"desc\":\"Durch unser homogenes Schweißverfahren verschmelzen Rohr und Fitting auf molekularer Ebene zu einer untrennbaren Einheit. Keine Dichtungen, die ermüden können. Keine mechanischen Schwachstellen. Eine monolithische Struktur, die ewig hält.\"}]},\"bento\":{\"eyebrow\":\"INDUSTRIELLE DOMINANZ\",\"title\":\"Infrastruktur auf Steroiden.\",\"lead\":\"Wir fertigen nicht einfach Rohre. Wir erschaffen die Arterien der modernen Zivilisation. K Aqua ist das Rückgrat industrieller und architektonischer Megaprojekte weltweit.\",\"items\":[{\"title\":\"Brachiale Extrusion\",\"desc\":\"Hochleistungsanlagen, die unter brutalem Druck arbeiten. Das Resultat ist eine unübertroffene Wandstärkenkonsistenz bis in den Mikrometerbereich.\"},{\"title\":\"geprüfte Überlegenheit\",\"desc\":\"ISO 9001, 14001, 50001. Wir übertreffen die Normen nicht nur, wir diktieren sie. Internationale Akkreditierung als absoluter Standard.\"},{\"title\":\"Hygiene-Diktat\",\"desc\":\"Lebensmittelecht, toxikologisch unbedenklich und absolut keimresistent. Trinkwasser bleibt in K Aqua Systemen unangetastet rein. Keine Ausnahme.\"},{\"title\":\"Ressourcen-Effizienz\",\"desc\":\"Vollständig recyclebar. Minimale CO2-Bilanz bei der Herstellung. Weil wahre technologische Macht immer auch Verantwortung für die Zukunft bedeutet.\"}]},\"values\":{\"eyebrow\":\"Unternehmenspolitik\",\"title\":\"Das Fundament unseres Handelns.\",\"desc\":\"Technologie allein reicht nicht. Wahre Größe manifestiert sich in der Art und Weise, wie ein Unternehmen mit seiner Umwelt, seinen Mitarbeitern und seinen Partnern agiert.\",\"items\":[{\"title\":\"Kunden-Obsession\",\"desc\":\"Wir bedienen nicht einfach Märkte, wir dominieren sie durch radikale Kundenfokussierung. Ihre Anforderungen sind unser Befehl. Unsere Lösungen sind präzise, skalierbar und absolut kompromisslos in ihrer Ausführung.\"},{\"title\":\"Strategische Allianzen\",\"desc\":\"Wir suchen keine Lieferanten, wir formen strategische Allianzen mit den besten Rohstoffproduzenten des Planeten. Gemeinsame Forschung, gemeinsame Qualitätsstandards, gemeinsame Dominanz.\"},{\"title\":\"Ökologischer Imperativ\",\"desc\":\"Nachhaltigkeit ist bei K Aqua kein Marketing-Slogan, sondern ein physikalischer Imperativ. Langlebigkeit ist der ultimative Umweltschutz. Unsere Systeme minimieren den energetischen Fußabdruck von der Produktion bis zum Recycling.\"}]},\"genauManagement\":{\"eyebrow\":\"geprüfte Qualität\",\"title1\":\"Das \",\"titleHighlight\":\"GENAU\",\"title2\":\" Management System\",\"p1\":\"Das Ziel des GENAU Management-Systems ist die kontinuierliche Verbesserung des Arbeits-, Umwelt- und Gesundheitsschutzes im Unternehmen.\",\"p2\":\"Sämtliche Unternehmensaktivitäten bei KWT erfolgen unter Berücksichtigung von Ressourcenschonung, Umweltverträglichkeit und der strikten Einhaltung aller Verpflichtungen. Das praktizierte GENAU-Management erfüllt dabei die hohen Anforderungen der \",\"p3\":\" und \",\"list1Title\":\"Ökologische Verantwortung\",\"list1Desc\":\"Umweltschutz ist Teil unseres Qualitätsverständnisses, dem sich alle Mitarbeiter der KWT GmbH verpflichten.\",\"list2Title\":\"Energieeffizienz\",\"list2Desc\":\"Gezielte Identifikation von Risiken und Umsetzung von Maßnahmen zur Optimierung der Energieeffizienz.\"}},\"footer\":{\"tagline\":\"K Aqua — führend in der Wasserversorgung. PP-R/PPRCT-Rohrsysteme für Trinkwasser, gefertigt von der KWT GmbH in Waldsolms.\",\"colTools\":\"Produkte \u0026 Tools\",\"colCompany\":\"Unternehmen\",\"colContact\":\"Kontakt\",\"directions\":\"Anfahrt \u0026 Standort\",\"rights\":\"Alle Rechte vorbehalten.\",\"imprint\":\"Impressum\",\"privacy\":\"Datenschutz\",\"phone\":\"+49 (0)60 85 / 9868-410\",\"email\":\"info@k-aqua.de\",\"address\":\"Auweg 3, 35647 Waldsolms, Deutschland\",\"copyright\":\"© 2026 KWT GmbH.\",\"projectCta\":\"Projekt anfragen\",\"badges\":[{\"t\":\"SKZ-Cert\",\"s\":\"ISO 9001 / 14001 / 50001\"},{\"t\":\"DIN 8077/8078\",\"s\":\"PP-R Rohrstandards\"},{\"t\":\"Nachhaltigkeit\",\"s\":\"Umweltfreundlich\"},{\"t\":\"GENAU-System\",\"s\":\"Integriertes Management\"},{\"t\":\"Made in Germany\",\"s\":\"Produktion in Waldsolms\"}],\"attribution\":{\"texts\":[\"Webdesign von Coday\",\"Ein Projekt der Coday Web Agency\",\"Coday Web Agency\",\"Digitalisiert durch Coday\"],\"srDesc\":\"Diese Webseite wurde konzipiert und technisch realisiert durch die Coday Web Agency, Experten für Webdesign und GEO in Hessen.\",\"linkTitle\":\"Zur Coday Web Agency – Premium Webdesign\"}},\"homex\":{\"stats\":[{\"n\":\"630\",\"u\":\"mm\",\"l\":\"maximale Rohrdimension im Programm\"},{\"n\":\"5\",\"u\":\"SDR\",\"l\":\"Druckstufen: SDR 6 / 7,4 / 9 / 11 / 17\"},{\"n\":\"3×\",\"u\":\"ISO\",\"l\":\"Qualität, Umwelt \u0026 Energie geprüft\"},{\"n\":\"100\",\"u\":\"%\",\"l\":\"Produktionsabfälle werden recycelt\"}],\"heroBadgeLabel\":\"Rohrdimensionen, SDR 6 bis SDR 17\",\"marquee\":[\"Führend in der Wasserver  Temperaturen.\",\"ariaGroup\":\"Materialschichten\",\"items\":[{\"t\":\"PPRCT\",\"d\":\"Außenschicht\"},{\"t\":\"Faserverbund\",\"d\":\"Mittelschicht\"},{\"t\":\"PPRCT\",\"d\":\"Innenschicht\"}]},\"comply\":{\"title\":\"Compliance \u0026 Normen\",\"items\":[[\"DVGW\",\"Trinkwasser-Zulassung\"],[\"SKZ\",\"Güteüberwachung\"],[\"KIWA\",\"Systemzertifizierung\"],[\"DIN 8077/8078\",\"Rohrmaße \u0026 Toleranzen\"]]},\"rangeTitle\":\"Dimensionen\",\"network\":{\"title\":\"Globales Netzwerk\",\"lead\":\"K Aqua Systeme sind weltweit in über 35 Ländern im Einsatz. Von Waldsolms in die Welt.\",\"chips\":[[\"35+\",\"Länder\"],[\"3\",\"Kontinente\"],[\"ISO\",\"Zertifiziert\"]]}},\"kontaktBlocks\":{\"home\":{\"kicker\":\"Direktkontakt\",\"head\":\"Starten Sie Ihr nächstes Rohrprojekt mit belastbaren Zahlen.\",\"short\":\"Sprechen Sie direkt mit der Produktion\",\"text\":\"Übergeben Sie uns grobe Parameter wie Rohrdurchmesser und Trassenlänge. Wir prüfen die Fertigungskapazitäten in unserem deutschen Werk und nennen Ihnen realistische Lieferzeiten.\",\"interest\":\"Rohrsysteme\",\"done\":\"Einer unserer Ingenieure prüft Ihre Parameter und meldet sich zeitnah.\"},\"unternehmen\":{\"kicker\":\"Werksführung \u0026 Beratung\",\"head\":\"Lernen Sie die Fertigung hinter K Aqua persönlich kennen.\",\"short\":\"Termin für Werksbesuch vereinbaren\",\"text\":\"Als familiengeführtes Unternehmen öffnen wir unsere Tore gerne für Planer und Bauherren. Hinterlassen Sie Ihre Kontaktdaten, um einen Besuch im Werk Waldsolms abzustimmen.\",\"interest\":\"Beratung\",\"done\":\"Wir melden uns zur Koordination Ihres Besuchstermins in Waldsolms.\"},\"produkte_fittings\":{\"kicker\":\"Formteile \u0026 Fittings\",\"head\":\"Stücklistenprüfung für Ihre Fittings und Verbindungen.\",\"short\":\"Fittings für Ihr PP-R System anfragen\",\"text\":\"Senden Sie uns die Dimensionen und Mengen Ihrer benötigten Formteile. Wir schätzen die Lieferbarkeit und empfehlen auf Wunsch Optimierungen für den hydraulischen Abg
