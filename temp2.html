a\":{\"title\":\"PP-R \u0026 PPRCT Rohrsysteme | K Aqua\",\"desc\":\"Hochleistungs-Rohrsysteme aus PP-R und PPRCT. German Engineering für Trinkwasser, Klima und Industrie. Kompromisslose Sicherheit für Megaprojekte.\"},\"hero\":{\"eyebrow\":\"Rohrsysteme\",\"title\":\"PP-R \u0026 PPRCT Rohre von d20 bis d630\",\"lead\":\"K Aqua PP-R Rohre und PPRCT Mehrschichtrohre für Trinkwasser, Heizung und Industrie: Mono- und Faserverbund-Ausführungen in allen Druckstufen — gefertigt in Deutschland nach DIN 8077/8078. Verfügbar von d20 bis d630 für dauerhaft dichte Verbindungen.\"},\"sticky\":{\"eyebrow\":\"Materialwissenschaft\",\"title\":\"Polymer-Engineering in Perfektion.\",\"lead\":\"Die molekulare Struktur unserer PP-R und PPRCT Rohre wurde für extreme thermomechanische Belastungen optimiert. Ein Meisterwerk deutscher Ingenieurskunst.\",\"items\":[{\"title\":\"PPRCT Multilayer-Architektur\",\"desc\":\"Unsere PPRCT (Polypropylene Random Copolymere with modified Crystallinity and Temperature resistance) Rohre der neuesten Generation verfügen über eine integrierte Glasfasercompound-Schicht. Dies reduziert die thermische Längenausdehnung um bis zu 75% gegenüber Standard-PP-R Rohren, während die Druckbelastbarkeit bei hohen Temperaturen drastisch erhöht wird. Dünnere Wandstärken bei gesteigerter Durchflusskapazität sind das Resultat.\"},{\"title\":\"Homogenes Schweißen\",\"desc\":\"Im Gegensatz zu Pressfittings oder Klebeverbindungen nutzen wir das Polyfusions-Schweißverfahren. Rohr und Fitting verschmelzen bei 260°C zu einer einzigen, untrennbaren molekularen Einheit. Das System kommt völlig ohne O-Ringe oder mechanische Dichtungen aus. Die Verbindungstelle ist physikalisch stärker als das Rohr selbst – eine 100% leckagefreie Lebensdauer ist garantiert.\"},{\"title\":\"Absolute Korrosionsfreiheit\",\"desc\":\"Metallische Systeme kapitulieren vor aggressiven Wasserqualitäten, niedrigem pH-Wert oder hohem Chloridgehalt. K Aqua Polymerrohre sind vollständig inert. Lochfraß, Spaltkorrosion, galvanische Korrosion oder Inkrustationen sind physikalisch ausgeschlossen. Der Rohrreibungsverlust (Rauhigkeitswert k=0.007 mm) bleibt auch nach 50 Jahren Betrieb auf dem Niveau des ersten Tages, was die Pumpenenergie massiv senkt.\"},{\"title\":\"Thermische und Akustische Isolation\",\"desc\":\"Dank der geringen Wärmeleitfähigkeit von PP-R (0.24 W/mK) gegenüber Stahl (50 W/mK) oder Kupfer (380 W/mK) wird die Kondenswasserbildung bei Kühlanlagen stark verzögert und Wärmeverluste bei Heizsystemen minimiert. Zudem absorbieren unsere dickwandigen Polymerrohre Strömungsgeräusche und Wasserschläge (Water Hammers) effizient, was den akustischen Komfort in Hochhäusern und Hotels perfektioniert.\"}]},\"timeline\":{\"title\":\"Null Fehlertoleranz\",\"desc\":\"Jeder Zentimeter unserer Rohre wird im Extrusionsprozess überwacht. Vom Granulat bis zum fertigen Produkt – Qualität Made in Germany.\",\"items\":[{\"year\":\"Stufe 01\",\"title\":\"Premium Rohmaterial\",\"text\":\"Wir verarbeiten ausschließlich hochreine PP-R und PPRCT Granulate der weltweit führenden Polymer-Hersteller. Jede Charge durchläuft im hauseigenen Labor einen MFR-Test (Melt Flow Rate) sowie eine oxidative Induktionszeit-Messung (OIT) vor Freigabe für die Extrusion.\"},{\"year\":\"Stufe 02\",\"title\":\"Präzisions-Extrusion\",\"text\":\"Unsere hochmodernen Extrusionsanlagen fertigen 3-Schicht-Faserverbundrohre mit Mikrometer-Präzision. Ultraschall-Wandstärkenmessung in Echtzeit über 360° stellt sicher, dass selbst bei SDR 6 Rohren die minimal zulässigen Toleranzen unterschritten werden.\"},{\"year\":\"Stufe 03\",\"title\":\"Thermisches Konditionieren\",\"text\":\"Unmittelbar nach der Extrusion werden die Rohre in speziell temperierten Wasserbädern stufenweise heruntergekühlt. Dieser schonende Abkühlprozess verhindert innere Eigenspannungen im Material und sorgt für höchste Maßhaltigkeit über alle Dimensionen.\"},{\"year\":\"Stufe 04\",\"title\":\"100% Traceability\",\"text\":\"Jedes Rohr erhält einen unauslöschlichen Laser-Aufdruck mit exakter Chargen- und Produktionszeit-Angabe. Selbst nach Jahrzehnten in der Wand lässt sich die Herkunft jedes K Aqua Rohres lückenlos bis zur Granulatcharge zurückverfolgen.\"},{\"year\":\"Stufe 05\",\"title\":\"Prüfung \u0026 Freigabe\",\"text\":\"Hydraulischer Berstdruck-Test bei 95°C über 1000 Stunden. Zugversuche, Kerbschlagzähigkeit und toxikologische Unbedenklichkeitsprüfung. Nur wenn das Produkt alle Normen (DIN 8077/8078, EN ISO 15874) übertrifft, verlässt es unser Werkstatt.\"}]},\"bento\":{\"eyebrow\":\"Spezifikationen\",\"title\":\"Eine Dimension für jede Anforderung.\",\"lead\":\"Skalierbar von d20 Hausanschlüssen bis zu d500 industriellen Steigleitungen. Unser System wächst mit den Dimensionen Ihres Projekts.\",\"items\":[{\"title\":\"Dimensionen von d20 bis d500\",\"desc\":\"Lückenloses Portfolio an Rohren und Fittings. Egal ob T-Stücke, Reduktionen oder Flanschverbindungen in gigantischen Dimensionen – wir liefern das komplette System aus einer Hand. Keine Kompromisse bei der Hydraulik.\"},{\"title\":\"SDR Klassen 6 bis 11\",\"desc\":\"Maßgeschneiderte Druckstufen (PN10 bis PN25) durch verschiedene Standard Dimension Ratios. Optimieren Sie Materialeinsatz und Durchfluss.\"},{\"title\":\"Trinkwasserhygiene\",\"desc\":\"Entspricht den strengsten europäischen Normen (UBA, DVGW). Absolut lebensmittelecht, geschmacks- und geruchsneutral. Optionale antibakterielle Innenbeschichtung.\"},{\"title\":\"UV-Beständige Außenrohre\",\"desc\":\"Für Freiluftinstallationen in extremen Klimazonen (z.B. Middle East) bieten wir spezielle UV-stabilisierte Rohre an. Die schützende Außenschicht blockiert UV-Strahlung und verhindert Polymer-Degradation.\"}]},\"cta\":{\"title\":\"Lassen Sie Ihr Projekt von Experten dimensionieren.\",\"desc\":\"Senden Sie uns Ihre Isometrien oder P\u0026ID-Pläne. Unser Engineering Team übernimmt die hydraulische Berechnung und Stücklistenerstellung für Ihr Großprojekt.\",\"primary\":\"Projektanfrage starten\"}},\"transitionFittings\":{\"meta\":{\"title\":\"Übergänge (Transition Fittings) | K Aqua\",\"desc\":\"K Aqua Übergänge – Hybrid-Konnektivität der absoluten Spitzenklasse. Wenn hochfestes Metall auf innovativen Kunststoff trifft. German Engineering.\"},\"hero\":{\"eyebrow\":\"Systemübergänge\",\"title\":\"Übergangsfittings: Sicher von Metall auf PP-R\",\"lead\":\"Messing trifft Polymer: K Aqua Übergangsfittings verbinden Bestandsleitungen aus Metall dauerhaft dicht und korrosionsfrei mit dem PP-R System — geprüft weit über die Norm hinaus.\"},\"intro\":{\"eyebrow\":\"Die Herausforderung\",\"title\":\"Wo Welten kollidieren.\",\"lead\":\"Der Übergang von starren metallischen Rohrleitungssystemen zu modernen thermoplastischen Netzwerken ist der Achillesnerv jeder Gebäude- und Industrieinstallation. Hier wirken maximale thermische und mechanische Scherkräfte.\"},\"sticky\":{\"eyebrow\":\"Deep Tech\",\"title\":\"Anatomie der Unzerstörbarkeit.\",\"lead\":\"Wir betrachten einen Übergangsfitting nicht als Zubehörteil, sondern als hochkomplexes mechanisches Instrument. Jeder Millimeter Wandstärke, jeder Gewindegang ist das Resultat unzähliger Finite-Elemente-Analysen (FEA).\",\"items\":[{\"title\":\"Die Symbiose von Metall und Polymer\",\"desc\":\"Unsere Übergangsfittings vereinen die unerbittliche mechanische Festigkeit von entzinkungsbeständigem CW617N-Messing mit der chemischen Inertheit von PPRCT. Diese Materialfusion entsteht nicht durch einfaches Verpressen, sondern durch einen thermomechanischen Spritzgussprozess, der eine untrennbare molekulare Verzahnung erzielt.\"},{\"title\":\"Extremes Torsions- und Drehmoment\",\"desc\":\"Ein kritisches Versagenskriterium bei Standardfittings ist die Drehmomentüberlastung bei der Installation. K Aqua Übergänge integrieren ein patentiertes hexagonales Verankerungsprofil im Kunststoffmantel. Das Resultat: Über 300 Nm garantierte Torsionsresistenz ohne Delamination der Grenzschicht.\"},{\"title\":\"Thermische Ausdehnungskoeffizienten im Gleichgewicht\",\"desc\":\"Metalle und Kunststoffe dehnen sich bei Temperaturschwankungen unterschiedlich aus (Δα). Durch präzise berechnete Mikrodehnungsfugen im Messing-Insert kompensieren unsere Fittings extreme Schocks von -20°C auf +95°C in Millisekunden – absolut leckagefrei.\"},{\"title\":\"Null-Toleranz Qualitätskontrolle\",\"desc\":\"Jedes einzelne Hybrid-Bauteil durchläuft einen vollautomatisierten Helium-Leckagetest und eine optische 3D-Vermessung. Wenn der Grenzwert von 10^-5 mbar·l/s auch nur ansatzweise tangiert wird, schließt unsere Anlage das Teil rigoros aus. German Engineering duldet keine Kompromisse.\"}]},\"bento\":{\"eyebrow\":\"Spezifikationen\",\"title\":\"Architektur der Leistung.\",\"lead\":\"Wenn Sie Megaprojekte mit zehntausenden Verbindungen planen, ist statistische Ausfallsicherheit der wichtigste ROI. K Aqua liefert Ihnen die physikalische Garantie dafür.\",\"items\":[{\"title\":\"DZR Brass Core\",\"desc\":\"Entzinkungsbeständiges Messing der Güteklasse CW617N (nach DIN EN 12164) eliminiert das Risiko von selektiver Korrosion in aggressiven Wasserqualitäten.\"},{\"title\":\"Anti-Rotation Design\",\"desc\":\"Polygonale Hinterschneidungen formen einen geometrischen Lock, der extreme Anzugsmomente aufnimmt, ohne den Kunststoffmantel zu belasten.\"},{\"title\":\"Tiefgezogenes Gewinde\",\"desc\":\"Konische und zylindrische ISO 7/1 bzw. ISO 228 Gewinde, maschinell mit einer Toleranz von ±0.01mm geschnitten für perfekte Dichtigkeit.\"},{\"title\":\"PPRCT Matrix\",\"desc\":\"Die hochkristalline Struktur unseres Polypropylen Random Copolymers bietet überragende Langzeit-Zeitstandfestigkeit bei hohen Temperaturen.\"}]},\"timeline\":{\"title\":\"Der Fertigungszyklus\",\"desc\":\"Ein Blick in unsere Manufaktur. Der Weg vom Rohmaterial zum geprüften Hybrid-Fitting ist ein Orchester aus Hitze, Druck und gnadenloser Präzision.\",\"items\":[{\"year\":\"Phase 1\",\"title\":\"Rohteilbearbeitung (CW617N)\",\"text\":\"Das Messing wird bei 750°C in hochpräzise Matrizen gepresst, gefolgt von einer CNC-gesteuerten Zerspanung im Mikrometerbereich zur Erzeugung des Dichtprofils.\"},{\"year\":\"Phase 2\",\"title\":\"Oberflächenpassivierung\",\"text\":\"Um galvanische Korrosion zu eliminieren, durchlaufen die Gewindeeinsätze einen mehrstufigen Passivierungsprozess in elektrolytischen Ultraschallbädern.\"},{\"year\":\"Phase 3\",\"title\":\"Umspritzen (Injection Molding)\",\"text\":\"In Hochdruck-Spritzgussmaschinen (2.000 bar) umschließt das schmelzflüssige PPRCT das Messing. Der Kunststoff füllt jede Hinterschneidung komplett aus.\"},{\"year\":\"Phase 4\",\"title\":\"Kontrollierte Abkühlung\",\"text\":\"Ein programmierter, stufenweiser Temperaturabbau verhindert Eigenspannungen im Kunststoffgitter und sichert die konzentrische Formtreue des Fittings.\"},{\"year\":\"Phase 5\",\"title\":\"Druck- \u0026 Torsionsprüfung\",\"text\":\"Stichprobenartige Bersttests bis zu 120 bar sowie Dauerschwingversuche simulieren 50 Jahre aggressivste industrielle Dauerbelastung.\"}]},\"stats\":{\"eyebrow\":\"Zertifizierungen \u0026 Parameter\",\"title\":\"Harte Fakten.\",\"lead\":\"Wir testen nicht nur nach Norm. Wir definieren sie. Unsere internen Prüfprotokolle überschreiten die Anforderungen von DVGW, SKZ und ISO um bis zu 300%.\",\"items\":[{\"label\":\"Betriebsdruck (PN)\",\"value\":\"Bis zu 25 bar\",\"sub\":\"Bei 20°C Wasser\"},{\"label\":\"Temperaturspektrum\",\"value\":\"-20°C bis +95°C\",\"sub\":\"Spitzenbelastung bis 110°C\"},{\"label\":\"Gewindenormen\",\"value\":\"ISO 7/1, ISO 228\",\"sub\":\"Innengewinde \u0026 Außengewinde\"},{\"label\":\"Lebenszyklus\",\"value\":\"\u003e 50 Jahre\",\"sub\":\"Unter industriellen Bedingungen\"},{\"label\":\"Messinglegierung\",\"value\":\"CW617N / CW614N\",\"sub\":\"DZR / Entzinkungsfrei\"},{\"label\":\"Kunststoff\",\"value\":\"PPRCT / PP-R\",\"sub\":\"Trinkwasserzertifiziert\"},{\"label\":\"Trinkwasserkonformität\",\"value\":\"UBA, DVGW\",\"sub\":\"100% Bleifrei-Optionen\"},{\"label\":\"Qualitätssicherung\",\"value\":\"ISO 9001:2015\",\"sub\":\"100% Chargen-Tracking\"}]},\"cta\":{\"title\":\"Die stärkste Verbindung Ihres Projekts.\",\"desc\":\"Verlassen Sie sich auf bewährte deutsche Ingenieurskunst. Kontaktieren Sie uns für technische Datenblätter, BIM-Modelle oder eine individuelle Projektberatung.\",\"primary\":\"Projektanfrage starten\",\"secondary\":\"CAD \u0026 Spezifikationen\"}},\"hero\":{\"eyebrow\":\"SYSTEMARCHITEKTUR\",\"title1\":\"K-AQUA: DIE ABSOLUTE\",\"title2\":\"ARCHITEKTUR DES WASSERS.\",\"desc\":\"Präzision auf molekularer Ebene. Entwickelt für die Ewigkeit. Unsere Rohrsysteme, Fittings und Ventile definieren den globalen Standard für industrielle und zivile Wasserinfrastruktur. Keine Kompromisse. Nur pure Leistung.\"},\"sticky\":{\"eyebrow\":\"DAS PRODUKTSPEKTRUM\",\"title\":\"KOMPROMISSLOSE INGENIEURSKUNST.\",\"lead\":\"Jede Komponente ist Teil eines geschlossenen, perfekten Systems. Von der Einspeisung bis zum Endpunkt kontrollieren wir den Fluss von Wasser, Chemikalien und Gasen mit unerbittlicher Zuverlässigkeit.\",\"items\":[{\"title\":\"PPR-ROHRSYSTEME: UNZERSTÖRBARE ADERN\",\"desc\":\"Das K Aqua PPR-System (Polypropylen Random Copolymer) ist das Rückgrat moderner Flüssigkeitstransporte. Thermisch verschmolzen zu einer homogenen Einheit, widersteht es extremen Drücken, chemischen Angriffen und thermischen Belastungen. Ein System, das nicht leckt, nicht korrodiert und Jahrzehnte überdauert.\"},{\"title\":\"FITTINGS: GEOMETRISCHE PERFEKTION\",\"desc\":\"Jeder K Aqua Fitting ist ein Meisterwerk der Strömungsmechanik. Reduzierte Kavitation, optimierte Wandstärken und exakte Toleranzen im Mikrometerbereich garantieren minimale Druckverluste und maximale Systemsicherheit. Wir überlassen den Fluss nicht dem Zufall.\"},{\"title\":\"VENTILE \u0026 ARMATUREN: ABSOLUTE KONTROLLE\",\"desc\":\"Industrielle Absperr- und Regeltechnik, die unter den härtesten Bedingungen weltweit operiert. Unsere Kugelhähne, Schrägsitzventile und Rückflussverhinderer sind auf zehntausende Zyklen ohne Leistungsabfall getestet. Maximale Dichtigkeit bei maximaler Belastung.\"},{\"title\":\"VERBUNDROHRE: DIE SYNERGIE DER MATERIALIEN\",\"desc\":\"Aluminium trifft auf Hochleistungspolymer. Die K Aqua Mehrschichtverbundrohre kombinieren die mechanische Stabilität von Metall mit der Flexibilität und chemischen Resistenz von Kunststoff. 100% sauerstoffdicht. Minimale Längenausdehnung. Die ultimative Lösung für komplexe HLK-Systeme.\"}]},\"bento\":{\"eyebrow\":\"LEISTUNGSDATEN\",\"title\":\"TECHNOLOGISCHE ÜBERLEGENHEIT. DATENGESTÜTZT.\",\"lead\":\"K Aqua Systeme sind nicht nur Rohre – sie sind Hochleistungs-Netzwerke für Flüssigkeiten. Entwickelt nach den striktesten deutschen Industrienormen.\",\"items\":[{\"title\":\"Thermische Fusion\",\"desc\":\"Homogene Schweißnähte. Das Material wird eins. Kein Kleber, keine Dichtungsringe, die versagen können. 100%ige Sicherheit gegen Leckagen auf molekularer Basis.\"},{\"title\":\"Korrosionsimmunität\",\"desc\":\"Absolut resistent gegen Lochfraß, Rost und elektrochemische Korrosion. Das transportierte Medium bleibt in seinem reinsten Zustand.\"},{\"title\":\"Strömungsoptimierung\",\"desc\":\"Glattwandtechnologie (Rauhigkeit 0,007 mm) mit minimalem Reibungskoeffizienten verhindert Ablagerungen und minimiert den Druckverlust massiv.\"},{\"title\":\"Druckresistenz PN25+\",\"desc\":\"Konstruiert für maximale Beanspruchung in Hochhäusern, Industrieanlagen und kritischer Infrastruktur. Ausgelegt für einen störungsfreien Betrieb über 50 Jahre.\"}]},\"timeline\":{\"title\":\"DER INSTALLATIONSPROZESS. NEU DEFINIERT.\",\"desc\":\"Schneller. Sicherer. Sauberer. Unser System reduziert die Installationszeit drastisch, während es Fehlerquellen auf ein Minimum reduziert. Eine Chronologie der Effizienz.\",\"items\":[{\"year\":\"PHASE 01\",\"title\":\"PLANUNG \u0026 DIMENSIONIERUNG\",\"text\":\"Exakte hydraulische Berechnung und Auslegung der Rohrdurchmesser. Vermeidung von Überdimensionierung durch überlegene Fließeigenschaften.\"},{\"year\":\"PHASE 02\",\"title\":\"ZUSCHNITT \u0026 VORBEREITUNG\",\"text\":\"Kaltes und spanloses Trennen der Rohre. Absolut saubere Schnittkanten garantieren eine perfekte Schweißvorbereitung ohne Kontaminationsrisiko.\"},{\"year\":\"PHASE 03\",\"title\":\"HEIZELEMENT-MUFFENSCHWEISSEN\",\"text\":\"Das Werkzeug erhitzt Rohr und Fitting exakt auf 260°C. In Sekunden entsteht eine molekulare Verbindung, die unlösbar ist.\"},{\"year\":\"PHASE 04\",\"title\":\"DRUCKPRÜFUNG \u0026 ABNAHME\",\"text\":\"Das System wird unter extremen Prüfdruck gesetzt. Keine Toleranz für Leckagen. K Aqua liefert 100%ige Sicherheit ab dem ersten Tropfen.\"},{\"year\":\"PHASE 05\",\"title\":\"BETRIEB FÜR JAHRZEHNTE\",\"text\":\"Wartungsfrei. Geräuscharm. Das System arbeitet im Hintergrund der modernsten Gebäude der Welt mit unerbittlicher Zuverlässigkeit.\"}]},\"sysLead\":\"Das Fundament unseres Katalogs – vier Bausteine eines integrierten Systems. Rohre, Fittings, Armaturen und Werkzeuge bilden ein System aus PP-R und PP-RCT.\"},\"pages\":{\"catalogOverview\":\"Vollständiger Produktkatalog\",\"products\":[\"Produkte \u0026 Fittings\",\"Entdecken Sie K Aquas komplette Kunststoffrohrsysteme von d20 bis d630 mm. Hochleistungsfähige PP-R und PPRCT Rohre für Haushalt und Industrie.\"],\"finder\":[\"Produktfinder\",\"Finden Sie sofort das perfekte PP-R oder PPRCT Rohr, Fitting oder Ventil. Filtern Sie unseren Katalog live nach Dimension, Druckklasse und Wandstärke.\"],\"co2\":[\"CO2-Rechner\",\"Vergleichen Sie den CO2-Fußabdruck von K Aqua PP-R Kunststoffrohren mit Kupfer, Edelstahl und PVC. Geprüft nach ISO 14040/44 für Green Building.\"],\"solutions\":[\"Materialvorteile\",\"Erfahren Sie, warum Polypropylen (PP-R/PPRCT) das überlegene Material für die Wasserversorgung ist. Ökologisch, technisch fortschrittlich und wirtschaftlich.\"],\"academy\":[\"Schweiß-Academy\",\"Lernen Sie professionelle Schweißtechniken für PP-R Kunststoffrohre. Sehen Sie sich Video-Tutorials an und absolvieren Sie unser Welding-Master-Quiz.\"],\"trust\":[\"Trust Center\",\"Greifen Sie auf K Aquas Qualitätsdokumentation zu. Laden Sie ISO-Zertifikate, das GENAU-Framework und Audit Dokumente für Ihr Projekt herunter.\"],\"service\":[\"Service \u0026 Download Center\",\"Laden Sie offizielle K Aqua Produktkataloge, technische Datenblätter und Installationsrichtlinien für PP-R und PPRCT Kunststoffrohrsysteme herunter.\"],\"partner\":[\"KESSEL Partnerschaft\",\"K Aqua und KESSEL verbindet eine jahrzehntelange Partnerschaft, die deutsche Fertigungsstandards von der Entwässerung auf die Wasserversorgung überträgt.\"],\"markets\":[\"Märkte \u0026 Vertrieb\",\"K Aqua liefert PP-R Rohrsysteme in über 27 Länder. Nutzen Sie unsere interaktive Weltkarte für lokale Standards, Wasserprofile und Logistikinformationen.\"],\"references\":[\"Referenzprojekte\",\"Entdecken Sie weltweite Referenzprojekte mit K-Aqua PP-R Rohrsystemen. Unser interaktiver 3D-Globus zeigt häusliche, gewerbliche \u0026 industrielle Anlagen.\"],\"about\":[\"Über KWT GmbH\",\"Die KWT GmbH bündelt jahrzehntelange Erfahrung, um das K Aqua Premium-Rohrsystem zu fertigen. Deutsche Ingenieurskunst für höchste Qualität und Innovation.\"],\"career\":[\"Karriere bei K Aqua\",\"Werden Sie Teil unseres Teams in Waldsolms. Berechnen Sie Ihre steuerfreien Vorteile netto und testen Sie in 60 Sekunden, ob K Aqua zu Ihnen passt.\"],\"news\":[\"Aktuelles \u0026 News | K-Aqua Unternehmensmeldungen\",\"Bleiben Sie auf dem Laufenden über K Aqua Innovationen, Produkte, Messeauftritte und unser Engagement für die dreifach ISO-geprüfte Produktion.\"],\"contact\":[\"Kontakt, Vertrieb \u0026 Support\",\"Kontaktieren Sie das K Aqua-Expertenteam für Vertriebsanfragen, Support oder Partnerschaften. Schnelle Reaktionszeiten für globale B2B-Kunden.\"],\"rfq\":[\"Projektanfrage\",\"Fordern Sie in vier einfachen Schritten ein unverbindliches Angebot für Ihr nächstes Rohrprojekt an. Unser Vertriebsteam meldet sich innerhalb von 24 Stunden.\"],\"home\":[\"PP-R \u0026 PPRCT Rohrsysteme\",\"K Aqua produziert erstklassige PP-R und PPRCT Kunststoffrohrsysteme für Trinkwasser und Industrieanwendungen. Deutsche Ingenieurskunst für globale Projekte.\"],\"legal\":{\"datenschutz\":[\"Datenschutzerklärung\",\"Umfassende Datenschutzerklärung für die K Aqua Website gemäß DSGVO-Richtlinien.\"],\"impressum\":[\"Impressum \u0026 Rechtliche Hinweise\",\"Impressum und rechtliche Unternehmensinformationen der KWT GmbH, Hersteller von K Aqua.\"]},\"genauManagement\":{\"eyebrow\":\"geprüfte Qualität\",\"title1\":\"Das \",\"titleHighlight\":\"GENAU\",\"title2\":\" Management System\",\"p1\":\"Das Ziel des GENAU Management-Systems ist die kontinuierliche Verbesserung des Arbeits-, Umwelt- und Gesundheitsschutzes im Unternehmen.\",\"p2\":\"Sämtliche Unternehmensaktivitäten bei KWT erfolgen unter Berücksichtigung von Ressourcenschonung, Umweltverträglichkeit und der strikten Einhaltung aller Verpflichtungen. Das praktizierte GENAU-Management erfüllt dabei die hohen Anforderungen der \",\"p3\":\" und \",\"list1Title\":\"Ökologische Verantwortung\",\"list1Desc\":\"Umweltschutz ist Teil unseres Qualitätsverständnisses, dem sich alle Mitarbeiter der KWT GmbH verpflichten.\",\"list2Title\":\"Energieeffizienz\",\"list2Desc\":\"Gezielte Identifikation von Risiken und Umsetzung von Maßnahmen zur Optimierung der Energieeffizienz.\"},\"pipes\":[\"Rohre \u0026 Systeme\",\"Hochleistungsfähige PP-R und PP-RCT Rohre für Haushalt und Industrie.\"],\"fittings\":[\"Formteile \u0026 Fittings\",\"Komplettes Sortiment an Formteilen für alle K-Aqua Rohrsysteme.\"],\"valves\":[\"Armaturen \u0026 Ventile\",\"Premium-Armaturen und Zubehör für Rohrleitungsnetze.\"],\"tools\":[\"Werkzeuge \u0026 Zubehör\",\"Professionelle Schweißwerkzeuge und Zubehör für die PP-R Installation.\"],\"transition-fittings\":[\"Übergänge\",\"Zuverlässige Übergangsformteile für sichere Verbindungen.\"]},\"groups\":{\"tools\":\"Werkzeuge\",\"knowledge\":\"Wissen\",\"company\":\"Unternehmen\",\"products\":\"Produkte\",\"markets_solutions\":\"Märkte \u0026 Lösungen\",\"knowledge_resources\":\"Wissen \u0026 Ressourcen\"},\"productsx\":{\"pipesEyebrow\":\"Rohrprogramm\",\"pipesTitle\":\"Drei Rohrfamilien, ein Systemgedanke.\",\"pipesLead\":\"Monolayer, PPRCT und glasfaserverstärkter Faserverbund — plus UV-stabilisierte Ausführungen für Anwendungen im Freien.\",\"pipes\":[{\"t\":\"K-Pipe PP-R Monolayer\",\"d\":\"Der bewährte Standard für Trinkwasser heiß und kalt. Einschichtiger Aufbau, volle SDR-Bandbreite in den gängigen Dimensionen — wirtschaftlich für Wohn- und Objektbau.\",\"tags\":[\"d20–d630\",\"SDR 6–17\"]},{\"t\":\"K-Pipe PPRCT\",\"d\":\"Modifizierte Kristallstruktur für mehr Temperatur- und Druckreserve: SDR 7,4 ist für 70 °C Dauerbetrieb bei 10 bar (1,0 MPa) ausgelegt — die Wahl für Warmwasser und Zirkulation.\",\"tags\":[\"70 °C · 10 bar\",\"Warmwasser\"]},{\"t\":\"K-Fiber Pipe (GF-Multilayer)\",\"d\":\"Glasfaserverstärkter Kern zwischen zwei PP-Schichten: Wärmeausdehnung auf rund ein Viertel reduziert, größere Schellenabstände, formstabil bis d630 — bis 20 bar (2,0 MPa) bei 20 °C in SDR 6.\",\"tags\":[\"GF-Kern\",\"d20–d630\"]},{\"t\":\"UV-stabilisierte Ausführung\",\"d\":\"Für Installationen mit Sonnenexposition — etwa Gewächshäuser oder Freileitungen — ist das Programm in UV-beständiger Ausführung verfügbar.\",\"tags\":[\"Außenbereich\",\"Agrar\"]}],\"dimEyebrow\":\"Dimensionstabellen\",\"dimTitle\":\"Jede Dimension, jede Wandstärke.\",\"dimLead\":\"Wählen Sie die Druckstufe — die Tabelle zeigt alle lieferbaren Dimensionen mit Wandstärke, Innendurchmesser, Nenndruck, Wasserinhalt und Metergewicht.\",\"dimTabAria\":\"Druckstufe wählen\",\"dimHead\":[\"d (mm)\",\"Wand s (mm)\",\"di (mm)\",\"Nenndruck\",\"Wasserinhalt (l/m)\",\"Gewicht (kg/m)\"],\"dimNote\":\"Rechenwerte aus der SDR-Geometrie (s = d/SDR, Dichte 0,905 g/cm³) nach den Reihen der DIN 8077. Verbindlich sind Produktkatalog und projektspezifische Datenblätter.\",\"anchorsTitle\":\"Verbindliche Auslegungsanker aus dem Programm\",\"anchors\":[{\"v\":\"20 bar\",\"t\":\"K-Fiber Pipe PP-R · SDR 6\",\"c\":\"2,0 MPa Dauerbetrieb bei 20 °C — Kaltwasser über den 50-Jahre-Auslegungshorizont.\"},{\"v\":\"10 bar\",\"t\":\"K-Pipe PPRCT · SDR 7,4\",\"c\":\"1,0 MPa Dauerbetrieb bei 70 °C — Warmwasser und Zirkulation ohne Reserveverlust.\"}],\"matEyebrow\":\"Werkstoffdaten\",\"matTitle\":\"Was den Werkstoff auszeichnet.\",\"matLead\":\"Die wichtigsten Kennwerte des PP-R/PPRCT-Systems — und warum sie in der Planung zählen.\",\"matHead\":[\"Eigenschaft\",\"Wert\",\"Bedeutung für Ihr Projekt\"],\"matRows\":[[\"Dichte\",\"0,905 g/cm³\",\"Rund ein Zehntel von Kupfer — leichter Transport, einfache Montage ohne Hebezeug bei kleinen und mittleren Dimensionen.\"],[\"Innenrauheit\",\"0,007 mm\",\"Extrem glatte Oberfläche: minimaler Druckverlust, kaum Inkrustation und Biofilm-Bildung.\"],[\"Wärmeleitfähigkeit\",\"0,24 W/(m·K)\",\"Geringe Wärmeverluste in der Warmwasser-Zirkulation — dauerhafte Energieeinsparung gegenüber Metall.\"],[\"Längenausdehnung (Monolayer)\",\"≈ 0,15 mm/(m·K)\",\"Wird konstruktiv über Dehnungsschenkel und Fixpunkte aufgenommen.\"],[\"Längenausdehnung (K-Fiber, GF)\",\"≈ 0,04 mm/(m·K)\",\"Rund ein Viertel des Monolayer-Werts — größere Schellenabstände, ruhigeres Leitungsbild.\"],[\"Medientemperatur\",\"kalt bis 70 °C Dauerbetrieb\",\"Trinkwasser heiß und kalt; Auslegungsanker: PPRCT SDR 7,4 bei 70 °C · 10 bar.\"],[\"Chemische Beständigkeit\",\"Lösungsmittel, Laugen, Säuren\",\"Als technischer Kunststoff ungewöhnlich beständig — korrosionsfrei ohne Lochfraß-Risiko.\"],[\"Recycling\",\"Code 5 (PP)\",\"Sortenrein trennbar; 100 % der Produktionsabfälle gehen zurück in den Wertstoffkreislauf.\"]],\"fitEyebrow\":\"Formteile \u0026 Systemkomponenten\",\"fitTitle\":\"Das System um das Rohr herum.\",\"fitLead\":\"Formteile von d20 bis d315, Armaturen, Übergänge und die komplette Schweißtechnik — alles aus einer Hand, alles systemkompatibel.\",\"fitGroups\":[{\"t\":\"Formteile d20–d315\",\"items\":[\"Winkel 90° und 45°\",\"T-Stücke, auch reduziert\",\"Muffen und Überschiebmuffen\",\"Reduzierungen\",\"Endkappen\"]},{\"t\":\"Übergänge \u0026 Verschraubungen\",\"items\":[\"Übergangsstücke mit Messing-Innengewinde\",\"Übergangsstücke mit Messing-Außengewinde\",\"Verschraubungen (lösbar)\",\"Anschluss an Bestandsleitungen aus Metall\"]},{\"t\":\"Armaturen\",\"items\":[\"Ventile\",\"Kugelhähne\",\"Absperrungen für Steig- und Verteilleitungen\"]},{\"t\":\"Schweißtechnik \u0026 Werkzeug\",\"items\":[\"Handschweißgeräte (bis d63)\",\"Muffenschweißmaschinen\",\"Elektroschweißgeräte\",\"Stumpfschweißmaschinen für Großdimensionen\",\"Rohrschneider und Schneidwerkzeuge\"]}],\"normEyebrow\":\"Normen \u0026 Nachweise\",\"normTitle\":\"Geprüft gegen die Regelwerke.\",\"normLead\":\"Das K Aqua-System wird gegen die einschlägigen Normen der Rohrleitungstechnik gefertigt und geprüft — jede Charge unter ISO-9001-Qualitätsauflagen.\",\"normHead\":[\"Norm\",\"Titel\",\"Bedeutung\"],\"norms\":[[\"DIN 8077\",\"Rohre aus Polypropylen — Maße\",\"Definiert Durchmesser- und Wandstärkenreihen (SDR) für PP-Rohre.\"],[\"DIN 8078\",\"Rohre aus Polypropylen — Anforderungen\",\"Allgemeine Güteanforderungen und Prüfungen für PP-R/PPRCT-Rohre.\"],[\"DIN EN ISO 15874\",\"Kunststoffrohrleitungssysteme\",\"Systemnorm für Warm- und Kaltwasserinstallationen aus Polypropylen.\"],[\"DVS 2207-11\",\"Schweißen von PP\",\"Richtwerte für Muffen-, Elektro- und Stumpfschweißen — Basis der Academy-Inhalte.\"],[\"DVGW / KTW\",\"Trinkwasserkontakt\",\"Konformitätsnachweise für den Kontakt mit Trinkwasser — im Trust Center anforderbar.\"],[\"EN 15804\",\"EPD (Typ III)\",\"Umweltproduktdeklarationen als Datenbasis für LEED, BREEAM und DGNB.\"],[\"ISO 9001 / 14001 / 50001\",\"Managementsysteme\",\"Qualität, Umwelt und Energie — dreifach geprüft seit Oktober 2025, DAkkS-akkreditiert.\"],[\"GENAU\",\"Integriertes Managementsystem\",\"Das hauseigene System im House of KWT verbindet Arbeitsschutz, Umwelt und Energie im Alltag.\"]],\"faqEyebrow\":\"Häufige Fragen\",\"faqTitle\":\"Antworten für Planung und Einkauf.\",\"faq\":[{\"q\":\"Für welche Medien ist das System ausgelegt?\",\"a\":\"Für Trinkwasser — heiß und kalt — mit hoher Temperatur- und Druckbeständigkeit über Jahrzehnte. Durch die Beständigkeit von PP gegen Lösungsmittel, Laugen und Säuren sind auch Industrieanwendungen möglich; diese prüfen wir projektspezifisch mit Ihnen.\"},{\"q\":\"Wofür stehen die fünf SDR-Klassen?\",\"a\":\"SDR ist das Verhältnis von Außendurchmesser zu Wandstärke (d/s). Kleiner SDR = dickere Wand = höherer Nenndruck: SDR 6 entspricht PN 20, SDR 17 entspricht PN 6. So wählen Sie je Anwendung genau die Reserve, die Sie brauchen — ohne Überdimensionierung.\"},{\"q\":\"Wann Monolayer, wann K-Fiber?\",\"a\":\"Monolayer ist der wirtschaftliche Standard für die meisten Anwendungen. Der glasfaserverstärkte Faserverbund reduziert die Wärmeausdehnung auf rund ein Viertel, erlaubt größere Schellenabstände und bleibt bei Großdimensionen und Heißwasser formstabil — die Wahl für Steigstränge, Zirkulation und d ≥ 160.\"},{\"q\":\"Wie werden die Rohre verbunden?\",\"a\":\"Stoffschlüssig durch Schweißen — Muffenschweißen von Hand (bis d63) oder mit Maschine, Elektroschweißen über Heizwendelfittings und Stumpfschweißen für Großdimensionen bis d630. Die passenden Geräte und Werkzeuge gehören zum Programm; alle vier Verfahren zeigt die Academy im Video.\"},{\"q\":\"Ist das System trinkwasserkonform?\",\"a\":\"Das System ist für Trinkwasser entwickelt; Polypropylen ist geschmacks- und geruchsneutral. Die Konformitätsnachweise für den Trinkwasserkontakt (DVGW/KTW) stellen wir im Trust Center als Teil des RFP-Dokumentenpakets bereit.\"},{\"q\":\"Welche Lebensdauer liegt der Auslegung zugrunde?\",\"a\":\"Die Druckstufen basieren auf den Zeitstand-Regressionskurven der DIN 8077/8078 mit einem Auslegungshorizont von 50 Jahren Betriebsdauer — inklusive Sicherheitsfaktor. Die beiden Programm-Anker: SDR 6 mit 20 bar bei 20 °C und PPRCT SDR 7,4 mit 10 bar bei 70 °C.\"},{\"q\":\"Wo bekomme ich verbindliche Artikeldaten?\",\"a\":\"Im Produktfinder filtern Sie alle Varianten live und exportieren sie als CSV. Verbindliche Werte liefert der Produktkatalog (PDF); für Projektkonditionen führt die Projektanfrage in fünf Schritten direkt zum Vertrieb — Antwort innerhalb eines Werktags.\"}]},\"catalogx\":{\"eyebrow\":\"Vollständiger Produktkatalog\",\"faqTitle\":\"Häufig gestellte Fragen\",\"title\":\"Alle 79 Artikelfamilien — mit echten Artikelnummern.\",\"lead\":\"Rohre, Formteile, Übergangsfittings, Armaturen, Einschweißsattel, Zubehör und Werkzeuge — jede Zeile stammt aus dem verbindlichen K Aqua Katalog. Kategorie wählen, Artikel aufklappen, Artikelnummer prüfen.\",\"searchPlaceholder\":\"Artikelnummer oder Produktname suchen — z. B. „AQ200P20\\\" oder „Elbow\\\"\",\"noResults\":\"Keine Treffer — Suche anpassen oder andere Kategorie wählen.\",\"codesLabel\":\"Artikelnummern\",\"sizesLabel\":\"Größen\",\"materialLabel\":\"Material\",\"sdrLabel\":\"SDR\",\"seriesLabel\":\"Baureihe\",\"pressureLabel\":\"Betriebsdruck\",\"lenLabel\":\"Stablänge\",\"cats\":{\"pipes\":{\"label\":\"Rohre\",\"desc\":\"PPR und PPRCT Rohre — Standard, faserverstärkt und UV-stabilisiert, 12 Baureihen.\"},\"fittings\":{\"label\":\"Formteile\",\"desc\":\"Muffenschweiß und Elektroschweißformteile, d20–d125, 13 Artikelfamilien.\"},\"transitionFittings\":{\"label\":\"Übergangsfittings\",\"desc\":\"Übergänge auf Gewinde und Messing — für Bestandsanschlüsse und Armaturen, 13 Familien.\"},\"valves\":{\"label\":\"Armaturen\",\"desc\":\"Kugelhähne, Unterputzventile, Verteilerbatterien — 9 Artikelfamilien.\"},\"weldInSaddles\":{\"label\":\"Einschweißsattel\",\"desc\":\"Abzweige ohne Rohrtrennung — mit und ohne Gewinde, 3 Familien.\"},\"accessories\":{\"label\":\"Zubehör\",\"desc\":\"Rohrschellen, Gegenflansche, Dichtungen, Stopfen — 5 Artikelfamilien.\"},\"tools\":{\"label\":\"Werkzeuge\",\"desc\":\"Rohrschneider, Schweißgeräte und -werkzeuge für alle vier Fügeverfahren, 14 Familien.\"}},\"rfq\":{\"title\":\"Projektanfrage\",\"desc\":\"Fordern Sie direkt ein Angebot für \u003cstrong\u003e{title}\u003c/strong\u003e an.\",\"button\":\"Zur Anfrage\"},\"similar\":{\"title\":\"Weitere aus {category}\"},\"items\":{\"k-pipe-pp-r-sdr-6\":{\"seo_p1\":\"$2e\",\"seo_p2\":\"$2f\",\"seo_p3\":\"$30\",\"faq\":[{\"q\":\"Welche Lebensdauer bietet das K-Pipe PP-R SDR 6 Rohr in der Praxis?\",\"a\":\"Bei fachgerechter Installation und strikter Einhaltung der empfohlenen Betriebsbedingungen in Bezug auf Temperatur und Druck bietet das Rohr eine nachgewiesene Lebensdauer von weit über 50 Jahren. Es ist absolut korrosionsfrei und sehr widerstandsfähig.\"},{\"q\":\"Ist dieses System wirklich 100% sicher für Trinkwasser?\",\"a\":\"Ja, absolut. Das Rohr besteht vollständig aus lebensmittelechtem PP-R Material und ist komplett geruchs- und geschmacksneutral. Es erfüllt sämtliche strengen hygienischen Standards und internationalen Normen für Trinkwasserinstallationen weltweit ohne Kompromisse.\"},{\"q\":\"Wie erfolgt die Verbindungstechnik bei diesen speziellen Rohren?\",\"a\":\"Die Verbindung erfolgt durch das zuverlässige Heizelement-Muffenschweißen (Polyfusionsschweißen). Dabei werden das Rohr und der Fitting kurzzeitig exakt erhitzt und passgenau ineinandergesteckt. Es entsteht eine dauerhafte, stoffschlüssige und 100 % leckagefreie Verbindung ohne zusätzliche Dichtungen.\"}]},\"k-pipe-pp-rct-sdr-74\":{\"seo_p1\":\"$31\",\"seo_p2\":\"$32\",\"seo_p3\":\"$33\",\"faq\":[{\"q\":\"Was ist der Hauptunterschied zwischen PP-R und PP-RCT?\",\"a\":\"PP-RCT besitzt eine veränderte, optimierte Kristallstruktur, die dem Material eine höhere Festigkeit und Temperaturresistenz verleiht. Dadurch können die Rohrwandungen bei gleicher Druckbelastbarkeit dünner ausgelegt werden, was einen höheren Wasserdurchfluss und Materialersparnis ermöglicht.\"},{\"q\":\"Für welche Temperaturen und Drücke ist das SDR 7.4 PP-RCT Rohr zugelassen?\",\"a\":\"Das Rohr ist für eine dauerhafte Belastung von 20 bar (2.0 MPa) bei 20 °C Kaltwasser und für 10 bar (1.0 MPa) bei 70 °C Warmwasser ausgelegt, wodurch es sich perfekt für alle standardmäßigen Sanitär- und Heizungsanwendungen eignet.\"},{\"q\":\"Ist das Rohr kompatibel mit Standard-Fittings?\",\"a\":\"Ja, das K-Pipe PP-RCT SDR 7.4 Rohr wird genau wie herkömmliche PP-R Rohre durch Polyfusionsschweißen verbunden und ist in der Regel vollständig kompatibel mit den entsprechenden Fittings für dasselbe Außendurchmesser-Maß, was die Systemintegration extrem vereinfacht.\"}]},\"k-pipe-pp-r-sdr-11\":{\"seo_p1\":\"$34\",\"seo_p2\":\"$35\",\"seo_p3\":\"$36\",\"faq\":[{\"q\":\"Wofür eignet sich das K-Pipe PP-R SDR 11 Rohr am besten?\",\"a\":\"Dieses Rohr ist primär für Kaltwasserinstallationen, Brauch- und Regenwassernutzungsanlagen, Kühlwassersysteme, Druckluftleitungen sowie für Heizanwendungen mit niedrigem Druck konzipiert, bei denen ein Nenndruck von 12 bar (bei 20°C) ausreichend ist.\"},{\"q\":\"Kann das SDR 11 Rohr auch für Warmwasser genutzt werden?\",\"a\":\"Grundsätzlich ja, allerdings ist die Belastungsgrenze hier bei 60 °C und 0.6 MPa (6 bar) festgelegt. Für typische Warmwasserleitungen mit höheren Drücken und Temperaturen empfehlen wir die robusteren SDR 6 oder SDR 7.4 Rohre.\"},{\"q\":\"Wie wirkt sich die geringere Wandstärke auf die Installation aus?\",\"a\":\"Die geringere Wandstärke macht das Rohr leichter und flexibler, was den Transport und die Handhabung vereinfacht. Gleichzeitig bietet es einen größeren Innendurchmesser, was die Durchflussmenge erhöht und Druckverluste im System verringert.\"}]},\"k-pipe-purple-pp-r-sdr-11\":{\"seo_p1\":\"$37\",\"seo_p2\":\"$38\",\"seo_p3\":\"$39\",\"faq\":[{\"q\":\"Warum ist das K-Pipe Purple Rohr violett eingefärbt?\",\"a\":\"Die violette Farbe dient als internationale Sicherheitskennzeichnung für Leitungen, die kein Trinkwasser führen (z.B. Regenwasser, Grauwasser, Betriebswasser). Dies verhindert lebensgefährliche Verwechslungen und Fehlanschlüsse an das saubere Trinkwassernetz.\"},{\"q\":\"Verfügt das violette Rohr über die gleichen Eigenschaften wie das grüne oder graue PP-R Rohr?\",\"a\":\"Ja, absolut. Technisch, mechanisch und chemisch ist das K-Pipe Purple SDR 11 Rohr identisch mit unserem Standard K-Pipe PP-R SDR 11. Lediglich die Farbpigmente wurden zur eindeutigen optischen Identifikation angepasst.\"},{\"q\":\"Wie werden die violetten Rohre bei der Installation miteinander verbunden?\",\"a\":\"Die Verbindung erfolgt exakt gleich wie bei allen anderen PP-R Rohren durch das Polyfusionsschweißen (Muffenschweißen). Dabei entsteht unter Hitzeeinwirkung eine dauerhaft dichte, stoffschlüssige und extrem stabile Verbindung ohne zusätzliche Dichtmittel.\"}]},\"k-fiber-pipe-pp-rct-sdr-74\":{\"seo_p1\":\"$3a\",\"seo_p2\":\"$3b\",\"seo_p3\":\"$3c\",\"faq\":[{\"q\":\"Was ist der größte Vorteil der Glasfaser-Mittelschicht bei diesem Rohr?\",\"a\":\"Die Glasfaserschicht reduziert die thermische Längenausdehnung des Rohres bei heißem Wasser um bis zu 75 %. Dadurch hängt das Rohr nicht durch, benötigt deutlich weniger Befestigungsschellen und spart wertvolle Installationszeit und Kompensatoren.\"},{\"q\":\"Muss das Faserrohr vor dem Schweißen an den Enden geschält werden?\",\"a\":\"Nein, einer der großen Vorteile der K-Fiber Pipe Technologie ist, dass das Rohr direkt ohne vorheriges Schälen oder Anspitzen mit der Standard-Polyfusionsschweißtechnik verschweißt werden kann, was die Montage erheblich beschleunigt.\"},{\"q\":\"Ist das Rohr für den Transport von heißem Trinkwasser zugelassen?\",\"a\":\"Ja, das System besteht aus lebensmittelechtem PP-RCT, erfüllt alle internationalen Trinkwassernormen und eignet sich hervorragend für Warmwasserleitungen, da es hohem Druck und hohen Temperaturen bei geringer Ausdehnung standhält.\"}]},\"k-fiberclima-pipe-pp-rct-sdr-11\":{\"seo_p1\":\"$3d\",\"seo_p2\":\"$3e\",\"seo_p3\":\"$3f\",\"faq\":[{\"q\":\"Warum ist dieses Rohr speziell für Klimaanlagen und Kaltwasser geeignet?\",\"a\":\"Das K-Fiberclima Pipe bietet eine hervorragende thermische Isolierung, was Energieverluste beim Kältetransport reduziert und die Kondenswasserbildung verringert. Zudem ist es absolut korrosionsfrei, was bei Kondenswasser und stark wechselnden Temperaturen extrem wichtig ist.\"},{\"q\":\"Wie wirkt sich die Glasfaserschicht auf die Rohrverlegung aus?\",\"a\":\"Die Glasfaserschicht minimiert die temperaturbedingte Längenänderung des Rohres stark. Dadurch bleibt das Rohr auch über weite Strecken und bei Temperaturschwankungen formstabil, hängt nicht durch und benötigt deutlich weniger Befestigungspunkte.\"},{\"q\":\"Darf dieses System auch für herkömmliche Warmwasserheizungen genutzt werden?\",\"a\":\"Ja, absolut. Es ist für Temperaturen bis 70°C bei 8 bar Druck freigegeben. Daher eignet es sich nicht nur für Kaltwasser, sondern auch hervorragend für klassische Heizkörperanbindungen, Fußbodenheizungen und Wärmepumpensysteme.\"}]},\"k-fiber-pipe-pp-r-sdr-74\":{\"seo_p1\":\"$40\",\"seo_p2\":\"$41\",\"seo_p3\":\"$42\",\"faq\":[{\"q\":\"Was bewirkt die Glasfaserschicht im K-Fiber Pipe PP-R SDR 7.4?\",\"a\":\"Die Glasfaserarmierung sorgt für eine drastisch reduzierte Längenausdehnung bei Temperaturschwankungen (bis zu 75% weniger im Vergleich zu Standard-Kunststoffrohren) und verleiht dem Rohr eine sehr hohe Formstabilität, was besonders bei Warmwasser und Heizung wichtig ist.\"},{\"q\":\"Muss dieses Faserrohr vor dem Schweißen speziell vorbereitet werden?\",\"a\":\"Nein, ein großer Vorteil ist, dass das Faserrohr exakt wie ein normales PP-R Rohr verarbeitet werden kann. Ein aufwendiges Schälen oder Anspitzen der Rohrenden ist vor dem Polyfusionsschweißen absolut nicht erforderlich.\"},{\"q\":\"Ist das SDR 7.4 Rohr für Hochdruck-Heizungsanlagen geeignet?\",\"a\":\"Ja, es ist für 25 bar bei 20°C und 12 bar bei 60°C zugelassen, was es extrem widerstandsfähig und ideal für anspruchsvolle Heizungssysteme sowie industrielle Druckleitungen macht.\"}]},\"k-fiber-pipe-pp-r-sdr-9\":{\"seo_p1\":\"$43\",\"seo_p2\":\"$44\",\"seo_p3\":\"$45\",\"faq\":[{\"q\":\"Wann sollte ich mich für das SDR 9 Rohr anstelle des SDR 7.4 entscheiden?\",\"a\":\"Das SDR 9 Rohr bietet eine etwas dünnere Wandstärke als das SDR 7.4. Es ist ideal, wenn Sie einen größeren Innendurchmesser für mehr Wasserdurchfluss benötigen, der maximale Systemdruck jedoch 20 bar (bei 20°C) nicht überschreitet.\"},{\"q\":\"Hängt das SDR 9 Faserrohr bei heißem Wasser durch?\",\"a\":\"Nein, dank der integrierten Glasfaser-Mittelschicht ist das Rohr extrem formstabil und weist eine stark reduzierte Längenausdehnung auf. Ein unschönes Durchhängen wird bei korrekter Anordnung der Befestigungsschellen sicher vermieden.\"},{\"q\":\"Wie umweltfreundlich ist das K-Fiber Pipe System?\",\"a\":\"Sehr umweltfreundlich. Polypropylen (PP-R) benötigt bei der Herstellung weniger Energie als Metalle, gibt keine giftigen Stoffe ab und ist am Ende seiner langen Lebensdauer zu 100 % recycelbar, was es zu einem nachhaltigen Baustoff macht.\"}]},\"k-fiber-pipe-pp-r-sdr-11\":{\"seo_p1\":\"$46\",\"seo_p2\":\"$47\",\"seo_p3\":\"$48\",\"faq\":[{\"q\":\"Was sind die Hauptanwendungsgebiete für das SDR 11 Faserrohr?\",\"a\":\"Es wird primär für Kaltwassersysteme, Klimakaltwasser, Regenwassernutzungsanlagen, Druckluftleitungen und industrielle Kühlkreisläufe verwendet, bei denen ein großer Innendurchmesser und hohe Formstabilität gefordert sind.\"},{\"q\":\"Ist das SDR 11 Rohr genauso formstabil wie das SDR 7.4 Rohr?\",\"a\":\"Ja, durch die integrierte Glasfaserschicht weist auch das SDR 11 Rohr eine extrem geringe thermische Längenausdehnung auf und ist sehr biegeweich, was ein sauberes, durchhangfreies Verlegebild garantiert.\"},{\"q\":\"Kann ich für das SDR 11 Rohr die gleichen Fittings verwenden?\",\"a\":\"Ja, Sie können die standardmäßigen K-Pipe PP-R Fittings für den entsprechenden Außendurchmesser verwenden. Die Verbindung erfolgt identisch und völlig problemlos über das Polyfusionsschweißverfahren.\"}]},\"k-fiber-pipe-pp-r-sdr-17\":{\"seo_p1\":\"$49\",\"seo_p2\":\"$4a\",\"seo_p3\":\"$4b\",\"faq\":[{\"q\":\"Für welche speziellen Projekte ist das großdimensionierte SDR 17 Rohr gedacht?\",\"a\":\"Es ist speziell für große Infrastrukturprojekte, industrielle Prozesswassernetze, kommunale Hauptversorgungsleitungen und zentrale Klimasysteme konzipiert, bei denen riesige Wassermengen (große Durchmesser) bei moderaten Drücken transportiert werden müssen.\"},{\"q\":\"Wie werden solch große Kunststoffrohre (z.B. 160 mm oder 200 mm) sicher miteinander verbunden?\",\"a\":\"Große Durchmesser werden üblicherweise durch Heizelement-Stumpfschweißung oder mittels Elektroschweißmuffen verbunden. Beide Verfahren erzeugen eine extrem sichere, homogene und dauerhaft leckagefreie Materialverbindung ohne separate Dichtungen.\"},{\"q\":\"Ist das SDR 17 System günstiger als vergleichbare Rohre aus Stahl oder Gusseisen?\",\"a\":\"Ja, die Gesamtkosten sind deutlich niedriger. Das Material selbst ist wirtschaftlich, es rostet nicht (keine teuren Beschichtungen nötig), ist leichter (günstigerer Transport und Montage) und die Schweißverbindung geht viel schneller als metallisches Schweißen.\"}]},\"k-fiber-uv-pipe-pp-r-sdr-74\":{\"seo_p1\":\"$4c\",\"seo_p2\":\"$4d\",\"seo_p3\":\"$4e\",\"faq\":[{\"q\":\"Warum muss ich für Außeninstallationen unbedingt das K-Fiber UV Pipe verwenden?\",\"a\":\"Normale Kunststoffrohre werden durch UV-Strahlen (Sonnenlicht) mit der Zeit spröde und können brechen. Das UV Pipe hat eine spezielle, dauerhafte Schutzschicht, die das Rohr vor Sonnenlicht schützt und eine jahrzehntelange Lebensdauer im Freien garantiert.\"},{\"q\":\"Muss das UV-Rohr vor dem Verschweißen noch geschält oder vorbereitet werden?\",\"a\":\"Nein, das Rohr kann direkt und unkompliziert mit der Standard-Polyfusionsschweißung (Heizelement-Muffenschweißung) verarbeitet werden. Ein vorheriges Schälen der speziellen UV-Außenschicht ist nicht erforderlich.\"},{\"q\":\"Verhindert die Glasfaserschicht das Durchhängen des Rohres bei starker Sonnenhitze?\",\"a\":\"Ja, extrem effektiv. Die Glasfaserschicht verringert die hitzebedingte Ausdehnung um bis zu 75%. Dadurch bleibt das Rohr auch bei starker Sonneneinstrahlung und heißen Außentemperaturen absolut gerade und hängt zwischen den Befestigungsschellen nicht unschön durch.\"}]},\"k-fiber-uv-pipe-pp-rct-sdr-74\":{\"seo_p1\":\"$4f\",\"seo_p2\":\"$50\",\"seo_p3\":\"$51\",\"faq\":[{\"q\":\"Was ist der exakte Unterschied zwischen PP-R UV und PP-RCT UV?\",\"a\":\"PP-RCT besitzt eine veränderte Kristallstruktur, die das Material bei hohen Temperaturen deutlich druckbeständiger macht. Das PP-RCT UV Rohr ist daher für Außeninstallationen mit sehr heißen Medien (z.B. Solaranlagen, heißes Kühlwasser) besser geeignet und hält höhere Drücke bei hohen Temperaturen aus.\"},{\"q\":\"Brauche ich für dieses System noch zusätzliche Schutzanstriche gegen die Sonne?\",\"a\":\"Nein, definitiv nicht. Die co-extrudierte, UV-stabilisierte Außenschicht bietet einen dauerhaften, lebenslangen Schutz gegen schädliche UV-Strahlung. Zusätzliche Anstriche oder Schutzummantelungen sind absolut überflüssig, was massiv Zeit und Geld spart.\"},{\"q\":\"Wie wird das K-Fiber UV PP-RCT System sicher montiert?\",\"a\":\"Die Montage erfolgt schnell und sicher mittels Heizelement-Muffenschweißung (Polyfusionsschweißen) mit kompatiblen Fittings. Ein vorheriges Schälen der Rohrenden ist dank der innovativen Materialkombination nicht erforderlich, was den Montageprozess auf der Baustelle extrem beschleunigt.\"}]},\"cap\":{\"seo_p1\":\"Die Endkappe (Cap) ist ein unverzichtbares Formteil innerhalb unserer Fittings-Kategorie, das für den dauerhaften und sicheren Abschluss von Leitungsenden konzipiert wurde.\",\"seo_p2\":\"Gefertigt aus hochwertigem PP-R-Material, entspricht die Kappe den gängigen SDR-Klassen der Rohre und bietet höchste Druckbeständigkeit sowie Maßgenauigkeit für eine homogene Verschweißung.\",\"seo_p3\":\"Sie eignet sich optimal für die endgültige oder vorübergehende Stilllegung von Rohrsträngen in Trinkwasser- und Heizungsnetzen, wobei eine absolut leckagefreie und wartungsfreie Abdichtung garantiert wird.\",\"faq\":[{\"q\":\"Kann die Endkappe für eine Druckprüfung genutzt werden?\",\"a\":\"Ja, nach ordnungsgemäßer Verschweißung und Abkühlung hält die Endkappe dem vollen Prüfdruck des Systems (bis zu 30 Bar) problemlos stand.\"},{\"q\":\"Wie verschließe ich temporäre Leitungen?\",\"a\":\"Für temporäre Absperrungen empfehlen wir Stopfen mit Gewinde; die Endkappe wird homogen verschweißt und ist somit für den permanenten Verschluss gedacht.\"},{\"q\":\"Ist die Endkappe bei allen Temperaturen dicht?\",\"a\":\"Durch die thermische Verschmelzung gibt es keine unterschiedlichen Ausdehnungskoeffizienten, wodurch sie von 0°C bis 95°C absolut leckagefrei bleibt.\"}]},\"socket\":{\"seo_p1\":\"Die Muffe (Socket) ist das grundlegende Verbindungselement unserer Fittings, entwickelt für die einfache und zuverlässige Verlängerung von geraden Rohrstrecken.\",\"seo_p2\":\"Aus robustem PP-R gefertigt, stellt dieses Formteil durch Muffenschweißung eine stoffschlüssige und extrem druckfeste Verbindung her, die perfekt auf unsere SDR-Rohrserien abgestimmt ist.\",\"seo_p3\":\"Ob im privaten Sanitärbereich oder im industriellen Anlagenbau – die Muffe sorgt für einen nahtlosen Durchfluss ohne Querschnittsverengung und verhindert langfristige Druckverluste.\",\"faq\":[{\"q\":\"Wie tief muss das Rohr in die Muffe eingeführt werden?\",\"a\":\"Die Einstecktiefe ist in unseren technischen Richtlinien exakt definiert und sollte zur Vermeidung von Querschnittsverengungen auf dem Rohr markiert werden.\"},{\"q\":\"Können Muffen auch für Faserrohre verwendet werden?\",\"a\":\"Ja, unsere Standard-Muffen sind für alle K Aqua PP-R, PPRCT und Faserrohre uneingeschränkt kompatibel.\"},{\"q\":\"Besteht die Gefahr von Mikroleckagen an der Naht?\",\"a\":\"Nein, da durch die Polyfusion eine stoffschlüssige, molekulare Verbindung entsteht, die so stark wie das Rohr selbst ist.\"}]},\"elbow-45\":{\"seo_p1\":\"Der 45°-Winkel (Elbow 45°) ermöglicht schonende Richtungsänderungen im Leitungsverlauf und gehört zu unseren am häufigsten verwendeten Fittings.\",\"seo_p2\":\"Dank präzisem Spritzguss aus langlebigem PP-R garantiert der Winkel eine perfekte Kompatibilität mit allen K Aqua Rohrsystemen und hält höchsten Systemdrücken stand.\",\"seo_p3\":\"Besonders bei komplexen Leitungsführungen in engen Schächten oder bei der Umgehung von Hindernissen reduziert dieser 45-Grad-Winkel Strömungswiderstände effektiv.\",\"faq\":[{\"q\":\"Wann sollte ich einen 45-Grad- anstelle eines 90-Grad-Winkels verwenden?\",\"a\":\"Ein 45-Grad-Winkel reduziert den Druckverlust und den Strömungswiderstand (Zeta-Wert) im System deutlich und beugt Geräuschentwicklung vor.\"},{\"q\":\"Sind K Aqua Winkel strömungsoptimiert?\",\"a\":\"Ja, die Innenradien unserer 45-Grad-Winkel sind extrem glatt und hydraulisch optimiert, um Kavitation zu verhindern.\"},{\"q\":\"Können zwei 45-Grad-Winkel zu einem 90-Grad-Bogen kombiniert werden?\",\"a\":\"Ja, diese Praxis wird oft bei großen Dimensionen angewendet, um weite Bögen zu kreieren und den Pumpenwiderstand zu senken.\"}]},\"elbow-45-femalemale\":{\"seo_p1\":\"Der 45°-Winkel mit Innen-/Außenschweißende (Elbow 45° Female/Male) bietet maximale Flexibilität bei beengten Platzverhältnissen und direkten Anschlusskombinationen.\",\"seo_p2\":\"Das PP-R Formteil verfügt über ein Muffenende und ein Spitzende, was eine direkte Verschweißung mit anderen Fittings ohne ein zusätzliches Rohrstück ermöglicht.\",\"seo_p3\":\"In der kompakten Verteilerinstallation oder beim Bau von engen Vorwandsystemen spart dieses Bauteil wertvolle Montagezeit und reduziert die Anzahl der Schweißstellen.\",\"faq\":[{\"q\":\"Erhöht ein 90-Grad-Winkel den Verschleiß durch Strömungsdruck?\",\"a\":\"Dank der Wandstärkenreserven und der extrem glatten Innenflächen des PP-R Materials ist Verschleiß durch Abrasion praktisch ausgeschlossen.\"},{\"q\":\"Gibt es Richtungsmarkierungen auf den K Aqua Winkeln?\",\"a\":\"Ja, unsere Formteile weisen oft Produktionsmarkierungen auf, die bei der exakten axialen Ausrichtung auf der Baustelle helfen.\"},{\"q\":\"Kann der 90-Grad-Winkel für Steigleitungen genutzt werden?\",\"a\":\"Ja, er ist ideal, um Stränge aus Schächten auf die jeweilige Etage abzuwinkeln.\"}]},\"elbow-90\":{\"seo_p1\":\"Der 90°-Winkel (Elbow 90°) ist der Standard-Richtungswechsler in unserem Fittings-Sortiment, ausgelegt für präzise, rechtwinklige Abzweigungen.\",\"seo_p2\":\"Dieses formstabile PP-R Bauteil ist so konstruiert, dass es die mechanischen und thermischen Belastungen des Systems problemlos aufnimmt und mit allen SDR-Stufen kompatibel ist.\",\"seo_p3\":\"Perfekt für Eckverlegungen und Wanddurchführungen in der gesamten Gebäudetechnik – er garantiert einen dichten und sicheren 90-Grad-Knick ohne strömungsstörende Kanten.\",\"faq\":[{\"q\":\"Was bedeutet I/A (M/F) bei diesem Winkel?\",\"a\":\"Es bedeutet Innen/Außen (Male/Female). Eine Seite wird als Muffe geschweißt, die andere Seite kann direkt in einen anderen Fitting eingeschweißt werden.\"},{\"q\":\"Welchen Vorteil bietet die I/A-Konstruktion?\",\"a\":\"Sie spart Platz und vermeidet ein zusätzliches Rohrstück zwischen zwei Fittings, was bei engen Platzverhältnissen entscheidend ist.\"},{\"q\":\"Ändert sich dadurch der Schweißvorgang?\",\"a\":\"Der Prozess bleibt gleich, es werden lediglich Matrize und Patrize am Schweißspiegel gleichzeitig für Rohr und Fitting genutzt.\"}]},\"elbow-90-femalemale\":{\"seo_p1\":\"Der 90°-Winkel mit Innen-/Außenschweißende (Elbow 90° Female/Male) ist die Lösung für ultrakompakte Eckverbindungen direkt an anderen Bauteilen.\",\"seo_p2\":\"Dieses intelligente PP-R Fitting kombiniert ein reguläres Muffenende mit einem Einsteckende, um Formteil-an-Formteil-Schweißungen nahtlos umzusetzen.\",\"seo_p3\":\"Insbesondere bei der Montage von Armaturen oder Heizkreisverteilern reduziert dieses Design den Platzbedarf erheblich und minimiert den Material- sowie Arbeitsaufwand.\",\"faq\":[{\"q\":\"Eignet sich der 45-Grad I/A Winkel für parallele Versprünge?\",\"a\":\"Ja, kombiniert mit einem Standard-45-Grad-Winkel können so extrem kompakte Etagenversprünge realisiert werden.\"},{\"q\":\"Ist die Druckbeständigkeit der Innen-/Außen-Verbindung genauso hoch?\",\"a\":\"Die homogene Polyfusionsschweißung gewährleistet auch hier eine 100-prozentige Druckfestigkeit (PN 25) an der Verbindungsstelle.\"},{\"q\":\"Für welche Dimensionen ist dieser Winkel verfügbar?\",\"a\":\"Er wird typischerweise für die gängigen Dimensionen in der Etagenverteilung von 20 mm bis 40 mm produziert.\"}]},\"electrofusion-socket\":{\"seo_p1\":\"Die Heizwendelschweißmuffe (Electrofusion Socket) ist die Premiumlösung für Verbindungen, bei denen konventionelles Muffenschweißen aus Platzgründen nicht möglich ist.\",\"seo_p2\":\"Ausgestattet mit integrierten Heizdrähten aus einer speziellen Legierung, verschmilzt dieses PP-R Fitting automatisch und computergesteuert mit dem Basisrohr.\",\"seo_p3\":\"Ideal für Reparaturarbeiten in Schächten, nachträgliche Erweiterungen oder extrem schwer zugängliche Bereiche – sie bietet eine 100-prozentig sichere und protokollierbare Verbindung.\",\"faq\":[{\"q\":\"Muss das Rohr vor dem Elektroschweißen geschält werden?\",\"a\":\"Ja, das Entfernen der Oxidschicht mittels eines speziellen Rohrschälers ist zwingend erforderlich für eine einwandfreie Verschmelzung.\"},{\"q\":\"Welche Schweißgeräte können verwendet werden?\",\"a\":\"Es müssen K Aqua oder universelle Elektroschweißgeräte verwendet werden, die den Barcode auf der Muffe auslesen können.\"},{\"q\":\"Wann ist Elektroschweißen besser als Heizelementmuffenschweißen?\",\"a\":\"Besonders bei eingeschränkter Bewegungsfreiheit (z. B. im Schacht), wo das Gerät für die Muffenschweißung keinen Platz findet.\"}]},\"flange-adaptor\":{\"seo_p1\":\"Der Bundkragen (Flange Adaptor) fungiert als wesentliches Verbindungselement, um Kunststoffrohre sicher und lösbar an metallische Flansche oder Armaturen anzubinden.\",\"seo_p2\":\"Das PP-R Bauteil ist so geformt, dass es einen perfekten Sitz für Losflansche bietet und den hohen Anpressdruck gleichmäßig auf die Dichtung überträgt.\",\"seo_p3\":\"Unverzichtbar im industriellen Rohrleitungsbau und bei großen Verteileranlagen, ermöglicht der Bundkragen den sicheren Übergang auf Pumpen, Großventile und Stahlsysteme.\",\"faq\":[{\"q\":\"Welche Flanschnormen unterstützt der K Aqua Bundkragen?\",\"a\":\"Er ist kompatibel mit handelsüblichen DIN/EN-Flanschen (z. B. PN10, PN16) und erfordert den passenden K Aqua Losflansch.\"},{\"q\":\"Benötige ich eine zusätzliche Dichtung?\",\"a\":\"Ja, zwischen dem PP-R Bundkragen und der Gegenflanke muss zwingend eine passende EPDM-Flachdichtung eingelegt werden.\"},{\"q\":\"Wie wird der Bundkragen mit dem Rohr verbunden?\",\"a\":\"Er wird wie ein herkömmlicher Fitting durch Heizelementmuffenschweißen direkt auf das Rohr oder in eine Muffe geschweißt.\"}]},\"reducing-bush\":{\"seo_p1\":\"Die Reduziermuffe (Reducing Bush) ermöglicht den stufenlosen Übergang zwischen unterschiedlichen Rohrdimensionen innerhalb unserer Fittings-Familie.\",\"seo_p2\":\"Hergestellt aus hochfestem PP-R, ist dieses Reduzierstück so konstruiert, dass der Strömungsverlauf optimiert und Kavitation an der Querschnittsveränderung vermieden wird.\",\"seo_p3\":\"Sie wird häufig eingesetzt, um Hauptleitungen in kleinere Versorgungsstränge zu verjüngen, wodurch Materialkosten gesenkt und der Netzdruck präzise ausbalanciert wird.\",\"faq\":[{\"q\":\"Kann ich mehrere Dimensionen auf einmal überspringen?\",\"a\":\"Ja, wir bieten Reduktionen an, die mehrstufige Querschnittsverengungen in einem Bauteil realisieren, z.B. von 63 mm auf 32 mm.\"},{\"q\":\"Wird die Reduziermuffe in oder auf das Rohr geschweißt?\",\"a\":\"Die Reduzierung ist in der Regel als Innen/Außen (I/A) Fitting konzipiert: Die große Seite passt in eine Muffe, die kleine Seite nimmt das Rohr auf.\"},{\"q\":\"Hat die Verjüngung Einfluss auf den Betriebsdruck?\",\"a\":\"Nein, die Wandstärken der K Aqua Reduktionen sind so dimensioniert, dass sie dem Nenndruck des Gesamtsystems (bis PN 25) entsprechen.\"}]},\"reducing-tee\":{\"seo_p1\":\"Das reduzierte T-Stück (Reducing Tee) vereint eine 90-Grad-Abzweigung mit einer gleichzeitigen Querschnittsverjüngung im Abzweig.\",\"seo_p2\":\"Dieses multifunktionale PP-R Fitting bietet durch sein monolithisches Design höchste Stabilität und Druckfestigkeit, passend für alle Standard-SDR-Anwendungen.\",\"seo_p3\":\"In der Etagenverteilung von Trink- und Heizungswasser sorgt das reduzierte T-Stück für einen effizienten Aufbau ohne zusätzliche Reduzierstücke, was die Installation deutlich beschleunigt.\",\"faq\":[{\"q\":\"Wann nutze ich ein reduziertes T-Stück anstelle eines Standard-T-Stücks mit Reduktion?\",\"a\":\"Ein reduziertes T-Stück spart eine zusätzliche Schweißnaht und verringert den Bauraum, was es effizienter und sicherer macht.\"},{\"q\":\"Ist der Abzweig immer die reduzierte Seite?\",\"a\":\"Meistens ja, da typischerweise von der Hauptleitung kleinere Abzweige zu den Verbrauchern geführt werden.\"},{\"q\":\"Können diese T-Stücke strömungstechnische Geräusche verursachen?\",\"a\":\"Nein, die Innenradien sind hydraulisch optimiert, um Turbulenzen und Kavitationsgeräusche bei Querschnittsänderungen zu minimieren.\"}]},\"reducing-tee-large-sizes\":{\"seo_p1\":\"Das reduzierte T-Stück für Großdimensionen (Reducing Tee Large Sizes) ist speziell für industrielle Hauptleitungen mit großen Querschnitten konzipiert.\",\"seo_p2\":\"Dieses massiv ausgelegte PP-R Bauteil hält extremen Volumenströmen und Systemdrücken stand und ermöglicht einen sicheren, verjüngten Abzweig aus großen Versorgungssträngen.\",\"seo_p3\":\"Häufig verwendet in Fernkältenetzen und Hauptsteigleitungen, garantiert dieses Fitting absolute Stabilität und dauerhafte Dichtigkeit bei höchsten Belastungen.\",\"faq\":[{\"q\":\"Welches Spezialwerkzeug wird für die Montage benötigt?\",\"a\":\"Für die exakte Fräsung des Loches ist ein spezieller K Aqua Anbohrer erforderlich, sowie ein Sattelschweißwerkzeug zur Erwärmung.\"},{\"q\":\"Kann ein Sattel auf einem unter Druck stehenden Rohr montiert werden?\",\"a\":\"Nein, das Leitungssystem muss zwingend entleert und drucklos sein, bevor die Anbohrung und Schweißung erfolgt.\"},{\"q\":\"Ist die Sattelverbindung so stark wie ein T-Stück?\",\"a\":\"Ja, durch die tiefe Polyfusionsverschmelzung an der Rohrwandung erreicht der Sattelabzweig dieselbe Druckstufe wie das Basisrohr.\"}]},\"tee\":{\"seo_p1\":\"Das gleichschenklige T-Stück (Tee) ist das klassische Abzweig-Fitting für eine symmetrische Strömungsteilung in PP-R Netzwerken.\",\"seo_p2\":\"Gefertigt aus robustem Polypropylen (PP-R), bietet es drei gleich dimensionierte Muffenenden, die den Nenndruck des Rohrsystems vollumfänglich unterstützen.\",\"seo_p3\":\"Es ist das Herzstück jeder Ring- und Reihenleitung in Sanitärinstallationen und gewährleistet eine zuverlässige, druckverlustarme Verteilung des Mediums.\",\"faq\":[{\"q\":\"Verringert das T-Stück den Leitungsquerschnitt?\",\"a\":\"Nein, das Innendesign unserer T-Stücke ist auf vollen Durchgang ausgelegt, um den Volumenstrom nicht zu drosseln.\"},{\"q\":\"Ist ein T-Stück anfälliger für Ablagerungen?\",\"a\":\"Durch das extrem glatte PP-R Material (Rauigkeitswert 0,007 mm) haben Kalk und Biofilme auch in den Abzweigen keine Chance sich festzusetzen.\"},{\"q\":\"Werden bei großen T-Stücken andere Schweißzeiten benötigt?\",\"a\":\"Ja, die Anwärm-, Umstell- und Abkühlzeiten sind abhängig von der Dimension und strikt nach den DVS-Richtlinien einzuhalten.\"}]},\"cross\":{\"seo_p1\":\"Das Kreuzstück (Cross) ermöglicht die Verteilung eines Hauptstroms in drei unterschiedliche Richtungen innerhalb einer kompakten Installationsebene.\",\"seo_p2\":\"Dieses vierfache PP-R Fitting ist strömungstechnisch optimiert, um Turbulenzen zu minimieren, und fügt sich nahtlos in unsere hochdruckfesten SDR-Serien ein.\",\"seo_p3\":\"Perfekt für komplexe Verteilerschränke und zentrale Kreuzungspunkte in der Haustechnik – es ersetzt mehrere T-Stücke und spart so wertvollen Bauraum und Installationszeit.\",\"faq\":[{\"q\":\"Verursacht das Kreuzstück hohe Druckverluste?\",\"a\":\"Da vier Ströme aufeinandertreffen können, ist der Zeta-Wert höher als bei geraden Rohren, das großzügige Innendesign hält den Verlust jedoch minimal.\"},{\"q\":\"In welchen Situationen ist ein Kreuz zwingend?\",\"a\":\"Besonders in Vorwandinstallationen oder Fußbodenheizungsverteilern, wo extrem flach und symmetrisch gebaut werden muss.\"},{\"q\":\"Sind die Abzweige immer gleich groß?\",\"a\":\"Bei unserem Standard-Kreuzstück sind alle vier Anschlüsse gleich dimensioniert (z.B. 4x 20mm).\"}]},\"cross-over\":{\"seo_p1\":\"Das Überspringstück (Cross-over) ist eine clevere Lösung für Kreuzungen von Kalt- und Warmwasserleitungen auf engstem Raum.\",\"seo_p2\":\"Das geschwungene PP-R Formteil verfügt über integrierte Muffenenden und eine elegante Brückenform, die die Leitungsführung auf einer Ebene ohne Höhenversatz ermöglicht.\",\"seo_p3\":\"Es verhindert Kollisionen bei Wandinstallationen und Fußbodenheizungen und garantiert einen reibungslosen Durchfluss bei optisch perfekter, flacher Leitungsverlegung.\",\"faq\":[{\"q\":\"Wie groß ist der Bogen des Schwanenhalses?\",\"a\":\"Die Biegung ist exakt so dimensioniert, dass ein kreuzendes K Aqua Rohr gleicher oder kleinerer Dimension berührungsfrei übersprungen wird.\"},{\"q\":\"Werden für die Installation spezielle Muffen benötigt?\",\"a\":\"Der Schwanenhals (Überbogen) verfügt typischerweise über ungeschweißte Rohrenden und wird beidseitig mit Standard-Muffen in das System integriert.\"},{\"q\":\"Darf ich ein gerades PP-R Rohr selbst mit Hitze zum Überbogen formen?\",\"a\":\"Nein! Manuelles Biegen mit Heißluftgebläsen zerstört die molekulare Struktur des Rohres und führt zum sofortigen Erlöschen der Gewährleistung.\"}]},\"cross-over-pipe\":{\"seo_p1\":\"Das Überspringrohr (Cross-over Pipe) ist die verlängerte Version des Überspringstücks, ideal für Leitungsbrücken ohne direkte Muffenanbindung an den Enden.\",\"seo_p2\":\"Hergestellt aus hochwertigem PP-R, bietet dieses Brückenbauteil reine Einsteckenden, die maximale Flexibilität beim Positionieren der Schweißmuffen erlauben.\",\"seo_p3\":\"Installateure nutzen dieses Bauteil bei schwierigen Kreuzungen in großen Verteilersystemen, um die Verlegung flexibel an die Gegebenheiten der Baustelle anzupassen.\",\"faq\":[{\"q\":\"Was unterscheidet das Crossing Tee vom Kreuzstück?\",\"a\":\"Das Crossing Tee ermöglicht das kreuzungsfreie Überspringen einer Leitung und integriert gleichzeitig einen Abzweig.\"},{\"q\":\"Wie wird dieses Bauteil verschweißt?\",\"a\":\"Es wird analog zu Standard-Fittings mittels Heizelementmuffenschweißen in das Leitungsnetz eingebunden.\"},{\"q\":\"Wird der Durchfluss durch die Konstruktion gehemmt?\",\"a\":\"Trotz der kompakten Geometrie ist das Innere strömungsoptimiert, sodass keine signifikanten Querschnittsverengungen entstehen.\"}]},\"adaptor-socket-female-thread\":{\"seo_p1\":\"Die Übergangsmuffe mit Innengewinde (Adaptor Socket Female Thread) bildet eine essenzielle Schnittstelle zwischen dem verschweißten PP-R Rohrsystem und metallischen Gewindekomponenten.\",\"seo_p2\":\"Sie vereint einen robusten PP-R-Muffenkörper mit einem hochwertigen Metalleinsatz (Innengewinde). Dies sichert eine hervorragende Druckbeständigkeit bei den Standard-SDR-Stufen.\",\"seo_p3\":\"Dieses Formteil ist unverzichtbar beim Anschluss von Armaturen, Manometern und speziellen Ventilen in der Gebäudeinstallation, um dauerhaft tropffreie Übergänge zu garantieren.\",\"faq\":[{\"q\":\"Wozu dient die Montageplatte?\",\"a\":\"Die integrierte Platte mit Bohrungen ermöglicht die starre, mechanische Fixierung des Winkels direkt an der Wand oder einem Montageelement.\"},{\"q\":\"Ist das Metallgewinde korrosionsanfällig?\",\"a\":\"Nein, die metallischen Einsätze bestehen aus hochwertigem, entzinkungsfreiem Messing und sind somit hochgradig korrosionsbeständig.\"},{\"q\":\"Darf ich das Gewinde mit Hanf abdichten?\",\"a\":\"Wir empfehlen die Verwendung von Teflonband (PTFE-Band). Bei Hanf darf nur sehr sparsam und mit nicht-quellender Paste gearbeitet werden, um den Messingeinsatz nicht zu sprengen.\"}]},\"adaptor-socket-male-thread\":{\"seo_p1\":\"Die Übergangsmuffe mit Außengewinde (Adaptor Socket Male Thread) ermöglicht den festen und sicheren Anschluss des PP-R Netzes an weiterführende metallische Rohrleitungen.\",\"seo_p2\":\"Eine auszugssichere Verankerung des Messing-Außengewindes im hochfesten Polypropylen-Körper verhindert Verdrehungen und garantiert extreme Langlebigkeit bei hohen Temperatur- und Druckschwankungen.\",\"seo_p3\":\"Häufig verwendet beim Anschluss von Heizkesseln, Wärmepumpen oder Filtern, stellt diese Muffe eine dauerhafte und normgerechte Gewindeverbindung sicher.\",\"faq\":[{\"q\":\"Ist das Innengewinde durchgängig aus Messing?\",\"a\":\"Ja, das Innengewinde ist ein massiver, hochwertiger Messingeinsatz, der fest und verdrehsicher in das PP-R Material eingespritzt ist.\"},{\"q\":\"Kann die Verbindung bei Bedarf gelöst werden?\",\"a\":\"Ja, das metallische Gewinde ermöglicht jederzeit die sichere Demontage angeschlossener Apparaturen wie Pumpen oder Filter.\"},{\"q\":\"Wie hoch ist das maximale Anzugsdrehmoment?\",\"a\":\"Das Gewinde sollte mit handelsüblichem Werkzeug und Gefühl angezogen werden, um Spannungsrisse im angrenzenden Kunststoff zu vermeiden.\"}]},\"elbow-90-male-thread\":{\"seo_p1\":\"Der 90°-Übergangswinkel mit Außengewinde (Elbow 90° Male Thread) kombiniert eine rechtwinklige Richtungsänderung mit einem direkten Gewindeanschluss an Metallkomponenten.\",\"seo_p2\":\"Dieses formstabile PP-R Bauteil ist mit einem massiven Außengewinde-Einsatz versehen, der thermische Dehnungen aufnimmt und die hohen Anforderungen der SDR-Druckklassen erfüllt.\",\"seo_p3\":\"Ideal für enge Montagesituationen an Maschinen oder Verteilern, bei denen ein unmittelbarer 90-Grad-Anschluss ohne weitere Fitting-Kombinationen realisiert werden muss.\",\"faq\":[{\"q\":\"Kombiniert dieser Fitting zwei Arbeitsschritte?\",\"a\":\"Ja, er vereint einen Richtungswechsel um 90 Grad mit einem Gewindeübergang, was Platz, Material und eine Schweißnaht spart.\"},{\"q\":\"Ist das Außengewinde geraut?\",\"a\":\"Ja, K Aqua Außengewinde sind oft werkseitig leicht angeraut, damit das Dichtband (Teflon) beim Einschrauben nicht abrutscht.\"},{\"q\":\"Aus welchem Material besteht das Außengewinde?\",\"a\":\"Es besteht aus entzinkungsbeständigem Spezialmessing, das für höchste hygienische Ansprüche im Trinkwasserbereich zugelassen ist.\"}]},\"elbow-bracket-90-female-thread\":{\"seo_p1\":\"Der 90°-Wandscheibenwinkel mit Innengewinde (Elbow Bracket 90° Female Thread) ist das Standard-Bauteil für eine stabile und sichere Wandbefestigung von Auslaufarmaturen.\",\"seo_p2\":\"Dank der integrierten Befestigungslaschen am PP-R-Körper und dem robusten Innengewinde aus Metall überträgt es alle Hebelkräfte sicher in das Mauerwerk.\",\"seo_p3\":\"Es wird flächendeckend bei der Installation von Duschen, Badewannen oder Spülbecken eingesetzt, um Wasserhähne exakt und verdrehsicher zu montieren.\",\"faq\":[{\"q\":\"Kann die Wandscheibe auch im Trockenbau verwendet werden?\",\"a\":\"Ja, in Kombination mit unseren speziellen K Aqua Montageplatten lässt sie sich hervorragend in Gipskarton- oder Holzständerwänden fixieren.\"},{\"q\":\"Gibt es einen Schallschutz für dieses Bauteil?\",\"a\":\"Für optimale Schalldämmung bieten wir optionale Gummi-Schallschutzkappen an, die die Wandscheibe vom Baukörper entkoppeln.\"},{\"q\":\"Aus welchem Material besteht das Innengewinde?\",\"a\":\"Wir verwenden ausschließlich bleifreies oder entzinkungsbeständiges (DZR) Spezialmessing, konform mit den strengsten Trinkwasservorgaben.\"}]},\"elbowwall-bracket-90-female-thread\":{\"seo_p1\":\"Die verlängerte 90°-Wandscheibe (Elbow Wall Bracket 90° Female Thread) bietet durch einen größeren Abstand zusätzliche Flexibilität für tiefere Unterputzinstallationen.\",\"seo_p2\":\"Mit verlängertem PP-R-Hals und hochfestem Messing-Innengewinde ist dieses Bauteil für Installationen ausgelegt, die dicke Putz- oder Fliesenstärken überbrücken müssen.\",\"seo_p3\":\"Sanitärinstallateure nutzen dieses Element, wenn Armaturenanschlüsse in Trockenbauwänden tief versenkt werden, um die volle Druckstabilität zu erhalten.\",\"faq\":[{\"q\":\"Wann wird eine Wandscheibe mit Außengewinde anstelle eines Innengewindes verwendet?\",\"a\":\"Sie wird typischerweise benötigt, wenn flexible Panzerschläuche (z.B. von Waschtischarmaturen) mit Überwurfmutter direkt angeschlossen werden sollen.\"},{\"q\":\"Ist die Montageplatte bei starkem Zug stabil genug?\",\"a\":\"Ja, durch die drei integrierten Schraubösen wird die Hebelkraft großflächig abgeleitet, sodass die Wandbefestigung extrem stabil ist.\"},{\"q\":\"Können Verlängerungen aufgeschraubt werden?\",\"a\":\"Sollte die Wandscheibe zu tief in der Wand sitzen, können problemlos handelsübliche Hahnverlängerungen aus Messing aufgeschraubt werden.\"}]},\"metal-union-male-thread-yellow-brass\":{\"seo_p1\":\"Die Verschraubung mit Außengewinde aus Messing natur (Metal Union Male Thread Yellow Brass) ermöglicht lösbare Verbindungen zwischen PP-R und Metall auf höchstem Qualitätsniveau.\",\"seo_p2\":\"Das unbeschichtete Qualitätsmessing ist fest mit der verschweißbaren PP-R-Muffe verbunden. Ein integrierter Dichtring garantiert Sicherheit in allen gängigen SDR-Druckstufen.\",\"seo_p3\":\"Eingesetzt vornehmlich in Trinkwasserinstallationen für den Anschluss von Wasserzählern oder Pumpen, die zu Wartungszwecken schnell demontiert werden müssen.\",\"faq\":[{\"q\":\"Eignet sich dieses T-Stück für den Anschluss von Entleerungsventilen?\",\"a\":\"Ja, das Innengewinde im Abzweig ist die Standardlösung zur direkten Einschraubung von Entleerungs- oder KFE-Hähnen am tiefsten Punkt.\"},{\"q\":\"Ist der Messingeinsatz fest verankert?\",\"a\":\"Durch eine spezielle Rändelung am Messingeinsatz wird dieser unlösbar vom PP-R umschlossen, was Verdrehen beim Gewindeschneiden verhindert.\"},{\"q\":\"Reduziert das Gewinde den Durchfluss im Hauptstrang?\",\"a\":\"Nein, der Hauptstrang des T-Stücks (der Durchgang) ist vollquerschnittig und strömungsoptimiert.\"}]},\"metal-union-female-thread-yellow-brass\":{\"seo_p1\":\"Die Verschraubung mit Innengewinde aus Messing natur (Metal Union Female Thread Yellow Brass) ist die ideale Lösung für hochbelastbare, trennbare Rohrverbindungen.\",\"seo_p2\":\"Ausgestattet mit einer hochwertigen Messing-Überwurfmutter und einem PP-R-Anschweißende, bietet diese Verschraubung eine absolut spannungsfreie und dichte Verbindung.\",\"seo_p3\":\"Sie wird häufig eingesetzt, um Wartungselemente, Filter oder Ventile im Leitungsnetz einzubinden, die regelmäßig gereinigt oder ausgetauscht werden.\",\"faq\":[{\"q\":\"Wo wird das T-Stück mit Außengewinde typischerweise eingesetzt?\",\"a\":\"Es ist ideal, um Apparaturen mit Innengewinde oder Überwurfmuttern (z.B. Schmutzfänger oder kleine Umwälzpumpen) direkt abzweigen zu lassen.\"},{\"q\":\"Gibt es bei Außengewinden Rissgefahr im Kunststoff?\",\"a\":\"Nein, da bei Außengewinden die Expansionskraft des Dichtmittels (Teflon) auf den massiven Messingkörper und nicht auf den Kunststoff wirkt.\"},{\"q\":\"Kann ich es in Warmwassersystemen nutzen?\",\"a\":\"Selbstverständlich. Wie alle K Aqua Übergangsfittings ist es für Dauertemperaturen bis 70°C und kurzzeitige Spitzen von 95°C zugelassen.\"}]},\"metal-union-male-thread\":{\"seo_p1\":\"Die vernickelte Verschraubung mit Außengewinde (Metal Union Male Thread) vereint eine edle Optik mit herausragender technischer Lösbarkeit zwischen Kunststoff- und Metallsystemen.\",\"seo_p2\":\"Der vernickelte Gewindeeinsatz schützt effektiv vor äußeren Einflüssen und Korrosion, während der PP-R-Körper die gewohnte Druck- und Temperaturresistenz für SDR-Leitungen aufweist.\",\"seo_p3\":\"Besonders in der sichtbaren Vorwandinstallation oder im Heizungsbau bevorzugt, garantiert sie saubere Übergänge zu metallischen Heizkörpern oder Verteilern.\",\"faq\":[{\"q\":\"Was ist der Vorteil einer Verschraubung (Union) gegenüber einer Übergangsmuffe?\",\"a\":\"Die Verschraubung ist trennbar. Das bedeutet, das verbundene Bauteil kann später ohne Auftrennen des PP-R Rohres einfach demontiert werden.\"},{\"q\":\"Ist die Dichtung in der Verschraubung enthalten?\",\"a\":\"Ja, K Aqua Verschraubungen werden standardmäßig mit einer hochwertigen EPDM-Flachdichtung (für Wasser) geliefert.\"},{\"q\":\"Darf die Überwurfmutter mit schwerem Werkzeug angezogen werden?\",\"a\":\"Sie sollte mit einem passenden Maulschlüssel handfest plus eine Vierteldrehung angezogen werden, um die Dichtung nicht zu quetschen.\"}]},\"metal-union-female-thread\":{\"seo_p1\":\"Die vernickelte Verschraubung mit Innengewinde (Metal Union Female Thread) ist das Premium-Verbindungselement für optisch anspruchsvolle und lösbare Systemübergänge.\",\"seo_p2\":\"Durch die Kombination aus vernickelter Messing-Überwurfmutter und robustem Polypropylen (PP-R) entsteht eine formstabile, dauerhaft abgedichtete Verbindung für hohe Netzdruckstufen.\",\"seo_p3\":\"Dieses Formteil ist die bevorzugte Wahl bei der Anbindung von Wärmetauschern oder Pumpengruppen im Heizungskeller, bei denen Korrosionsschutz wichtig ist.\",\"faq\":[{\"q\":\"Wo wird diese Außengewinde-Verschraubung benötigt?\",\"a\":\"Oft als Geräteanschlussverschraubung bei Wasserzählern oder Wärmetauschern, die ein Innengewinde am Gehäuse aufweisen.\"},{\"q\":\"Bleibt das PP-R beim Festziehen spannungsfrei?\",\"a\":\"Ja, die lose Überwurfmutter fängt die Torsionskräfte beim Anziehen auf, sodass keine Drehspannung in das verschweißte Rohrnetz übertragen wird.\"},{\"q\":\"Ist das Messingmaterial trinkwasserzertifiziert?\",\"a\":\"Wir verarbeiten exklusiv hochreines DZR-Messing, welches alle Normen der europäischen Trinkwasserverordnung (UBA-Liste) erfüllt.\"}]},\"tee-90-male-thread\":{\"seo_p1\":\"Das 90°-T-Stück mit Außengewinde (Tee 90° Male Thread) ermöglicht den nahtlosen Übergang von einem durchgehenden PP-R Strang auf einen metallischen Abzweig.\",\"seo_p2\":\"Der T-Körper aus PP-R gewährleistet eine ungestörte Längsströmung, während der abzweigende Metalleinsatz (Außengewinde) höchsten Scherkräften und Systemdrücken trotzt.\",\"seo_p3\":\"Ideal für die direkte Installation von Sensoren, Entleerungsventilen oder Manometern mitten im Leitungsverlauf, ohne das Hauptnetz mechanisch zu schwächen.\",\"faq\":[{\"q\":\"Welche Vorteile hat der Einschweißsattel gegenüber einem T-Stück?\",\"a\":\"Er ermöglicht nachträgliche Abzweige ohne Trennung der Hauptleitung und minimiert den Eingriff in die Systemintegrität.\"},{\"q\":\"Wie wird der Sattel montiert?\",\"a\":\"Das Hauptrohr wird mit einem Spezialbohrer angebohrt, anschließend werden Rohr und Sattel zeitgleich erwärmt und passgenau verschmolzen.\"},{\"q\":\"Eignet er sich für Sprinkleranlagen?\",\"a\":\"Der K Aqua Sattelabzweig wird in einigen internationalen Märkten erfolgreich für die Anbindung von Sprinklerköpfen im Leichtbau eingesetzt.\"}]},\"tee-90-female-thread\":{\"seo_p1\":\"Das 90°-T-Stück mit Innengewinde (Tee 90° Female Thread) ist eine vielseitige Komponente, um eine Armatur oder einen Fühler direkt in eine durchgehende PP-R Leitung zu integrieren.\",\"seo_p2\":\"Mit zwei Schweißmuffen für den Durchfluss und einem massiven Innengewinde-Abzweig erfüllt dieses Bauteil alle Anforderungen an die Stabilität innerhalb der SDR-Druckklassen.\",\"seo_p3\":\"Oft verwendet für den Anschluss von Probenahmeventilen in Trinkwasserverteilungen oder als Schnittstelle für Thermometer in Heizungssystemen.\",\"faq\":[{\"q\":\"Bietet der Sattel mit Außengewinde die gleiche Festigkeit?\",\"a\":\"Absolut. Der Messingeinsatz ist tief in der PP-R Matrix verankert, wodurch das Bauteil voll druckfest (PN 25) bleibt.\"},{\"q\":\"Gibt es Limitierungen bei der Abzweiggröße?\",\"a\":\"Der Durchmesser des Sattelabzweigs muss technisch bedingt immer signifikant kleiner sein als der Durchmesser der Hauptleitung (z.B. 63 mm auf 1/2\\\").\"},{\"q\":\"Kann der Sattel auch an Faserrohre geschweißt werden?\",\"a\":\"Ja, er ist für alle K Aqua Rohrtypen (Standard, PPRCT, Faser, UV) nach lokaler Anbohrung gleichermaßen geeignet.\"}]},\"union\":{\"seo_p1\":\"Die Vollkunststoff-Verschraubung (Union) ist ein komplett aus Polypropylen (PP-R) gefertigtes Verbindungselement, das eine lösbare Verbindung ohne metallische Bauteile schafft.\",\"seo_p2\":\"Mit einem zuverlässigen Dichtsystem und robusten Überwurfmuttern aus Kunststoff hält diese Verschraubung dem Standard-Betriebsdruck des PP-R Rohrsystems voll stand.\",\"seo_p3\":\"Sie ist unverzichtbar für vollkommen korrosionsfreie Systeme, wie in der chemischen Industrie oder bei aggressiven Medien, wo Metallkontakt strikt vermieden werden muss.\",\"faq\":[{\"q\":\"Wann wähle ich einen PP-R Flansch anstelle eines metallischen Losflansches?\",\"a\":\"Ein PP-R Flansch wird genutzt, wenn das Fördermedium stark korrosiv ist und jeglicher Kontakt mit Metall vermieden werden muss (Vollkunststoffsystem).\"},{\"q\":\"Gibt es Druckeinschränkungen bei Voll-Kunststoffflanschen?\",\"a\":\"Da Kunststoff flexibler als Stahl ist, sind die maximalen Nenndrücke bei Kunststoffflanschen in den größeren Dimensionen leicht reduziert.\"},{\"q\":\"Werden spezielle Unterlegscheiben für die Schrauben benötigt?\",\"a\":\"Ja, es wird dringend empfohlen, großflächige Unterlegscheiben zu nutzen, um die Spannkraft der Schraube gleichmäßig auf den Kunststoff zu verteilen.\"}]},\"union-for-watermeters\":{\"seo_p1\":\"Die Wasserzähler-Verschraubung (Union for Watermeters) wurde spezifisch für die spannungsfreie und normgerechte Einbindung von Wasserzählern in PP-R Leitungen entwickelt.\",\"seo_p2\":\"Die Konstruktion umfasst ein verschweißbares PP-R Ende und eine Plombiermöglichkeit an der massiven Überwurfmutter, ausgelegt auf die Standard-Netzdrücke von Trinkwassersystemen.\",\"seo_p3\":\"Sie erlaubt einen schnellen und sicheren Wechsel der Zähleinheiten ohne Werkzeugverschleiß und verhindert Leckagen durch eine passgenaue Flachdichtung.\",\"faq\":[{\"q\":\"Was zeichnet eine Wasserzählerverschraubung aus?\",\"a\":\"Sie verfügt typischerweise über eine Plombiermöglichkeit und spezielle Gewindedimensionen, die exakt auf genormte Wasserzähler abgestimmt sind.\"},{\"q\":\"Sind die Dichtungen für Heißwasser ausgelegt?\",\"a\":\"Die mitgelieferten Spezialdichtungen sind je nach Ausführung für Kaltwasserzähler oder auch für Heißwasser (Wärmemengenzähler) spezifiziert.\"},{\"q\":\"Kann das PP-R Rohr das Gewicht des Wasserzählers tragen?\",\"a\":\"Bei größeren und schwereren Zählern (Hausanschluss) empfehlen wir eine separate Abstützung des Zählers, um das Rohrnetz nicht mechanisch zu belasten.\"}]},\"pp-r-ball-valve-ball-in-pp\":{\"seo_p1\":\"Der PP-R Kugelhahn mit PP-Kugel (PP-R Ball Valve Ball in PP) ist eine vollständig korrosionsfreie Absperrarmatur für höchste hygienische Ansprüche.\",\"seo_p2\":\"Dieses Vollkunststoffventil verfügt über einen langlebigen PP-R-Körper und eine präzise gefertigte Kugel aus Polypropylen. Es hält den Systemdrücken der SDR-Klassen zuverlässig stand.\",\"seo_p3\":\"Es wird häufig in chemischen Industrieanlagen oder bei demineralisiertem Wasser eingesetzt, da es jeglichen Metallkontakt mit dem geförderten Medium systematisch ausschließt.\",\"faq\":[{\"q\":\"Was ist der Vorteil einer Kunststoffkugel im Ventil?\",\"a\":\"Sie verhindert Korrosion und Ionenabgabe an das Medium, was für Reinstwasser oder aggressive Chemikalien zwingend erforderlich ist.\"},{\"q\":\"Ist das Ventil auch für Heißwasser geeignet?\",\"a\":\"Ja, der spezielle thermoplastische Kunststoff der Kugel und die Teflon-Dichtungen (PTFE) garantieren auch bei hohen Tempera
