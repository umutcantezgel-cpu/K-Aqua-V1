name: K-Aqua V2 CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Run ESLint
        run: pnpm eslint .

      - name: Locale parity
        run: pnpm i18n:check

      # Findet Schlüssel, die der Code verlangt, die es aber in KEINER Sprache
      # gibt — die Parität allein übersieht das, weil sie nur en/ar gegen de hält.
      - name: Message key usage
        run: pnpm i18n:usage

      # Prüft ALLE 65 Sprachdateien auf unlesbares JSON und auf Füllstrings
      # ("übersetzter Text", ".", "-").
      #
      # Dieser Schritt fehlte, und genau er hätte den teuersten i18n-Fehler
      # gefunden: Zehn Sprachdateien lagen mitten im Schreiben zerschnitten im
      # Arbeitsbaum. `i18n:check` sieht das nicht — es prüft nur de/en/ar.
      # `lib/i18n/request.ts` fängt den Parse-Fehler ab und liefert ein leeres
      # Bündel, die betroffenen Sprachen fallen also STILL auf Deutsch zurück.
      # Ohne diesen Schritt merkt es niemand.
      #
      # Bewusst `continue-on-error`: Ein laufender Übersetzungsdurchgang soll
      # die Zusammenführung nicht blockieren. Der Befund steht im Protokoll,
      # und das reicht, damit er nicht unsichtbar bleibt.
      - name: Locale placeholders
        run: pnpm i18n:placeholders
        continue-on-error: true

      # Stellt sicher, dass die erzeugte 3D-Zuordnung zur Bibliothek passt.
      # Wird ein Modell ergänzt, ohne sie neu zu erzeugen, fällt es hier auf.
      - name: 3D registry in sync
        run: pnpm 3d:check

      # Dasselbe für den Suchindex. Er führte 36 von 73 Produkten, weil er
      # neben dem Katalog von Hand gepflegt wurde. Wird ein Produkt ergänzt,
      # ohne den Index neu zu erzeugen, fällt es hier auf statt erst dann,
      # wenn ein Kunde das Produkt nicht findet.
      - name: Search index in sync
        run: pnpm search:check

      - name: Unit tests
        run: pnpm test

      - name: Build Next.js
        run: pnpm build

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      # Playwright startet den Server selbst (webServer in playwright.config.ts,
      # Port 3001). Ein zusätzliches `pnpm start` liefe auf Port 3000 und das
      # anschließende wait-on http://localhost:3001 liefe in den Timeout.
      - name: Run E2E Tests
        run: pnpm test:e2e

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
